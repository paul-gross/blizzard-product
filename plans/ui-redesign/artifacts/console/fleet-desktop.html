<style>
/* ---------- Tokens ---------- */
:root {
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", "RobotoMono Nerd Font Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* spacing: 4px base */
  --sp-0: 2px; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  /* type scale */
  --fs-2xs: 10.5px; --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 14px; --fs-xl: 16px; --fs-2xl: 20px; --fs-3xl: 24px;
  --lh-tight: 1.25; --lh-normal: 1.45;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
  /* radii, elevation, motion */
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-full: 999px;
  --dur-fast: 120ms; --dur: 180ms; --ease: cubic-bezier(.2, .7, .2, 1);

  /* density: comfortable */
  --row-h: 40px; --cell-x: 12px; --fs-body: 13px; --fs-meta: 12px; --ctl-h: 32px; --nav-h: 32px;
  --page-x: 24px; --gap: 16px; --card-pad: 16px; --topbar-h: 52px; --group-h: 36px; --ico: 16px;
}
[data-density="compact"] {
  --row-h: 28px; --cell-x: 8px; --fs-body: 12px; --fs-meta: 11px; --ctl-h: 26px; --nav-h: 26px;
  --page-x: 16px; --gap: 10px; --card-pad: 10px; --topbar-h: 42px; --group-h: 28px; --ico: 14px;
}

/* Light (default). Chrome is greyscale; hue is reserved for status. */
:root, [data-theme="light"] {
  color-scheme: light;
  --bg-canvas: #f6f7f9; --bg-surface: #ffffff; --bg-subtle: #f2f4f6; --bg-hover: #eef0f3; --bg-selected: #e7eaef;
  --bg-sidebar: #f1f3f5; --bg-inverse: #16181d; --bg-overlay: rgba(15, 18, 24, .32);
  --border: #e3e6ea; --border-strong: #cdd2d9;
  --fg: #16181d; --fg-2: #464c56; --fg-3: #646b76; --fg-on-inverse: #ffffff;
  --focus: #2563eb;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 16px 48px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);

  --nh-fg: #c22a31; --nh-bg: #fdeeee; --nh-solid: #e5484d; --nh-border: #f3c4c6;
  --wait-fg: #94570a; --wait-bg: #fdf3dc; --wait-solid: #f0a020; --wait-border: #f2d7a1;
  --run-fg: #0b5fc4; --run-bg: #ebf3fe; --run-solid: #2f7ef0; --run-border: #c4dafa;
  --dlv-fg: #0b7469; --dlv-bg: #e4f5f2; --dlv-solid: #12a594; --dlv-border: #b6e3dc;
  --done-fg: #1b7443; --done-bg: #e8f5ed; --done-solid: #2f9e62; --done-border: #bfe3cc;
  --ready-fg: #464c56; --ready-bg: #eef0f3; --ready-solid: #8a929e; --ready-border: #d6dae0;
  --backlog-solid: #a8afba;
  --proj-blizzard: #5b5bd6; --proj-winter: #a54bb6;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: #0d0f12; --bg-surface: #14171c; --bg-subtle: #1a1e24; --bg-hover: #1f242b; --bg-selected: #262c35;
  --bg-sidebar: #101317; --bg-inverse: #eceef1; --bg-overlay: rgba(0, 0, 0, .55);
  --border: #252a32; --border-strong: #343b46;
  --fg: #e9ebee; --fg-2: #b4bac4; --fg-3: #8c94a0; --fg-on-inverse: #14171c;
  --focus: #5e9bff;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6), 0 0 0 1px var(--border);

  --nh-fg: #ff8a8e; --nh-bg: #341a1c; --nh-solid: #e5484d; --nh-border: #5e2a2e;
  --wait-fg: #f3c06d; --wait-bg: #31260f; --wait-solid: #f0a020; --wait-border: #5a4418;
  --run-fg: #7db3ff; --run-bg: #132339; --run-solid: #3b86f3; --run-border: #22406a;
  --dlv-fg: #5fd3c2; --dlv-bg: #0f2c29; --dlv-solid: #12a594; --dlv-border: #1c4d47;
  --done-fg: #70d29c; --done-bg: #12281b; --done-solid: #2f9e62; --done-border: #1f4a30;
  --ready-fg: #b4bac4; --ready-bg: #20252c; --ready-solid: #7b8491; --ready-border: #343b46;
  --backlog-solid: #5d6571;
  --proj-blizzard: #8b8bf0; --proj-winter: #c77fd3;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--fg);
  background: var(--bg-canvas); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
.ico { flex: none; display: block; }
.mono { font-family: var(--font-mono); font-size: .94em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.subtle { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.st { flex: none; display: block; }
.st-nh { color: var(--nh-solid); } .st-wait { color: var(--wait-solid); } .st-run { color: var(--run-solid); }
.st-dlv { color: var(--dlv-solid); } .st-done { color: var(--done-solid); } .st-ready { color: var(--ready-solid); }
.st-backlog { color: var(--backlog-solid); }

/* ---------- Components ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-h); padding: 0 10px; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--fg); font-size: var(--fs-body);
  font-weight: var(--fw-medium); white-space: nowrap; box-shadow: var(--shadow-sm);
  transition: background var(--dur-fast), border-color var(--dur-fast);
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--bg-inverse); color: var(--fg-on-inverse); border-color: var(--bg-inverse); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--nh-fg); }
.btn.danger:hover { background: var(--nh-bg); border-color: var(--nh-border); }
.btn.danger-solid { background: var(--nh-solid); border-color: var(--nh-solid); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.icon { width: var(--ctl-h); padding: 0; justify-content: center; }
.btn.sm { height: calc(var(--ctl-h) - 6px); padding: 0 8px; font-size: var(--fs-meta); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: var(--r-sm); border: 1px solid var(--border-strong); border-bottom-width: 2px; background: var(--bg-surface);
  font-family: var(--font-sans); font-size: 10.5px; font-weight: var(--fw-medium); color: var(--fg-2); line-height: 1;
}
.kbds { display: inline-flex; gap: 3px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: var(--fw-medium); white-space: nowrap; border: 1px solid transparent; line-height: 1;
}
[data-density="compact"] .badge { height: 18px; padding: 0 6px; }
.badge.nh { background: var(--nh-bg); color: var(--nh-fg); border-color: var(--nh-border); }
.badge.wait { background: var(--wait-bg); color: var(--wait-fg); border-color: var(--wait-border); }
.badge.run { background: var(--run-bg); color: var(--run-fg); border-color: var(--run-border); }
.badge.dlv { background: var(--dlv-bg); color: var(--dlv-fg); border-color: var(--dlv-border); }
.badge.done { background: var(--done-bg); color: var(--done-fg); border-color: var(--done-border); }
.badge.ready, .badge.neutral { background: var(--ready-bg); color: var(--ready-fg); border-color: var(--ready-border); }
.badge.backlog { background: transparent; color: var(--fg-3); border: 1px dashed var(--border-strong); }
.badge .st { width: 12px; height: 12px; }
.count {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--r-full); font-size: var(--fs-xs); font-weight: var(--fw-semibold); background: var(--bg-selected); color: var(--fg-2);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.count.nh { background: var(--nh-solid); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.live { background: var(--done-solid); box-shadow: 0 0 0 3px var(--done-bg); }
.dot.warn { background: var(--wait-solid); }
.dot.nh { background: var(--nh-solid); }
.proj-sq { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.card-h {
  display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--card-pad); height: calc(var(--row-h) + 4px);
  border-bottom: 1px solid var(--border); font-weight: var(--fw-semibold); font-size: var(--fs-body);
}
.card-h .sub { font-weight: var(--fw-regular); color: var(--fg-3); font-size: var(--fs-meta); }
.card-h .right { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; }
.card-b { padding: var(--card-pad); }

/* Meter: spend fill plus an elapsed tick. */
.meter { position: relative; height: 8px; border-radius: var(--r-full); background: var(--bg-selected); overflow: visible; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-full); background: var(--ready-solid); }
.meter > i.ok { background: var(--done-solid); } .meter > i.warn { background: var(--wait-solid); } .meter > i.over { background: var(--nh-solid); }
.meter > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }

/* Pipeline stepper: where the chunk sits in its graph. */
.pipe { display: inline-flex; gap: 2px; align-items: center; }
.pipe i { width: 10px; height: 4px; border-radius: 2px; background: var(--bg-selected); }
.pipe i.past { background: var(--fg-3); opacity: .45; }
.pipe i.cur { background: var(--run-solid); }
.pipe.nh i.cur { background: var(--nh-solid); } .pipe.dlv i.cur { background: var(--dlv-solid); }
[data-density="compact"] .pipe i { width: 8px; height: 3px; }

/* Tooltip, toast, menu, modal: shared overlays */
.tip {
  position: fixed; z-index: 90; pointer-events: none; padding: 5px 8px; border-radius: var(--r-md); background: var(--bg-inverse);
  color: var(--fg-on-inverse); font-size: var(--fs-sm); font-weight: var(--fw-medium); display: none; align-items: center; gap: 8px;
  white-space: nowrap; box-shadow: var(--shadow-md);
}
.tip.show { display: inline-flex; }
.tip .kbd { background: transparent; color: inherit; border-color: rgba(127, 127, 127, .5); opacity: .85; }
.toasts { position: fixed; z-index: 95; bottom: 44px; right: 20px; display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 420px; padding: 10px 12px; border-radius: var(--r-lg);
  background: var(--bg-inverse); color: var(--fg-on-inverse); box-shadow: var(--shadow-lg); font-size: var(--fs-md);
  animation: toast-in var(--dur) var(--ease);
}
.toast .act { margin-left: auto; font-weight: var(--fw-semibold); text-decoration: underline; text-underline-offset: 2px; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.menu {
  position: fixed; z-index: 80; min-width: 220px; padding: 4px; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg); display: none;
}
.menu.open { display: block; }
.menu .mi {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border-radius: var(--r-md);
  font-size: var(--fs-md); text-align: left; color: var(--fg);
}
.menu .mi:hover, .menu .mi:focus-visible, .menu .mi.active { background: var(--bg-hover); outline: none; }
.menu .mi .r { margin-left: auto; color: var(--fg-3); display: flex; gap: 3px; align-items: center; }
.menu .mi.danger { color: var(--nh-fg); }
.menu .sep { height: 1px; background: var(--border); margin: 4px -4px; }
.menu .lbl { padding: 6px 10px 4px; font-size: var(--fs-xs); color: var(--fg-3); font-weight: var(--fw-medium); }
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--bg-overlay); display: none; }
.scrim.open { display: block; }
.modal {
  position: fixed; z-index: 75; left: 50%; top: 22%; transform: translateX(-50%); width: 440px; background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); display: none;
}
.modal.open { display: block; }
.modal h2 { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-semibold); }
.modal .mb { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 10px; font-size: var(--fs-md); color: var(--fg-2); }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg-subtle); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.input {
  height: var(--ctl-h); padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--bg-surface);
  width: 100%; font-size: var(--fs-md);
}
.input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--run-solid) 22%, transparent); } 100% { background: transparent; } }
.sec-t { font-size: var(--fs-meta); font-weight: var(--fw-semibold); color: var(--fg-2); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.sec-t .r { margin-left: auto; font-weight: var(--fw-regular); color: var(--fg-3); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Desktop shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; overflow: hidden; }
:root { --sidebar-w: 236px; }
[data-nav="collapsed"] { --sidebar-w: 56px; }
.app { transition: grid-template-columns var(--dur) var(--ease); }

.sidebar {
  background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column;
  padding: 10px 8px 8px; gap: 2px; overflow: hidden; min-width: 0;
}
.sb-top { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.tenant {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px; border-radius: var(--r-md); flex: 1; min-width: 0;
}
.tenant:hover { background: var(--bg-hover); }
.logo {
  width: 24px; height: 24px; border-radius: 6px; background: var(--bg-inverse); color: var(--fg-on-inverse);
  display: grid; place-items: center; flex: none;
}
.tenant .tn { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.tenant .tn b { font-weight: var(--fw-semibold); font-size: var(--fs-md); }
.tenant .tn span { font-size: var(--fs-xs); color: var(--fg-3); }
.tenant .ico { margin-left: auto; color: var(--fg-3); }
.sb-search {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--fg-3); margin-bottom: 8px; font-size: var(--fs-md);
}
.sb-search:hover { border-color: var(--border-strong); color: var(--fg-2); }
.sb-search .kbds { margin-left: auto; }
.nav-sec { font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--fg-3); padding: 12px 8px 4px; white-space: nowrap; height: 30px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px; height: var(--nav-h); padding: 0 8px; border-radius: var(--r-md);
  color: var(--fg-2); font-weight: var(--fw-medium); font-size: var(--fs-md); white-space: nowrap; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg-hover); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--bg-surface); color: var(--fg); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border); }
.nav-item .lbl { overflow: hidden; text-overflow: ellipsis; }
.nav-item .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.nav-item .proj-sq { margin: 0 3px; }
.nav-item .check { color: var(--fg-2); }
.sb-spacer { flex: 1; }
.sb-foot { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
.me { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; height: 36px; padding: 0 6px; border-radius: var(--r-md); text-align: left; }
.me:hover { background: var(--bg-hover); }
.avatar {
  width: 24px; height: 24px; border-radius: 50%; background: var(--bg-selected); color: var(--fg); display: grid; place-items: center;
  font-size: 10px; font-weight: var(--fw-semibold); flex: none; border: 1px solid var(--border-strong);
}
.me .tn { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.me .tn b { font-size: var(--fs-md); font-weight: var(--fw-medium); }
.me .tn span { font-size: var(--fs-xs); color: var(--fg-3); }
.sb-toggle { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-md); color: var(--fg-3); flex: none; }
.sb-toggle:hover { background: var(--bg-hover); color: var(--fg); }

/* Collapsed rail */
[data-nav="collapsed"] .sidebar { padding: 10px 8px 8px; align-items: center; }
[data-nav="collapsed"] .tenant { flex: none; width: 36px; padding: 0 6px; }
[data-nav="collapsed"] .sb-top { flex-direction: column; }
[data-nav="collapsed"] .tenant .tn, [data-nav="collapsed"] .tenant > .ico,
[data-nav="collapsed"] .nav-item .lbl, [data-nav="collapsed"] .me .tn,
[data-nav="collapsed"] .sb-search span, [data-nav="collapsed"] .sb-search .kbds { display: none; }
[data-nav="collapsed"] .sb-search { width: 36px; justify-content: center; padding: 0; border-color: transparent; background: transparent; }
[data-nav="collapsed"] .nav-item { width: 36px; justify-content: center; padding: 0; }
[data-nav="collapsed"] .nav-item .end { position: absolute; top: 2px; right: 1px; }
[data-nav="collapsed"] .nav-item .end .count { min-width: 15px; height: 15px; font-size: 9.5px; padding: 0 3px; }
[data-nav="collapsed"] #keys-btn .end, [data-nav="collapsed"] .nav-item .end .subtle, [data-nav="collapsed"] .nav-item .end .check { display: none; }
[data-nav="collapsed"] .nav-item .end .dot { width: 7px; height: 7px; margin: 3px 3px 0 0; }
[data-nav="collapsed"] .nav-sec { height: 1px; padding: 0; margin: 8px 6px; background: var(--border); width: 28px; font-size: 0; }
[data-nav="collapsed"] .sb-foot { flex-direction: column; width: 100%; }
[data-nav="collapsed"] .me { flex: none; padding: 0 6px; }

/* Main column */
.main { display: grid; grid-template-rows: var(--topbar-h) 1fr 28px; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--page-x); border-bottom: 1px solid var(--border);
  background: var(--bg-surface); min-width: 0;
}
.crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--fs-md); color: var(--fg-3); min-width: 0; }
.crumbs .sep { color: var(--border-strong); }
.crumbs .cur { color: var(--fg); font-weight: var(--fw-semibold); }
.crumbs button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: var(--r-md); color: var(--fg-2); }
.crumbs button:hover { background: var(--bg-hover); color: var(--fg); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); }
.live-pill {
  display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: var(--r-full);
  border: 1px solid var(--border); font-size: var(--fs-meta); color: var(--fg-2); background: var(--bg-subtle);
}
.live-pill b { color: var(--fg); font-weight: var(--fw-semibold); }
.live-pill .vsep { width: 1px; height: 12px; background: var(--border-strong); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-md); background: var(--bg-subtle); border: 1px solid var(--border); gap: 2px; }
.seg button {
  display: inline-flex; align-items: center; gap: 6px; height: calc(var(--ctl-h) - 6px); padding: 0 8px; border-radius: 5px;
  color: var(--fg-3); font-size: var(--fs-meta); font-weight: var(--fw-medium);
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--bg-surface); color: var(--fg); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }

.body { display: flex; min-height: 0; min-width: 0; }
.page { flex: 1; min-width: 0; overflow: auto; background: var(--bg-canvas); }
.page-h { padding: calc(var(--page-x) - 4px) var(--page-x) 0; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
.page-title { display: flex; align-items: center; gap: var(--sp-3); }
.page-title h1 { margin: 0; font-size: var(--fs-2xl); font-weight: var(--fw-semibold); letter-spacing: -.01em; }
[data-density="compact"] .page-title h1 { font-size: var(--fs-xl); }
.page-title .meta { color: var(--fg-3); font-size: var(--fs-md); }
.page-title .acts { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; }
.tabs { display: flex; gap: 2px; margin-top: calc(var(--gap) - 4px); overflow-x: auto; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 7px; height: calc(var(--ctl-h) + 6px); padding: 0 10px;
  color: var(--fg-3); font-weight: var(--fw-medium); font-size: var(--fs-md); white-space: nowrap; border-radius: var(--r-md) var(--r-md) 0 0;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--fg); border-radius: 2px; }
.tab .count { height: 17px; }
.tab.add { color: var(--fg-3); }

/* Status bar */
.statusbar {
  display: flex; align-items: center; gap: 14px; padding: 0 var(--page-x) 0 12px; border-top: 1px solid var(--border);
  background: var(--bg-sidebar); font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; overflow: hidden; min-width: 0;
}
.statusbar .it { display: inline-flex; align-items: center; gap: 6px; }
.statusbar b { color: var(--fg-2); font-weight: var(--fw-medium); }
.statusbar .meter { width: 56px; height: 5px; }
.statusbar .meter > b { top: -2px; bottom: -2px; width: 1.5px; }
.statusbar .r { margin-left: auto; display: inline-flex; gap: 14px; align-items: center; }
.statusbar .ev { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Drawer */
.drawer {
  width: 0; flex: none; overflow: hidden; border-left: 1px solid var(--border); background: var(--bg-surface);
  display: flex; flex-direction: column; transition: width var(--dur) var(--ease);
}
.drawer.open { width: var(--drawer-w, 520px); box-shadow: -8px 0 24px rgba(16, 24, 40, .05); }
.drawer-in { width: var(--drawer-w, 520px); display: flex; flex-direction: column; min-height: 0; height: 100%; }
.dr-h { padding: 12px var(--card-pad) 0; border-bottom: 1px solid var(--border); }
.dr-bar { display: flex; align-items: center; gap: 6px; }
.dr-bar .id { font-family: var(--font-mono); font-size: var(--fs-md); color: var(--fg-2); }
.dr-bar .r { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.dr-title { margin: 10px 0 4px; font-size: var(--fs-xl); font-weight: var(--fw-semibold); line-height: 1.3; letter-spacing: -.005em; }
[data-density="compact"] .dr-title { font-size: var(--fs-lg); margin-top: 6px; }
.dr-sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--fg-3); font-size: var(--fs-meta); }
.dr-acts { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.dr-b { overflow: auto; flex: 1; padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--gap); }
.callout {
  border-radius: var(--r-lg); padding: 10px 12px; border: 1px solid var(--nh-border); background: var(--nh-bg); color: var(--fg);
  display: flex; gap: 10px; font-size: var(--fs-md);
}
.callout .ico { color: var(--nh-fg); margin-top: 2px; }
.callout b { color: var(--nh-fg); font-weight: var(--fw-semibold); }
.callout.warn { border-color: var(--wait-border); background: var(--wait-bg); } .callout.warn .ico, .callout.warn b { color: var(--wait-fg); }
.props { display: grid; grid-template-columns: 116px 1fr; row-gap: 2px; font-size: var(--fs-md); }
.props dt { color: var(--fg-3); height: calc(var(--row-h) - 10px); display: flex; align-items: center; }
.props dd { margin: 0; display: flex; align-items: center; gap: 6px; min-height: calc(var(--row-h) - 10px); min-width: 0; }
.chip-link {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border);
  font-size: var(--fs-meta); background: var(--bg-surface);
}
.chip-link:hover { background: var(--bg-hover); }

/* Command palette */
.palette {
  position: fixed; z-index: 85; left: 50%; top: 14%; transform: translateX(-50%); width: 640px; max-height: 64vh;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
  display: none; flex-direction: column; overflow: hidden;
}
.palette.open { display: flex; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--border); color: var(--fg-3); }
.pal-in input:focus-visible { outline: none; }
.pal-in input { flex: 1; border: 0; background: transparent; font-size: var(--fs-xl); color: var(--fg); height: 100%; }
.pal-in input::placeholder { color: var(--fg-3); }
.pal-scope { display: flex; gap: 6px; padding: 8px 12px 0; }
.pal-list { overflow: auto; padding: 6px; }
.pal-g { font-size: var(--fs-xs); color: var(--fg-3); font-weight: var(--fw-medium); padding: 8px 10px 4px; }
.pal-i { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-md); color: var(--fg); }
.pal-i .ico, .pal-i .st { color: var(--fg-3); }
.pal-i .st-nh { color: var(--nh-solid); }
.pal-i .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.pal-i .t .mono { color: var(--fg-3); margin-right: 8px; }
.pal-i .r { margin-left: auto; display: flex; gap: 3px; color: var(--fg-3); font-size: var(--fs-meta); flex: none; }
.pal-i[aria-selected="true"] { background: var(--bg-hover); box-shadow: inset 2px 0 0 var(--fg); }
.pal-f { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--fg-3); background: var(--bg-subtle); }
.pal-f span { display: inline-flex; gap: 6px; align-items: center; }
.pal-empty { padding: 24px; text-align: center; color: var(--fg-3); }

/* Shortcuts sheet */
.keys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
.keys-grid div { display: flex; justify-content: space-between; align-items: center; height: 26px; font-size: var(--fs-md); color: var(--fg-2); }
.keys-grid h3 { grid-column: 1 / -1; margin: 10px 0 2px; font-size: var(--fs-xs); color: var(--fg-3); font-weight: var(--fw-medium); }
.dr-b > * { flex: none; }

/* ---------- Chunks page ---------- */
.page.flexcol { display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  display: flex; align-items: center; gap: 6px; padding: 8px var(--page-x); border-bottom: 1px solid var(--border); background: var(--bg-surface); flex-wrap: nowrap;
}
.filter-in { position: relative; width: 260px; flex: none; }
.filter-in .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.filter-in .input { padding-left: 30px; padding-right: 30px; height: var(--ctl-h); }
.filter-in .kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-h); padding: 0 9px; border-radius: var(--r-md);
  border: 1px dashed var(--border-strong); color: var(--fg-2); font-size: var(--fs-meta); font-weight: var(--fw-medium); white-space: nowrap;
}
.fchip:hover { background: var(--bg-hover); color: var(--fg); }
.fchip.set { border-style: solid; background: var(--bg-subtle); color: var(--fg); }
.fchip.set .v { color: var(--fg); font-weight: var(--fw-semibold); }
.toolbar .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* Summary cards: click to apply a view */
.stats { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr 1.25fr; gap: var(--gap); padding: var(--gap) var(--page-x) 0; }
.stat {
  text-align: left; padding: 12px 14px; border-radius: var(--r-lg); background: var(--bg-surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.stat:hover { border-color: var(--border-strong); }
.stat .k { display: flex; align-items: center; gap: 6px; font-size: var(--fs-meta); color: var(--fg-2); font-weight: var(--fw-medium); }
.stat .v { font-size: var(--fs-3xl); font-weight: var(--fw-semibold); letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: var(--fs-md); font-weight: var(--fw-medium); color: var(--fg-3); letter-spacing: 0; margin-left: 4px; }
.stat .d { font-size: var(--fs-meta); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.nh { border-color: var(--nh-border); background: var(--nh-bg); box-shadow: inset 3px 0 0 var(--nh-solid), var(--shadow-sm); }
.stat.nh .k, .stat.nh .v { color: var(--nh-fg); }
.stat.nh .d { color: var(--fg-2); }
.stat .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 2px; margin-top: 2px; }
.stat .bar i { display: block; height: 100%; }
[data-density="compact"] .stats { padding-top: var(--gap); }
[data-density="compact"] .stat { padding: 6px 10px; flex-direction: row; align-items: center; gap: 8px; }
[data-density="compact"] .stat .k { white-space: nowrap; flex: none; }
[data-density="compact"] .stat .v { font-size: var(--fs-lg); flex: none; }
[data-density="compact"] .stat .v small { display: none; }
[data-density="compact"] .stat .d { min-width: 0; }
[data-density="compact"] .stat .bar { display: none; }

/* Table */
.scroller { flex: 1; overflow: auto; padding: 0 var(--page-x) var(--page-x); min-height: 0; }
.scroller > :first-child { margin-top: var(--gap); }
.tbl { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); min-width: 0; }
.tbl {
  --cols: 30px 76px minmax(0, 1fr) 164px 92px 176px 86px 72px 64px;
}
.with-drawer .tbl { --cols: 30px 76px minmax(0, 1fr) 92px 120px 76px; }
.with-drawer .t1 .ref { display: none; }
[data-density="compact"] .with-drawer .stat .d { display: none; }
.with-drawer .node-cell .pipe, .with-drawer .nh-acts .lbl-t, .with-drawer .tb-opt, .with-drawer .tb-lbl { display: none; }
.with-drawer .nh-acts .btn { width: calc(var(--ctl-h) - 6px); padding: 0; justify-content: center; }
.with-drawer .filter-in { width: 200px; }
.toolbar { min-width: 0; overflow: hidden; }
.dep { overflow: hidden; } .dep > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.with-drawer .c-runner, .with-drawer .c-pr, .with-drawer .c-at { display: none !important; }
.tr { display: grid; grid-template-columns: var(--cols); align-items: center; min-height: var(--row-h); border-top: 1px solid var(--border); position: relative; }
.th {
  min-height: calc(var(--row-h) - 8px); border-top: 0; background: var(--bg-subtle); font-size: var(--fs-xs); color: var(--fg-3);
  font-weight: var(--fw-medium); position: sticky; top: 0; z-index: 3; border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-bottom: 1px solid var(--border);
}
.th + .grp { border-top: 0; }
.td { padding: 0 var(--cell-x); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.td.st-cell { padding-right: 0; padding-left: calc(var(--cell-x) + 2px); }
.td.r { text-align: right; }
.td.id { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--fg-2); }
.row { cursor: default; outline: none; }
.row:hover { background: var(--bg-subtle); }
.row[aria-selected="true"] { background: var(--bg-selected); }
.row:focus-visible, .row.kfocus { box-shadow: inset 2px 0 0 var(--focus), inset 0 0 0 1px color-mix(in srgb, var(--focus) 35%, transparent); }
.title-cell { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding-top: 4px; padding-bottom: 4px; }
.t1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.t1 .tt { overflow: hidden; text-overflow: ellipsis; font-weight: var(--fw-medium); color: var(--fg); }
.t1 .ref { color: var(--fg-3); font-size: var(--fs-meta); flex: none; font-variant-numeric: tabular-nums; }
.t1 .more { flex: none; }
.epic {
  flex: none; font-size: var(--fs-2xs); font-weight: var(--fw-semibold); letter-spacing: .02em; color: var(--fg-2); padding: 1px 5px;
  border-radius: var(--r-sm); background: var(--bg-subtle); border: 1px solid var(--border);
}
.t2 { font-size: var(--fs-meta); color: var(--nh-fg); overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
[data-density="compact"] .t2 { display: none; }
.node-cell { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: var(--fs-meta); }

// Linear-style status glyphs: the shape carries the state so colour is never the only cue.
function statusIcon(status, size = 14) {
  const s = size, r = 6, c = 'currentColor';
  const ring = (dash = '') => `<circle cx="8" cy="8" r="${r}" fill="none" stroke="${c}" stroke-width="1.6" ${dash}/>`;
  let body = '';
  switch (status) {
    case 'backlog': body = ring('stroke-dasharray="2.2 2.2"'); break;
    case 'ready': body = ring(); break;
    case 'waiting': body = ring() + '<path d="M8 5v3.2l2 1.3" stroke="' + c + '" stroke-width="1.5" fill="none" stroke-linecap="round"/>'; break;
    case 'running': body = ring() + '<path d="M8 4.5a3.5 3.5 0 0 1 0 7z" fill="' + c + '"/>'; break;
    case 'delivering': body = ring() + '<path d="M8 4.5a3.5 3.5 0 1 1-3.5 3.5H8z" fill="' + c + '"/>'; break;
    case 'needs_human': body = `<circle cx="8" cy="8" r="7" fill="${c}"/><path d="M8 4.4v4.4" stroke="var(--bg-surface)" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.3" r="1.05" fill="var(--bg-surface)"/>`; break;
    case 'done': body = `<circle cx="8" cy="8" r="7" fill="${c}"/><path d="m5 8.2 2 2 4-4.2" stroke="var(--bg-surface)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; break;
  }
  const role = (STATUS[status] || {}).role || 'ready';
  return `<svg class="st st-${role}" width="${s}" height="${s}" viewBox="0 0 16 16" role="img" aria-label="${(STATUS[status] || {}).label || status}">${body}</svg>`;
}

/* ----- Keyboard ----- */
let gPending = 0;
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input, textarea, select');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.classList.contains('open') ? closePalette() : openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); toggleNav(); return; }
  if (e.key === 'Escape') { if (closePalette() || closeModal() || closeMenu()) { e.preventDefault(); return; } }
  if (pal.classList.contains('open') || modal.classList.contains('open')) return;
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (gPending && Date.now() - gPending < 1200) {
    gPending = 0;
    const map = { i: 'board-desktop.html?view=attention', c: 'board-desktop.html', f: 'fleet-desktop.html' };
    const k = e.key.toLowerCase();
    if (map[k]) location.href = map[k]; else toast('That section is outside this mock.');
    e.preventDefault(); return;
  }
  if (e.key === 'g') { gPending = Date.now(); return; }
  if (e.key === '[') { toggleNav(); e.preventDefault(); return; }
  if (e.key === 'D' && e.shiftKey) { toggleDensity(); e.preventDefault(); return; }
  if (e.key === 'T' && e.shiftKey) { toggleTheme(); e.preventDefault(); return; }
  if (e.key === '?') { openKeys(); e.preventDefault(); return; }
  for (const h of SHELL.keyHandlers) if (h(e)) { e.preventDefault(); return; }
});

  const h = HOSTS[0];
  $('#content').innerHTML = `<div class="fgrid">
    <section class="card">
      <div class="card-h">Subscription windows<span class="sub">Rolling spend that throttles claims</span>
        <span class="right legend"><span><i></i>Spent</span><span><i class="tick"></i>Window elapsed</span></span></div>
      <div>${WINDOWS.map(windowRow).join('')}</div>
      <div class="card-f">${icon('gauge', 13)}A runner declines new claims while its spend outpaces the elapsed share of any window; chunks it already holds keep running.</div>
    </section>
    <section class="card hostcard" aria-label="Host ${h.name}">
      <div class="card-h">${icon('server', 15)}${h.name}<span class="mono subtle" style="font-weight:400;font-size:var(--fs-meta)">${h.id}</span>
        <span class="right"><span class="badge done"><span class="dot live" style="width:6px;height:6px;box-shadow:none"></span>Online</span></span></div>
      <dl class="hb">
        <dt>Last report</dt><dd class="num"><span data-ago="${h.lastReport}">${h.lastReport}s</span> ago <span class="subtle">· 2026/10/25 13:10:01</span></dd>
        <dt>URL</dt><dd class="mono">${h.url}</dd>
        <dt>Token</dt><dd><span class="badge done">${icon('key', 11)}Enrolled</span></dd>
        <dt>Agents</dt><dd>6 across 2 runners · 10 / 14 environments in use</dd>
        <dt>Registered</dt><dd class="num">${h.registered} <span class="subtle">· added by ${h.addedBy}</span></dd>
      </dl>
      <div class="ha"><button class="btn sm" data-host="enroll">${icon('plus', 13)}Enroll</button><button class="btn sm" data-host="revoke">${icon('key', 13)}Revoke token</button><span class="sp"></span><button class="btn sm danger" data-host="retire">${icon('trash', 13)}Retire host</button></div>
    </section>
    <section class="card full">
      <div class="card-h">Runners<span class="count">${RUNNERS.length}</span><span class="sub">claim work from bound workspaces, spending one subscription each</span>
        <span class="right"><button class="btn sm">${icon('plus', 13)}Add runner</button></span></div>
      <div class="rtbl" role="grid" aria-label="Runners">
        <div class="tr th" role="row" style="position:static;border-radius:0"><div class="td">Runner</div><div class="td">State</div><div class="td c-opt">Harness</div><div class="td c-opt">Spends</div><div class="td">Environments</div><div class="td c-opt">Agents</div><div class="td c-opt">Binds</div><div class="td">Last seen</div><div class="td r">Actions</div></div>
        ${RUNNERS.map(runnerRow).join('')}
      </div>
    </section>
    <section class="card full">
      <div class="card-h">Workspaces &amp; environment slots<span class="count">10 / 14</span><span class="sub">each slot holds one chunk on one runner</span>
        <span class="right legend"><span>${statusIcon('running', 12)}Running</span><span>${statusIcon('delivering', 12)}Delivering</span><span>${statusIcon('needs_human', 12)}Needs human</span></span></div>
      ${WORKSPACES.map(w => `<div class="wsrow">
        <span class="wsname"><b><span class="proj-sq" style="background:var(--proj-${w.project})"></span>${w.name}</b><span>${w.slots.filter(Boolean).length} / ${w.slots.length} in use · ${w.project}</span></span>
        <div class="slots">${w.slots.map(id => slotTile(id, w)).join('')}</div></div>`).join('')}
    </section>
  </div>`;
  $('#page').classList.toggle('with-drawer', !!FS.selected);
  bind();
}
function bind() {
  $$('#content [data-runner]').forEach(el => el.onclick = e => {
    const a = e.target.closest('[data-ract]'); const r = RUNNERS.find(x => x.name === el.dataset.runner);
    FS.focus = +el.dataset.idx;
    if (a && a.dataset.ract === 'pause') { e.stopPropagation(); return togglePause(r); }
    if (a && a.dataset.ract === 'more') { e.stopPropagation(); return openMenu(a, runnerMenu(r)); }
    openRunner(r.name);
  });
  $$('#content [data-chunk]').forEach(el => el.onclick = () => location.href = 'board-desktop.html?drawer=' + el.dataset.chunk);
  $$('#content [data-host]').forEach(b => b.onclick = () => hostAction(b.dataset.host));
}
function togglePause(r) {
  if (FS.paused.has(r.name)) { FS.paused.delete(r.name); toast(`${r.name} resumed — claiming from ${r.binds[0][1]}`); }
  else { FS.paused.add(r.name); toast(`${r.name} paused — its ${r.held.length} held chunks finish their current step, then park`, { label: 'Undo', run: () => togglePause(r) }); }
  render(); if (FS.selected) renderRunner();
}
function runnerMenu(r) {
  return [
    { label: FS.paused.has(r.name) ? 'Resume runner' : 'Pause runner', icon: icon('pause', 16), run: () => togglePause(r) },
    { label: 'Edit bindings', icon: icon('link', 16) },
    { label: 'View events', icon: icon('activity', 16) },
    { sep: true },
    { label: 'Revoke runner token…', icon: icon('key', 16), danger: true, run: () => confirmAction({ title: `Revoke ${r.name}'s token?`, body: `${r.name} stops reporting at once. Its ${r.held.length} held chunks are requeued at their current node when the hub notices the runner gone.`, label: 'Revoke token', onConfirm: () => toast(`${r.name} token revoked`) }) },
    { label: 'Retire runner…', icon: icon('trash', 16), danger: true, run: () => confirmAction({ title: `Retire ${r.name}?`, body: `Retiring removes the runner from the fleet for good. Its bindings to <b>${r.binds.map(b => b[1]).join('</b> and <b>')}</b> are dropped and its ${r.held.length} held chunks are requeued.`, label: 'Retire runner', typeName: r.name, onConfirm: () => toast(`${r.name} retired`) }) },
  ];
}
function hostAction(a) {
  const h = HOSTS[0];
  if (a === 'enroll') toast(`Enrollment command for ${h.name} copied — run it on the host to re-issue its token`);
  if (a === 'revoke') confirmAction({ title: `Revoke ${h.name}'s token?`, body: `Both runners on <b>${h.name}</b> lose their connection to the hub. Ten held chunks are requeued once the host is seen gone. Re-enroll to restore it.`, label: 'Revoke token', onConfirm: () => toast(`${h.name} token revoked`) });
  if (a === 'retire') confirmAction({ title: `Retire host ${h.name}?`, body: `This permanently removes <b>${h.name}</b> (${h.id}) and its 2 runners from the fleet. 10 held chunks — 2 of them needing a human — are requeued. This cannot be undone.`, label: 'Retire host', typeName: h.name, onConfirm: () => toast(`${h.name} retired`) });
}
function openRunner(name) {
  FS.selected = name;
  const u = new URL(location); u.searchParams.set('drawer', name); history.replaceState(null, '', u);
  render(); renderRunner(); $('#drawer').classList.add('open');
}
function closeRunner() {
  if (!FS.selected) return false;
  FS.selected = null; $('#drawer').classList.remove('open');
  const u = new URL(location); u.searchParams.delete('drawer'); history.replaceState(null, '', u);
  render(); return true;
}
function renderRunner() {
  const r = RUNNERS.find(x => x.name === FS.selected); if (!r) return;
  const paused = FS.paused.has(r.name);
  $('#drawer').innerHTML = `<div class="drawer-in" role="complementary" aria-label="Runner ${r.name}">
    <div class="dr-h">
      <div class="dr-bar">${icon('server', 15)}<span class="badge ${paused ? 'neutral' : r.state === 'declining' ? 'wait' : 'run'}">${paused ? 'Paused' : r.state === 'declining' ? 'Declining' : 'Working'}</span><span class="id">${r.id}</span>
        <span class="r"><button class="btn ghost icon sm" data-d="close" aria-label="Close" data-tip="Close" data-tip-kbd="Esc">${icon('x', 16)}</button></span></div>
      <h2 class="dr-title">${r.name}</h2>
      <div class="dr-sub"><span>${r.harness}</span><span>·</span><span>${r.agents} agents</span><span>·</span><span>on ${r.host}</span><span>·</span><span class="mono">${r.version}</span></div>
      <div class="dr-acts"><button class="btn" data-d="pause">${icon(paused ? 'play' : 'pause', 15)}${paused ? 'Resume runner' : 'Pause runner'}</button><button class="btn">${icon('link', 15)}Edit bindings</button><button class="btn ghost icon" data-d="more" aria-label="More">${icon('more', 16)}</button></div>
    </div>
    <div class="dr-b">
      ${r.state === 'declining' ? `<div class="callout warn">${icon('alert', 16)}<div><b>Declining new work until 14:41</b><div style="color:var(--fg-2);margin-top:2px">Pace 7d: 8% spent, 7% elapsed. Held chunks keep running; the runner claims nothing new until spend falls back under the window's pace.</div></div></div>` : ''}
      <dl class="props">
        <dt>Spends</dt><dd>${r.spends}</dd>
        <dt>Harness</dt><dd><span class="badge neutral">${r.harness}</span></dd>
        <dt>Gates</dt><dd>${r.gates}</dd>
        <dt>Last seen</dt><dd class="num">${r.lastSeen}s ago</dd>
        <dt>Version</dt><dd class="mono">${r.version}</dd>
      </dl>
      <div><div class="sec-t">Binds</div><div class="held">${r.binds.map(b => `<a href="#"><span class="proj-sq" style="background:var(--proj-${b[0]})"></span><span>${b[0]}</span><span class="t">workspace ${b[1]}</span><span class="subtle">${b[2]} working</span></a>`).join('')}</div></div>
      <div><div class="sec-t">Held chunks<span class="r">${r.held.length} of ${r.envs} environments</span></div><div class="held">
        ${r.held.map(id => { const c = BY_ID[id]; return `<a href="board-desktop.html?drawer=${id}">${statusIcon(c.status, 14)}<span class="mono">${id}</span><span class="t">${esc(c.refs[0].title)}</span><span class="badge ${STATUS[c.status].role}">${c.status === 'needs_human' ? 'Needs human' : c.node}</span></a>`; }).join('')}
      </div></div>
    </div></div>`;
  $$('#drawer [data-d]').forEach(b => b.onclick = () => {
    if (b.dataset.d === 'close') closeRunner();
    if (b.dataset.d === 'pause') togglePause(r);
    if (b.dataset.d === 'more') openMenu(b, runnerMenu(r));
  });
}

function bootFleet() {
  bootShell({ page: 'fleet', topbar: { title: 'Hosts & runners' } });
  $('#page-h').innerHTML = `
    <div class="page-title"><h1>Hosts &amp; runners</h1><span class="meta">1 host online · 2 runners · 10 / 14 environments in use · 6 agents</span>
      <div class="acts"><button class="btn" data-pal>${icon('search', 15)}Find runner</button><button class="btn primary" id="enroll-btn">${icon('plus', 15)}Enroll host</button></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true">Overview</button>
      <button class="tab" role="tab" aria-selected="false">Hosts<span class="count">1</span></button>
      <button class="tab" role="tab" aria-selected="false">Runners<span class="count">2</span></button>
      <button class="tab" role="tab" aria-selected="false">Workspaces<span class="count">3</span></button>
      <button class="tab" role="tab" aria-selected="false">Enrollment tokens</button>
      <button class="tab" role="tab" aria-selected="false">Audit log</button>
    </div>`;
  $$('#page-h .tab[aria-selected="false"]').forEach(t => t.onclick = () => toast('Each tab is the full table of one object type — the overview is designed here.'));
  $('#enroll-btn').onclick = () => hostAction('enroll');
  $('[data-pal]').onclick = () => openPalette('r-');
  render();
  if (FS.selected) { renderRunner(); $('#drawer').classList.add('open'); }
  SHELL.commands = [
    ...RUNNERS.map(r => ({ group: 'Fleet', suggest: true, label: `${FS.paused.has(r.name) ? 'Resume' : 'Pause'} runner ${r.name}`, icon: icon('pause', 16), run: () => togglePause(r) })),
    ...RUNNERS.map(r => ({ group: 'Fleet', label: `Open runner ${r.name}`, icon: icon('server', 16), right: `<span class="subtle">${r.harness}</span>`, run: () => openRunner(r.name) })),
    { group: 'Fleet', label: 'Enroll host', icon: icon('plus', 16), run: () => hostAction('enroll') },
    { group: 'Fleet', label: 'Revoke token for host xps…', icon: icon('key', 16), run: () => hostAction('revoke') },
    { group: 'Fleet', label: 'Retire host xps…', icon: icon('trash', 16), run: () => hostAction('retire') },
  ];
  SHELL.keyHandlers.push(e => {
    const rows = RUNNERS.map(r => r.name);
    if (e.key === 'j' || e.key === 'ArrowDown') { FS.focus = Math.min(rows.length - 1, FS.focus + 1); focusRow(); return true; }
    if (e.key === 'k' || e.key === 'ArrowUp') { FS.focus = Math.max(0, FS.focus - 1); focusRow(); return true; }
    if (e.key === 'Enter' || e.key === 'o') { openRunner(rows[FS.focus]); return true; }
    if (e.key === 'p') { togglePause(RUNNERS[FS.focus]); return true; }
    if (e.key === 'Escape') return closeRunner();
    return false;
  });
  function focusRow() {
    $$('#content .kfocus').forEach(el => el.classList.remove('kfocus'));
    $(`#content [data-idx="${FS.focus}"]`)?.classList.add('kfocus');
    if (FS.selected) openRunner(RUNNERS[FS.focus].name);
  }
  // Heartbeats count up between reports.
  setInterval(() => $$('[data-ago]').forEach(el => { el.dataset.ago = +el.dataset.ago + 1; el.textContent = el.dataset.ago + 's'; }), 1000);
  if (PARAMS.get('confirm') === 'retire') setTimeout(() => hostAction('retire'), 30);
}
bootFleet();

</script>
</body>
</html>
