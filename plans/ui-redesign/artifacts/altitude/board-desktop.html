<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>blizzard — altitude · board · desktop</title>
<style>/* Altitude — one continuous space, seen at five fidelities. */
:root{
  --paper:#ECEAE2; --sheet:#F6F5F0; --ink:#121110; --ink2:#4F4C45; --ink3:#8C887D; --ink4:#B9B5A9;
  --rule:#D5D1C5; --rule2:#E2DFD5;
  --hum:#E03A12; --hum-bg:#FBE4DA; --live:#1F3DFF; --live-bg:#E3E7FF; --ok:#1B7F4B;
  --sans:"Noto Sans",sans-serif; --mono:"Noto Sans Mono",monospace; --serif:"STIX Two Text",serif;
  --hatch:repeating-linear-gradient(135deg,transparent 0 3px,rgba(18,17,16,.13) 3px 4px);
}
body.night{
  --paper:#0F0E0C; --sheet:#171613; --ink:#EDE9DD; --ink2:#B4AFA2; --ink3:#7A766C; --ink4:#4A4740;
  --rule:#2B2924; --rule2:#211F1B; --hum:#FF5B33; --hum-bg:#3A1A10; --live:#8C9DFF; --live-bg:#1B1F3D; --ok:#5BC48A;
  --hatch:repeating-linear-gradient(135deg,transparent 0 3px,rgba(237,233,221,.12) 3px 4px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 13px/1.35 var(--sans);font-stretch:87.5%;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono);font-stretch:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--live);color:#fff}

/* ---------- frame ---------- */
#app{display:grid;grid-template-rows:auto auto 1fr 26px;height:100vh}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:10px 18px 8px;border-bottom:1px solid var(--ink)}
.mark{font-weight:800;font-stretch:62.5%;font-size:22px;letter-spacing:-.01em;line-height:1}
.mark small{display:block;font-weight:400;font-size:11px;color:var(--ink3);font-stretch:87.5%;letter-spacing:0;margin-top:2px}

/* the query line */
.ql{position:relative;display:flex;align-items:center;height:38px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:3px;padding:0 10px 0 0}
.ql .pr{font:700 15px var(--mono);padding:0 10px;color:var(--ink3);align-self:stretch;display:flex;align-items:center;border-right:1px solid var(--rule)}
.ql.on{box-shadow:0 0 0 3px var(--live-bg);border-color:var(--live)}
.ql.on .pr{color:var(--live)}
.qwrap{position:relative;flex:1;height:100%}
.qwrap input,.qwrap .hl{position:absolute;inset:0;font:500 14.5px/36px var(--mono);padding:0 12px;white-space:pre;border:0;background:transparent;letter-spacing:0}
.qwrap input{color:transparent;caret-color:var(--live);outline:none;width:100%}
.qwrap .hl{pointer-events:none;overflow:hidden;color:var(--ink)}
.qwrap .ph{color:var(--ink3);font-weight:400}
.t-key{color:var(--ink2)} .t-val{color:var(--ink);font-weight:700}
.t-cmp{color:var(--live);font-weight:700} .t-pipe{color:var(--ink3);font-weight:700} .t-op{color:var(--live);font-weight:700}
.t-act{color:var(--hum);font-weight:800} .t-view{color:var(--live);font-weight:700;text-decoration:underline;text-underline-offset:3px} .t-txt{color:var(--ink)} .t-err{color:var(--hum);text-decoration:wavy underline}
.qmeta{font:500 12px var(--mono);color:var(--ink3);white-space:nowrap;padding-left:8px}
.qmeta b{color:var(--ink)}
.sugg{position:absolute;left:-1.5px;right:-1.5px;top:38px;background:var(--sheet);border:1.5px solid var(--live);border-top:1px solid var(--rule);z-index:30;display:none;max-height:380px;overflow:auto;border-radius:0 0 3px 3px}
.ql.on .sugg.show{display:block}
.sg{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:6px 12px;align-items:baseline;cursor:pointer}
.sg .a{font:700 13px var(--mono);color:var(--live)} .sg .b{font:400 13px var(--mono);color:var(--ink2)} .sg .c{color:var(--ink3);font-size:12px}
.sg.cur{background:var(--live-bg)}
.sghd{padding:7px 12px 3px;color:var(--ink3);font-size:11.5px;font-stretch:75%;border-top:1px solid var(--rule2)}
.sghd:first-child{border-top:0}

/* instrument readout: text first, never tiles */
.inst{display:flex;align-items:center;gap:20px;white-space:nowrap}
.spend{font:600 22px/1 var(--sans);font-stretch:62.5%;letter-spacing:-.01em}
.spend small{font-weight:400;font-size:12px;color:var(--ink3);font-stretch:87.5%;margin-left:4px}
.win{display:grid;grid-template-columns:auto 76px;column-gap:6px;row-gap:3px;align-items:center;font-size:11px;color:var(--ink2)}
.win .lbl{font-stretch:75%;text-align:right}
.trk{position:relative;height:5px;background:var(--rule2);outline:1px solid var(--rule)}
.trk i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.trk i.hot{background:var(--hum)}
.trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--live)}
.hub{font-size:12px;color:var(--ink2)}
.hub b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;animation:beat 2s infinite}
@keyframes beat{50%{opacity:.35}}

/* zoom strip: breadcrumb is the zoom path */
.zs{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:22px;padding:7px 18px;border-bottom:1px solid var(--rule);font-size:12.5px}
.crumb{display:flex;align-items:center;gap:0;white-space:nowrap;overflow:hidden}
.crumb span{color:var(--ink3);padding:0 2px}
.crumb span.lit{color:var(--ink);font-weight:600}
.crumb em{font-style:normal;color:var(--ink4);padding:0 6px}
.ladder{display:flex;align-items:center;gap:0}
.ladder button{display:flex;align-items:center;gap:5px;padding:2px 9px;color:var(--ink3);position:relative}
.ladder button kbd{font:600 10.5px var(--mono);color:var(--ink3)}
.ladder button.cur{color:var(--ink);font-weight:700}
.ladder button.cur::after{content:"";position:absolute;left:9px;right:9px;bottom:-8px;height:2px;background:var(--ink)}
.ladder .sz{display:inline-block;background:currentColor}
.proj{display:flex;gap:2px;font-size:12.5px}
.proj button{padding:2px 9px;color:var(--ink3)}
.proj button.cur{color:var(--paper);background:var(--ink);border-radius:2px}
.proj kbd,.k{font:600 10.5px var(--mono);color:var(--ink3);margin-left:6px}

/* body */
.main{display:grid;grid-template-columns:1fr 410px;min-height:0}
.main.deep{grid-template-columns:290px 1fr}
.cv{overflow:auto;min-height:0;padding:14px 18px 40px;scrollbar-width:thin;position:relative}
.cv.zooming{animation:zin .26s cubic-bezier(.2,.7,.2,1)}
.cv.zoomout{animation:zout .26s cubic-bezier(.2,.7,.2,1)}
@keyframes zin{from{transform:scale(.965);opacity:.4}}
@keyframes zout{from{transform:scale(1.035);opacity:.4}}
.peek{border-left:1px solid var(--ink);overflow:auto;min-height:0;background:var(--sheet);scrollbar-width:thin}
.rail{border-right:1px solid var(--ink);overflow:auto;min-height:0;padding:12px 12px 40px;background:var(--sheet);scrollbar-width:thin}

/* ---------- sections ---------- */
.sec{margin-bottom:22px}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.sh .n{font:800 30px/0.9 var(--sans);font-stretch:62.5%;letter-spacing:-.02em}
.sh .l{font:600 17px/1 var(--sans);font-stretch:75%}
.sh .s{color:var(--ink3);font-size:12.5px;margin-left:4px}
.sh .r{margin-left:auto;color:var(--ink3);font-size:12px}
.sec.hum .sh{border-bottom:2px solid var(--hum)}
.sec.hum .sh .n,.sec.hum .sh .l{color:var(--hum)}
.sec.hum .sh .n{font-size:44px}
.sec.hum .sh .l{font-size:22px}
.sec.live .sh .n,.sec.live .sh .l{color:var(--live)}
.sec.quiet .sh .n,.sec.quiet .sh .l{color:var(--ink3)}
.sec.quiet .sh .n{font-size:22px}
.sec.quiet .sh .l{font-size:14px}
.sub{color:var(--ink3);font-size:12px;margin:10px 0 4px;display:flex;gap:8px;align-items:baseline}
.sub b{color:var(--ink2);font-weight:600}

/* ---------- fidelity 1: pixel ---------- */
.px{display:inline-block;width:8px;height:8px;margin:0 2px 2px 0;background:var(--ink3);vertical-align:top}
.px.s-needs_human{background:var(--hum)} .px.s-running{background:var(--live)} .px.s-ready{background:var(--ink2)}
.px.blk{background:var(--hatch),var(--rule)} .px.s-done{background:var(--ink4)} .px.hist{background:var(--rule)} .px.s-backlog{background:transparent;outline:1px solid var(--ink3);outline-offset:-1px}
.px.free{background:transparent;outline:1px dashed var(--ink3);outline-offset:-1px}
.px.f{outline:2px solid var(--ink);outline-offset:1px}
.px.dim{opacity:.35}
.field .px{width:11px;height:11px;margin:0 3px 3px 0}
.field .sec.hum .px{width:30px;height:30px}
.field .sec.live .px{width:18px;height:18px}
.pxs{line-height:0}
.dimrun{line-height:0;display:inline}

/* ---------- fidelity 2: glyph ---------- */
.gl{display:inline-flex;flex-direction:column;justify-content:space-between;width:62px;height:38px;margin:0 4px 4px 0;padding:3px 5px 3px;background:var(--sheet);border:1px solid var(--rule);vertical-align:top;cursor:pointer;position:relative}
.gl .i{font:700 12px/1 var(--mono)}
.gl .m{display:flex;justify-content:space-between;font-size:10px;line-height:1;padding-bottom:2px;color:var(--ink3);font-stretch:75%}
.gl.s-needs_human{background:var(--hum);border-color:var(--hum);color:#fff}.gl.s-needs_human .m{color:#fff}
.gl.s-running{border-color:var(--live);box-shadow:inset 0 -3px 0 var(--live)}
.gl.s-running .i{color:var(--live)}
.gl.blk{background:var(--hatch),var(--sheet)}
.gl.s-done{background:transparent;border-color:var(--rule2);color:var(--ink3)}
.gl.f{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.gl .cb{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ink)}

/* chains (ready at row zoom = glyph fidelity, grouped by what holds them) */
.ch{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;padding:5px 0;border-top:1px solid var(--rule2)}
.ch .h{font-weight:600;font-stretch:75%;font-size:13.5px;padding-top:2px}
.ch .h small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.ch .seq{display:flex;flex-wrap:wrap;align-items:center;row-gap:2px}
.ch .ar{color:var(--ink4);margin:0 3px 4px -1px;font-size:11px}
.ch .head{font:700 11px var(--mono);padding:2px 5px;margin:0 4px 4px 0;align-self:center;color:var(--ink2);border:1px dashed var(--ink3)}
.ch .head.h-needs_human{color:#fff;background:var(--hum);border:1px solid var(--hum)}
.ch .head.h-running{color:var(--live);border:1px solid var(--live)}
.ch .gl{width:52px;height:30px}

/* ---------- fidelity 3: row ---------- */
.rw{display:grid;grid-template-columns:4px 50px 96px minmax(0,1fr) 128px 74px 46px 58px;align-items:center;column-gap:10px;height:28px;cursor:pointer;border-bottom:1px solid var(--rule2);position:relative}
.rw:hover{background:var(--sheet)}
.rw .st{align-self:stretch;margin:4px 0;background:var(--ink4)}
.rw .i{font:700 12px var(--mono)}
.rw .ref{font:500 12px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.rw .ti .ep{font-weight:700;font-stretch:62.5%;color:var(--ink2);margin-right:5px;font-size:12.5px}
.rw .ti .more{color:var(--ink3);font-size:12px;margin-left:6px}
.rw .ru{font-size:12px;color:var(--ink2);font-stretch:75%}
.rw .ag{font:500 11.5px var(--mono);color:var(--ink3);text-align:right}
.rw .co{font:600 12.5px var(--mono);text-align:right}
.rw .co.est{color:var(--ink2);font-weight:400}
.rw.s-running .st{background:var(--live)}
.rw.s-running .i{color:var(--live)}
.rw.f{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rw.sel .i::before{content:"✓";color:var(--live);position:absolute;left:-14px}
.rw.s-done{height:21px;color:var(--ink3);border-bottom-color:transparent}
.rw.s-done .ti{font-size:12.5px;font-stretch:75%;font-weight:300;color:var(--ink2)}
.rw.s-done .i,.rw.s-done .ref,.rw.s-done .co{font-size:11px;color:var(--ink3);font-weight:400}
.rw.s-done .st{background:transparent}
.rw.s-ready .st,.rw.s-backlog .st{background:var(--ink3)}

/* node track: where in the graph, at a glance */
.nt{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;align-items:center;position:relative;height:14px}
.nt i{height:4px;background:var(--rule)}
.nt i.p{background:var(--ink2)}
.nt i.c{height:10px;background:var(--live);position:relative;overflow:hidden}
.nt i.c::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep 1.6s linear infinite;transform:translateX(-100%)}
.nt i.h{height:10px;background:var(--hum)}
@keyframes sweep{to{transform:translateX(100%)}}
.nt b{position:absolute;top:-6px;font:700 9.5px var(--mono);color:var(--hum)}
.nt .nl{position:absolute;right:0;top:-10px;font-size:10px;color:var(--ink3)}

/* needs-you rows render one fidelity higher than their peers */
.hx{display:grid;grid-template-columns:4px 1fr 250px;column-gap:14px;padding:10px 14px 12px 0;border-bottom:1px solid var(--rule);cursor:pointer;position:relative}
.hx .st{background:var(--hum)}
.hx .l1{display:flex;align-items:baseline;gap:10px}
.hx .i{font:800 14px var(--mono);color:var(--hum)}
.hx .ref{font:500 12.5px var(--mono);color:var(--ink2)}
.hx .kind{font-size:12px;font-weight:700;color:var(--hum);font-stretch:75%}
.hx .ti{font:600 18px/1.25 var(--sans);font-stretch:75%;margin:3px 0 4px;letter-spacing:-.005em}
.hx .why{font:italic 14px/1.35 var(--serif);color:var(--ink2);max-width:760px}
.hx .acts{display:flex;gap:16px;margin-top:8px;font-size:12.5px}
.hx .acts span{color:var(--ink2)} .hx .acts kbd{font:800 12px var(--mono);color:var(--hum);margin-right:4px}
.hx .rt{display:grid;grid-template-columns:auto 1fr auto 1fr;column-gap:8px;row-gap:4px;font-size:12px;color:var(--ink2);align-content:start;align-items:baseline}
.hx .rt .hd{grid-column:1/5;display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.hx .rt b{font:700 12px var(--mono);color:var(--ink)}
.hx .rt .big{font:800 34px/0.9 var(--sans);font-stretch:62.5%;color:var(--hum)}
.hx.f{background:var(--hum-bg);box-shadow:inset 0 0 0 1.5px var(--hum)}

/* ---------- place projection ---------- */
.host{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.host .nm{font:800 34px/0.9 var(--sans);font-stretch:62.5%}
.host .meta{color:var(--ink2);font-size:12.5px}
.host .meta .mono{font-size:12px}
.rn{margin-bottom:18px}
.rnh{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px;align-items:center;padding:6px 8px 6px 0;cursor:pointer;border-bottom:1px solid var(--rule)}
.rnh .nm{font:700 20px/1 var(--sans);font-stretch:75%}
.rnh .nm .dot{display:inline-block;width:8px;height:8px;background:var(--ok);margin-right:7px;vertical-align:3px}
.rnh .d{color:var(--ink2);font-size:12.5px}
.rnh .d .mono{font-size:11.5px;color:var(--ink3)}
.rnh .w{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--ink2)}
.rnh .w .trk{width:110px}
.rnh .win{grid-template-columns:auto 110px}
.rnh .w .pace{font-stretch:75%}
.rnh.f{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--ink)}
.wsl{display:grid;grid-template-columns:118px 1fr;column-gap:10px;align-items:start}
.wsl .wn{font-size:12px;color:var(--ink2);padding-top:7px;font-stretch:75%}
.wsl .wn b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.sock{display:flex;align-items:center;gap:8px;height:28px;color:var(--ink3);font-size:12.5px;border-bottom:1px solid var(--rule2)}
.sock i{display:inline-block;width:46px;height:14px;border:1px dashed var(--ink3)}
.rn .rw{grid-template-columns:4px 50px 96px minmax(0,1fr) 128px 46px 58px}
.rn .rw .ru{display:none}

/* ---------- peek ---------- */
.pk{padding:16px 18px 30px}
.pk .lab{color:var(--ink3);font-size:11.5px;margin-bottom:6px;display:flex;justify-content:space-between}
.pk .i{font:800 15px var(--mono)}
.pk h2{font:600 21px/1.2 var(--sans);font-stretch:75%;margin:4px 0 8px;letter-spacing:-.01em}
.pk .why{font:italic 14.5px/1.4 var(--serif);color:var(--ink2);margin:6px 0 12px;padding-left:10px;border-left:2px solid var(--hum)}
.pk .why.lv{border-left-color:var(--live)}
.pk dl{display:grid;grid-template-columns:96px 1fr;row-gap:4px;font-size:12.5px;margin:10px 0 14px}
.pk dt{color:var(--ink3)} .pk dd{font-family:var(--mono);font-size:12px}
.pk .acts{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 0}
.pk .acts button{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border:1px solid var(--rule);text-align:left;background:var(--paper);font-size:12.5px}
.pk .acts button:hover{border-color:var(--ink)}
.pk .acts button kbd{font:700 11px var(--mono);color:var(--ink3)}
.pk .acts button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)} .pk .acts button.pri kbd{color:var(--ink4)}
.pk .acts button.hum{background:var(--hum);color:#fff;border-color:var(--hum)} .pk .acts button.hum kbd{color:#fff;opacity:.75}
.pk .nt{height:22px;margin:4px 0 2px} .pk .nt i{height:6px} .pk .nt i.c,.pk .nt i.h{height:16px}
.ntl{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;font-size:10.5px;color:var(--ink3);font-stretch:75%}
.ntl .c{color:var(--ink);font-weight:700}
.mini{width:100%;margin:6px 0 4px}
.sl{font-size:12px}
.sl div{display:grid;grid-template-columns:22px 92px 1fr 52px 50px;gap:6px;padding:3px 0;border-bottom:1px solid var(--rule2);align-items:baseline}
.sl .v-fail,.sl .v-bounce,.sl .v-failure,.sl .v-significant{color:var(--hum);font-weight:700}
.sl .v-pass,.sl .v-clean{color:var(--ink);font-weight:600}
.sl .v-run{color:var(--live);font-weight:700}
.sl .mono{font-size:11.5px;color:var(--ink2)} .sl .r{text-align:right}
.pk .hint{margin-top:16px;color:var(--ink3);font-size:12px;line-height:1.6}
.pk .hint kbd{font:700 11px var(--mono);color:var(--ink);border-bottom:1px solid var(--ink3)}

/* ---------- fidelity 4: panel ---------- */
.pnl{max-width:1220px}
.pnl .top1{display:flex;gap:14px;align-items:baseline}
.pnl .i{font:800 18px var(--mono)}
.pnl .sta{font-weight:700;font-stretch:75%;font-size:14px}
.pnl h1{font:600 34px/1.1 var(--sans);font-stretch:75%;letter-spacing:-.015em;margin:6px 0 6px;max-width:1000px}
.pnl .refs{font:500 12.5px var(--mono);color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap}
.pnl .why{font:italic 16px/1.4 var(--serif);color:var(--ink2);margin:12px 0;padding-left:12px;border-left:3px solid var(--hum);max-width:900px}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:28px;margin-top:16px}
.blk h3{font:700 14px var(--sans);font-stretch:75%;margin:0 0 6px;display:flex;justify-content:space-between;color:var(--ink)}
.blk h3 span{font-weight:400;color:var(--ink3);font-size:12px}
.subway{width:100%;display:block;background:var(--sheet);border:1px solid var(--rule)}
.subway text{font-family:var(--sans);font-stretch:75%}
.stab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.stab td{padding:4px 6px;border-bottom:1px solid var(--rule2)}
.stab tr{cursor:pointer}
.stab tr.f td{background:var(--live-bg)}
.stab td.n{font:600 11.5px var(--mono);color:var(--ink3);width:26px}
.stab td.mono{font-size:11.5px}
.stab td.r{text-align:right}
.side dl{display:grid;grid-template-columns:100px 1fr;row-gap:5px;font-size:12.5px}
.side dt{color:var(--ink3)} .side dd{font:12px var(--mono)}

  live.forEach(c => { const d = rnd() * .012; c.cost += d; spendToday += d; c.ago += 1 / 60; });
  document.querySelectorAll('[data-cost]').forEach(e => { const c = byId[e.dataset.cost]; if (c && c.status === 'running') e.textContent = money(c.cost, c.est); });
  document.querySelectorAll('[data-age]').forEach(e => { const c = byId[e.dataset.age]; if (c && c.status === 'running') e.textContent = ago(c.ago); });
  HOST.seen = (HOST.seen + 1) % 40; RUNNERS.forEach(r => r.seen = (r.seen + 1) % 40);
  document.querySelectorAll('[data-seen]').forEach(e => { const k = e.dataset.seen; e.textContent = (k === 'host' ? HOST.seen : RUNNERS.find(r => r.name === k).seen) + 's'; });
  readouts();
  if ((S.clock / 1000) % 5 === 0) {
    const c = live[Math.floor(rnd() * live.length)];
    const hhmm = new Date(S.clock).toTimeString().slice(0, 8);
    EV.unshift([hhmm, c.id, `${c.node} · ${Math.round(40 + rnd() * 300)}k tok · ${money(c.cost, c.est)}`, c.runner]); EV.length = Math.min(EV.length, 20); ticker();
  }
  // a transcript line streams in when watching a live chunk at line fidelity
  const fc = byId[S.focus];
  if (S.zoom === 5 && fc && fc.status === 'running' && (S.clock / 1000) % 3 === 0 && fc._tx && fc._tx.length < fc._src.length) {
    const l = fc._src[fc._tx.length]; fc._tx.push({t: fc._tx[fc._tx.length - 1].t + 3, k: l[0], x: l[1]});
    const sc = $('#cv').scrollTop; render(false); $('#cv').scrollTop = sc; const ls = document.querySelectorAll('.tl[data-line]'); ls[ls.length - 1]?.classList.add('new');
  }
}

/* ================= input ================= */
function toast(msg, cmd) { const t = $('#toast'); t.innerHTML = esc(msg) + (cmd ? `<span class="mono">${esc(cmd)}</span>` : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }
function zoomTo(z, keepFocus = true) {
  z = Math.max(1, Math.min(5, z));
  // zooming into a runner is a query: the space narrows to it, and zooming out widens it again
  if (z > S.zoom && S.zoom === 3 && S.focus?.startsWith('R:')) {
    const name = S.focus.slice(2); S.q = `runner:${name}`; $('#q').value = S.q; S.focus = C.find(c => c.runner === name && c.status !== 'done')?.id || S.focus; render(); scrollFocus(); return;
  }
  if (z < S.zoom && S.zoom === 3 && /^runner:\S+$/.test(S.q.trim())) { const name = S.q.trim().slice(7); S.q = ''; $('#q').value = ''; S.focus = 'R:' + name; render(); scrollFocus(); return; }
  if (z >= 4 && !byId[S.focus]) { const f = focusables().find(id => byId[id]); if (!f) return; S.focus = f; }
  if (z < 5) S.line = null; if (z < 4) S.step = null;
  S.zoom = z; render(); requestAnimationFrame(scrollFocus);
}
function move(d) {

  if (S.zoom === 4) { const st = history(byId[S.focus]); const i = st.findIndex(s => s.n === S.step); S.step = st[Math.max(0, Math.min(st.length - 1, (i < 0 ? st.length : i) + d))].n; render(false); return; }
  const f = focusables(); let i = f.indexOf(S.focus); i = i < 0 ? 0 : Math.max(0, Math.min(f.length - 1, i + d));
  S.focus = f[i]; render(false); scrollFocus();
}
function jumpSection(d) {
  const secs = [...document.querySelectorAll('#cv section')]; const cur = document.querySelector(`#cv [data-f="${CSS.escape(S.focus || '')}"]`)?.closest('section');
  let i = secs.indexOf(cur) + d; i = Math.max(0, Math.min(secs.length - 1, i));
  const e = secs[i]?.querySelector('[data-f]:not(.dim)'); if (e) { S.focus = e.dataset.f; render(false); scrollFocus(); }
}
function goto(sec) {
  const pick = {n: c => c.status === 'needs_human', l: c => c.status === 'running', y: c => c.status === 'ready', d: c => c.status === 'done'}[sec];
  if (!pick) return; const id = focusables().find(id => byId[id] && pick(byId[id])); if (id) { S.focus = id; if (S.zoom > 3) S.zoom = 3; render(false); scrollFocus(); }
}
function act(k) {
  const ids = S.sel.size ? [...S.sel] : S.focus ? [S.focus] : []; if (!ids.length) return;
  const c = byId[ids[0]];
  if (k === 't') toast(`Taking over ${ids.map(i => 'C-' + i).join(', ')} — the parked session opens in your terminal`, `blizzard runner takeover ${ids.map(i => 'ch_…' + i).join(' ')}`);
  else if (k === 'a') toast(`Answering C-${ids[0]} — reply goes to the agent on ${c?.runner}`, 'blizzard chunk answer C-' + ids[0]);
  else if (k === 'r') toast(`Requeued ${ids.length} chunk${ids.length > 1 ? 's' : ''}`, `blizzard chunk requeue ${ids.map(i => 'C-' + i).join(' ')}`);
  else if (k === 'o') toast(`Opening ${c?.pr || 'no PR on this chunk'}`);
  else if (k === 'u') toast(`Promoted ${ids.map(i => 'C-' + i).join(' ')}`);
  else if (k === 'P') toast(`Paused ${S.focus?.startsWith('R:') ? S.focus.slice(2) : c?.runner || 'runner'} — held chunks finish their step, no new claims`);
}
function bind() {
  const q = $('#q');
  q.value = S.q;
  q.addEventListener('focus', () => { $('#ql').classList.add('on'); suggest(); });
  q.addEventListener('blur', () => setTimeout(() => $('#ql').classList.remove('on'), 120));
  q.addEventListener('input', () => { S.q = q.value; S.sgi = 0; render(); suggest(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (S.q) { S.q = ''; q.value = ''; render(); suggest(); } else q.blur(); e.preventDefault(); }
    else if (e.key === 'Tab' && S.sg?.length) { e.preventDefault(); const r = S.sg[S.sgi]; const parts = S.q.split(/(\s+)/); parts[parts.length - 1] = (parts[parts.length - 1].startsWith('|') ? '| ' : '') + r.ins; S.q = parts.join(''); if (!/[:<>]$/.test(S.q)) S.q += ' '; q.value = S.q; render(); suggest(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.sgi = Math.max(0, Math.min((S.sg?.length || 1) - 1, (S.sgi || 0) + (e.key === 'ArrowDown' ? 1 : -1))); suggest(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); const R = Q();
      if (S.pend) { toast(`${VERBS[S.pend.verb]} ${S.pend.ids.map(i => 'C-' + i).join(' ')} — sent`, `blizzard chunk ${S.pend.verb} ${S.pend.ids.map(i => 'C-' + i).join(' ')}`); S.q = S.q.replace(/\|\s*\w+\s*$/, '').trim(); q.value = S.q; render(); return; }
      if (R.save) { VIEWS[R.save.startsWith('@') ? R.save : '@' + R.save] = [S.q.replace(/\|\s*save.*$/, '').trim(), 'saved just now']; toast(`Saved view ${R.save} — it now completes after @`); S.q = S.q.replace(/\|\s*save.*$/, '').trim(); q.value = S.q; render(); return; }
      if (!S.q && S.sg?.length) { S.q = S.sg[S.sgi].ins; q.value = S.q; render(); suggest(); return; }
      const f = focusables().find(id => byId[id] && matches(byId[id], R)); if (f) S.focus = f; q.blur(); render(false); scrollFocus();
    }
  });
  $('#sugg').addEventListener('mousedown', e => { const r = e.target.closest('.sg'); if (!r) return; e.preventDefault(); const parts = S.q.split(/(\s+)/); parts[parts.length - 1] = r.dataset.ins; S.q = parts.join('') + ' '; q.value = S.q; render(); suggest(); });
  let gPend = false;
  document.addEventListener('keydown', e => {
    if (e.target === q) return;
    if ($('#help')?.classList.contains('show')) { $('#help').classList.remove('show'); e.preventDefault(); return; }
    const k = e.key;
    if (gPend) { gPend = false; goto(k); return; }
    if (k === '/' || k === ':') { e.preventDefault(); q.focus(); }
    else if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (k === 'l' || k === 'ArrowRight') { e.preventDefault(); move(1); }
    else if (k === 'h' || k === 'ArrowLeft') { e.preventDefault(); move(-1); }
    else if (k === 'J') jumpSection(1); else if (k === 'K') jumpSection(-1);
    else if (k === 'Enter' || k === '=' || k === '+') { e.preventDefault(); if (S.pend) { toast(`${VERBS[S.pend.verb]} — sent`); S.q = S.q.replace(/\|\s*\w+\s*$/, '').trim(); render(); return; } zoomTo(S.zoom + 1); }
    else if (k === '-' || k === 'Escape' || k === 'Backspace') { e.preventDefault(); if (S.pend) { S.q = S.q.replace(/\|\s*\w+\s*$/, '').trim(); $('#q').value = S.q; render(); return; } zoomTo(S.zoom - 1); }
    else if (/^[1-5]$/.test(k)) zoomTo(+k);
    else if (k === 'p') { S.group = S.group === 'status' ? 'place' : 'status'; S.q = S.q.replace(/\|\s*group\s+\w+/, '').trim(); $('#q').value = S.q; if (S.zoom > 3) S.zoom = 3; render(); scrollFocus(); }
    else if (k === 'g') gPend = true;
    else if (k === 'x' && byId[S.focus]) { S.sel.has(S.focus) ? S.sel.delete(S.focus) : S.sel.add(S.focus); render(false); }
    else if ('tarouP'.includes(k) && k.length === 1) act(k);
    else if (k === '?') $('#help')?.classList.add('show');
    else if (k === '\\') document.body.classList.toggle('night');
  });
  document.addEventListener('click', e => {
    const z = e.target.closest('[data-z]'); if (z) return zoomTo(+z.dataset.z);
    const p = e.target.closest('[data-p]'); if (p) { S.group = p.dataset.p; if (S.zoom > 3) S.zoom = 3; render(); return; }
    const a = e.target.closest('[data-act]'); if (a) return act(a.dataset.act === '↵' ? null : a.dataset.act) || (a.dataset.act === '↵' && zoomTo(4)) || (a.dataset.act === '5' && zoomTo(5));
    const st = e.target.closest('[data-step]'); if (st) { S.step = +st.dataset.step; if (S.zoom === 4 && e.detail > 1) zoomTo(5); else render(false); return; }
    const ln = e.target.closest('[data-line]'); if (ln) { S.line = +ln.dataset.line; render(false); return; }
    const f = e.target.closest('[data-f]'); if (f) { const was = S.focus === f.dataset.f; S.focus = f.dataset.f; if (was || e.detail > 1) zoomTo(Math.max(4, S.zoom + 1)); else render(false); }
  });
  // pointer zoom: ctrl+wheel on desktop (trackpad pinch arrives as this too)
  let wacc = 0;
  document.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); wacc += e.deltaY; if (Math.abs(wacc) > 60) { const f = e.target.closest?.('[data-f]'); if (f && wacc < 0) S.focus = f.dataset.f; zoomTo(S.zoom + (wacc < 0 ? 1 : -1)); wacc = 0; } }, {passive: false});

  let t0 = null, pd = null, lp = null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { pd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); t0 = null; clearTimeout(lp); return; }
    const t = e.touches[0]; t0 = {x: t.clientX, y: t.clientY, at: Date.now(), f: e.target.closest('[data-f]')?.dataset.f};
    clearTimeout(lp); lp = setTimeout(() => { if (t0?.f) { S.focus = t0.f; sheet(); t0 = null; } }, 520);
  }, {passive: true});

    const t = e.changedTouches[0]; const dx = t.clientX - t0.x, dy = t.clientY - t0.y;

  });
}
function sheet() {

  s.innerHTML = `<div class="sub" style="margin-top:0"><b>C-${c.id}</b> ${esc(c.refs[0][1])}</div><div class="vsub">${[['t', 'Take over'], ['a', 'Answer'], ['r', 'Requeue'], ['o', 'Open PR'], ['=', 'Zoom in']].map(([k, l]) => `<div data-sheet="${k}"><span class="mono">${k}</span><span>${l}</span><span></span></div>`).join('')}</div>`;
  s.classList.add('show'); s.onclick = e => { const r = e.target.closest('[data-sheet]'); s.classList.remove('show'); if (!r) return; r.dataset.sheet === '=' ? zoomTo(4) : act(r.dataset.sheet); };
}

frame();
if (!S.focus) S.focus = (C.find(c => c.status === 'needs_human' && c.kind === 'takeover') || C[0]).id;
if (CFG.group === 'place' && !hp.get('f')) S.focus = 'R:r-claude';
if (M && !hp.get('f')) S.focus = null;
if (hp.get('step')) S.step = +hp.get('step');
if (hp.get('line')) S.line = +hp.get('line');
if (hp.get('sel')) hp.get('sel').split(',').forEach(i => S.sel.add(i));
render(false);
bind();
if (hp.get('open') === 'q') { $('#q').focus(); }
setInterval(tick, 1000);
if (hp.get('selftest')) {
  const log = []; const key = k => document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true}));
  const snap = l => log.push(l + ': zoom=' + S.zoom + ' group=' + (Q().group || S.group) + ' focus=' + S.focus + ' step=' + S.step + ' line=' + S.line + ' rows=' + document.querySelectorAll('#cv [data-f]').length);
  snap('start'); key('j'); key('j'); snap('jj'); key('Enter'); snap('enter'); key('j'); snap('j in panel'); key('Enter'); snap('enter'); key('j'); key('j'); snap('jj in line');
  key('-'); key('-'); snap('out x2'); key('p'); snap('p'); key('1'); snap('1'); key('3'); key('g'); key('n'); snap('g n');
  const q = document.querySelector('#q'); q.value = 'needs:human | sort holds'; q.dispatchEvent(new Event('input')); snap('query'); log.push('match=' + C.filter(c => matches(c, Q())).map(c => c.id).join(','));
  q.value = 'cost>3 | group runner'; q.dispatchEvent(new Event('input')); snap('group runner'); log.push('match=' + C.filter(c => matches(c, Q())).map(c => c.id).join(','));
  q.value = '@triage | takeover'; q.dispatchEvent(new Event('input')); log.push('confirm=' + document.querySelector('#cf').textContent);
  q.value = 'is:claimable epic:pw'; q.dispatchEvent(new Event('input')); log.push('claim=' + C.filter(c => matches(c, Q())).map(c => c.id).join(','));
  q.value = 'bounces>2 | sort bounces'; q.dispatchEvent(new Event('input')); log.push('bounce=' + C.filter(c => matches(c, Q())).map(c => c.id + ':' + c.bounces).join(','));
  const o = document.createElement('pre'); o.id = 'selftest'; o.textContent = log.join('\n'); document.body.appendChild(o);
}
})();
