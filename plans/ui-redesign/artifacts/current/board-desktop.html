    const x = XS + 10 + (d - 1) * U.colW;
    s += `<text class="m" x="${x}" y="14" font-size="10" fill="var(--ink-3)" text-anchor="${d === 1 ? 'start' : 'middle'}">${d === 1 ? 'next' : '+' + Math.round(d * mc * .55 / 60) + 'h'}</text>`;
  });
  s += `<text x="${XS - 2}" y="${BANK[0] + 10}" font-size="11" fill="var(--ink-3)">upstream</text>`;

  // ---- top bank: slot capacity over time ----
  const cap = view.scale ? 80 : 10;
  const bh = BANK[1] - BANK[0];
  let area = `M${X0},${BANK[1]}`; let sat = ''; let satSince = null;
  const occ = t => { let n = 0; for (const c of S.chunks.values()) { if (!c.path || c.kind === 'upstream') continue; const a = c.path[0][1], b = c.kind === 'done' ? c.doneAt : now + 1; if (t >= a && t < b) n++; } return n; };
  const stepT = Math.max(1, Math.round(W / 300));
  for (let t = t0; t <= now; t += stepT) {
    const n = Math.min(cap, occ(t)); const y = BANK[1] - n / cap * bh; area += `L${xOf(t)},${y}`;
    if (n >= cap) { if (satSince == null) satSince = t; sat += `<rect x="${xOf(t)}" y="${BANK[0]}" width="${Math.max(1, (XN - X0) * stepT / W) + .5}" height="${bh}" fill="url(#hatch)"/>`; } else satSince = null;
  }
  area += `L${XN},${BANK[1]}Z`;
  s += `<g clip-path="url(#past)">${sat}<path d="${area}" fill="var(--ink)" fill-opacity=".13" stroke="var(--ink-2)" stroke-width="1"/></g>`;
  s += `<line x1="${X0}" x2="${XN}" y1="${BANK[0]}" y2="${BANK[0]}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>`;
  s += `<text x="12" y="${BANK[0] + 12}" font-size="12" font-weight="600" fill="var(--ink)">Slots</text>`;
  const nowOcc = fl.length;
  s += `<text class="m" x="12" y="${BANK[0] + 27}" font-size="10.5" fill="${nowOcc >= cap ? 'var(--alarm)' : 'var(--ink-3)'}">${nowOcc}/${cap} held</text>`;
  const free = Object.entries(SLOTS).filter(([w, sl]) => sl.runner).map(([w, sl]) => sl.n - fl.filter(c => c.ws === w).length).reduce((a, b) => a + b, 0);
  const bankNote = nowOcc >= cap ? `saturated ${satSince != null ? 'since ' + hhmm(satSince) : ''}` : declining('r-chatgpt') && free ? `${free} free, r-chatgpt held` : `${free} free`;
  s += `<text x="${XN + 8}" y="${BANK[0] + 13}" font-size="11.5" fill="${nowOcc >= cap ? 'var(--alarm)' : 'var(--ink-2)'}">${bankNote}</text>`;
  s += `<text x="${XN + 8}" y="${BANK[0] + 28}" font-size="11" fill="var(--ink-3)">winter 0/4 idle · no winter work queued</text>`;

  // ---- lanes ----
  for (let l = 0; l < LANE_N; l++) {
    const y = laneY(l);
    s += `<line x1="0" x2="${XS - 6}" y1="${y}" y2="${y}" stroke="var(--rule)"/>`;
    const inLane = fl.filter(c => laneOf(c) === l); const med = medianDwell(l);
    const pooled = inLane.filter(c => anomalyOf(c) === 'halted' || anomalyOf(c) === 'slow').length;
    s += `<text x="12" y="${y + 17}" font-size="13" font-weight="500" fill="${pooled ? 'var(--alarm)' : 'var(--ink)'}">${LANES[l].label}</text>`;
    if (l < 6) {
      s += `<text class="m" x="12" y="${y + 32}" font-size="10.5" fill="var(--ink-3)">${inLane.length} in · med ${dur(med)}</text>`;
      // occupancy ticks: one per chunk in lane, alarm when pooled
      inLane.slice(0, 10).forEach((c, i) => { const a = anomalyOf(c); s += `<rect x="${12 + i * 7}" y="${y + 40}" width="5" height="9" fill="${a === 'halted' || a === 'slow' ? 'var(--alarm)' : a === 'looping' ? 'var(--loop)' : 'var(--ink-2)'}" fill-opacity="${a === 'halted' ? 1 : a ? .7 : .7}"/>`; });
      if (inLane.length > 10) s += `<text class="m" x="${12 + 10 * 7 + 2}" y="${y + 48.5}" font-size="10" fill="var(--ink-3)">+${inLane.length - 10}</text>`;
      if (pooled) s += `<rect x="${XN}" y="${y + 1}" width="${XS - XN - 6}" height="${LH - 1}" fill="var(--alarm)" fill-opacity=".05"/>`;
    } else {
      const today = landed().filter(c => c.doneAt >= 0).length;
      s += `<text class="m" x="12" y="${y + 32}" font-size="10.5" fill="var(--ink-3)">${today} today</text>`;
    }
  }
  s += `<line x1="0" x2="${XS - 6}" y1="${laneY(LANE_N)}" y2="${laneY(LANE_N)}" stroke="var(--rule)"/>`;

  // ---- the Marey lines: every chunk's walk through the nodes over time ----
  let lines = '';
  const all = [...S.chunks.values()].filter(c => c.path && c.kind !== 'upstream');
  for (const c of all) {
    const end = c.kind === 'done' ? c.doneAt : now;
    if (end < t0) continue;
    const o = track(c), pts = c.path, halted = c.status === 'needs_human';
    const age = c.kind === 'done' ? (now - c.doneAt) / W : 0;
    const baseOp = c.kind === 'done' ? Math.max(.1, .3 - age * .22) : c.synthetic ? .3 : .9;
    const col = halted ? 'var(--alarm)' : 'var(--ink)';
    const totalT = Math.max(1, end - pts[0][1]);
    const wAt = t => .9 + 2.4 * Math.sqrt(Math.max(0, c.cost * (t - pts[0][1]) / totalT) / 40);
    let d = '', loops = '';
    for (let i = 0; i < pts.length; i++) {
      const [l, ta] = pts[i]; const tb = i + 1 < pts.length ? pts[i + 1][1] : end;
      const y = laneY(l) + o * (LH / 80), xa = xOf(ta), xb = xOf(Math.min(tb, halted && c.haltAt && i === pts.length - 1 ? c.haltAt : tb));
      if (l === 6) { lines += `<line class="ln" data-id="${c.id}" x1="${xa}" x2="${xa}" y1="${laneY(6) + 8}" y2="${laneY(6) + 14 + Math.min(52, 4 + Math.sqrt(c.cost) * 7)}" stroke="var(--ink)" stroke-opacity="${baseOp + .25}" stroke-width="2.2"/>`;
        if (c.cost >= 10) lines += `<text class="m" x="${xa + 4}" y="${laneY(6) + 22}" font-size="10" fill="var(--ink-2)">${fmt$(c.cost, c.est)}</text>`; continue; }
      const segOp = c.kind === 'flight' && !halted && i < pts.length - 1 ? .34 : baseOp;
      lines += `<path class="ln" data-id="${c.id}" d="M${xa},${y}H${Math.max(xa, xb)}" stroke="${col}" stroke-opacity="${segOp}" stroke-width="${wAt(ta).toFixed(2)}"/>`;
      if (halted && c.haltAt && i === pts.length - 1) {
        lines += `<path class="ln" data-id="${c.id}" d="M${xOf(c.haltAt)},${y}H${XN}" stroke="var(--alarm)" stroke-width="2" stroke-dasharray="3 3"/>`;
        lines += `<line class="ln" data-id="${c.id}" x1="${xOf(c.haltAt)}" x2="${xOf(c.haltAt)}" y1="${y - 7}" y2="${y + 7}" stroke="var(--alarm)" stroke-width="2"/>`;
      }
      if (i + 1 < pts.length) {
        const [l2] = pts[i + 1]; const y2 = laneY(l2) + o * (LH / 80);
        if (l2 < l) { // bounce: a loop that swings back against time
          const r = Math.min(c.kind === 'done' ? 6 : 10, (y - y2) / 3);
          loops += `<path class="ln" data-id="${c.id}" d="M${xb},${y}C${xb + r},${y} ${xb + r * .6},${y2 + (y - y2) * .5} ${xb - r},${(y + y2) / 2} S${xb - r * .4},${y2} ${xb},${y2}" stroke="var(--loop)" stroke-opacity="${c.kind === 'done' ? baseOp + .08 : halted ? 1 : c.synthetic ? .22 : .75}" stroke-width="${Math.max(1.4, wAt(tb)).toFixed(2)}"/>`;
        } else if (l2 === 6) {
          lines += `<path class="ln" data-id="${c.id}" d="M${xb},${y}L${xb},${laneY(6) + 8}" stroke="var(--ink)" stroke-opacity="${baseOp * .8}" stroke-width="1"/>`;
        } else {
          lines += `<path class="ln" data-id="${c.id}" d="M${xb},${y}C${xb + 3},${y} ${xb + 1},${y2} ${xb + 4},${y2}" stroke="${col}" stroke-opacity="${c.kind === 'flight' && !halted ? .3 : baseOp * .8}" stroke-width="${wAt(tb).toFixed(2)}"/>`;
        }
      }
    }
    lines += loops;
  }
  s += `<g clip-path="url(#past)">${lines}</g>`;
  // heads outside clip
  for (const c of fl) { if (c.synthetic) continue; const y = laneY(laneOf(c)) + track(c) * (LH / 80); const p = P.get(c.id) || P.get('more:' + laneOf(c)); const cy = p ? p.y + 9 : y;
    s += `<path class="ln" data-id="${c.id}" d="M${XN},${y}C${XN + 6},${y} ${XN + 2},${cy} ${XN + 8},${cy}" stroke="${c.status === 'needs_human' ? 'var(--alarm)' : 'var(--ink)'}" stroke-opacity=".8" stroke-width="1.2"/>`;
    if (c.status !== 'needs_human') s += `<circle class="ln" data-id="${c.id}" cx="${XN}" cy="${y}" r="2.8" fill="var(--live)" stroke="none"/>`;
    else s += `<rect class="ln" data-id="${c.id}" x="${XN - 3}" y="${y - 3}" width="6" height="6" fill="var(--alarm)" stroke="none"/>`; }
  // landing flashes
  for (const [id, kind] of S.flash) { const c = S.chunks.get(id); if (!c || !c.path) continue; const l = laneOf(c);
    const y = l === 6 ? laneY(6) + 20 : laneY(l) + track(c) * (LH / 80);
    const x = l === 6 ? xOf(c.doneAt) : XN;
    s += `<circle class="svgflash" cx="${x}" cy="${y}" r="9" style="stroke:${kind === 'bounce' ? 'var(--loop)' : kind === 'alarm' ? 'var(--alarm)' : 'var(--ink)'}"/>`; }

  // ---- upstream: dependency threads into the future ----
  let thr = '', dots = '';
  const damIds = new Set(); halted.forEach(h => dependents(S.chunks, h.id).forEach(x => damIds.add(x)));
  for (const c of upstream()) {
    const p = U.pos.get(c.id); if (!p) continue;
    const crit = criticalBlocker(c, U.depth); const dammed = damIds.has(c.id);
    const tc = dammed ? 'var(--alarm)' : 'var(--ink-2)';
    for (const b of unmet(S.chunks, c)) {
      const isCrit = b === crit; let from;
      const bp = U.pos.get(b);
      if (bp) from = [bp.x, bp.y];
      else { const fp = P.get(b) || P.get('more:' + (S.chunks.get(b) ? laneOf(S.chunks.get(b)) : 0)); if (!fp) continue; from = [XN + 8 + CHIP_W, fp.y + 9]; }
      const mx = (from[0] + p.x) / 2;
      thr += `<path class="thr${isCrit ? '' : ' extra'}" data-id="${c.id}" data-b="${b}" d="M${from[0]},${from[1]}C${mx},${from[1]} ${mx},${p.y} ${p.x},${p.y}" stroke="${tc}" stroke-opacity="${isCrit ? (dammed ? .55 : .3) : 0}" stroke-width="${isCrit ? 1 : .8}"/>`;
    }
    const ready0 = unmet(S.chunks, c).length === 0;
    dots += `<circle class="dot" data-id="${c.id}" cx="${p.x}" cy="${p.y}" r="${ready0 ? 3.6 : 2.8}" fill="${ready0 ? 'var(--ink)' : dammed ? 'var(--alarm)' : 'var(--ink-3)'}" fill-opacity="${ready0 ? .95 : dammed ? .65 : .8}" ${c.status === 'backlog' ? 'stroke="var(--ink-2)" fill="none"' : ''}/>`;
  }
  s += thr + dots;
  for (const r of U.rows) s += `<text x="${XF + 8}" y="${r.y + 3.5}" font-size="10.5" fill="var(--ink-3)" text-anchor="end">${r.g === 'hub' ? 'hub · survey' : r.g === 'BREAK' ? 'backlog' : r.g}</text>`;
  for (const h of halted) { const n = dependents(S.chunks, h.id).size; if (!n) continue; const fp = P.get(h.id); if (!fp) continue;
    s += `<text x="${XS + 4}" y="${fp.y + 13}" font-size="11" fill="var(--alarm)">${n} dammed</text>`; }

  // ---- bottom bank: subscription windows, pace = spent ÷ elapsed ----
  s += `<text x="12" y="${WIN_T - 2}" font-size="12" font-weight="600" fill="var(--ink)">Windows</text>`;
  WINDOWS.forEach((w, i) => {
    const y = WIN_T + 6 + i * WIN_H, mid = y + WIN_H / 2;
    const pace = w.spent / w.elapsed; const over = pace > 1;
    s += `<text x="12" y="${mid + 4}" font-size="11" fill="var(--ink-2)">${w.provider} ${w.span}</text>`;
    s += `<line x1="${X0}" x2="${XF}" y1="${mid}" y2="${mid}" stroke="var(--ink-4)" stroke-dasharray="1 3"/>`;
    // pace history: synthesised walk ending at today's pace
    const r = seeded(hash(w.key)); let v = pace; const ptsW = [];
    for (let t = now; t >= t0; t -= Math.max(2, W / 120)) { ptsW.push([t, v]); v = Math.max(.1, v + (r() - .5) * .08 + (w.key === 'o7d' && t > now - 40 ? -.006 : 0)); }
    const yv = v => mid - (v - 1) * 26;
    let dp = ''; ptsW.reverse().forEach(([t, v], k) => { dp += (k ? 'L' : 'M') + xOf(t).toFixed(1) + ',' + Math.max(y - 2, Math.min(y + WIN_H + 2, yv(v))).toFixed(1); });
    s += `<g clip-path="url(#past)"><path d="${dp}" fill="none" stroke="${over ? 'var(--alarm)' : 'var(--ink-2)'}" stroke-width="1.3"/></g>`;
    s += `<text class="m" x="${XN + 8}" y="${mid + 4}" font-size="10.5" fill="${over ? 'var(--alarm)' : 'var(--ink-2)'}">${Math.round(w.spent * 100)}% spent · ${Math.round(w.elapsed * 100)}% gone</text>`;
    if (w.declineUntil) {
      const until = T(w.declineUntil); const left = until - now;
      if (left > 0) { const x2 = Math.min(XF, XS + left / 240 * (XF - XS));
        s += `<rect x="${XS}" y="${mid - 6}" width="${x2 - XS}" height="12" fill="url(#hatch)"/><text x="${x2 + 6}" y="${mid + 4}" font-size="11" fill="var(--alarm)">r-chatgpt declining until ${w.declineUntil}</text>`; }
      else s += `<text x="${XS}" y="${mid + 4}" font-size="11" fill="var(--ink-3)">back under pace</text>`;
    } else s += `<text x="${XS}" y="${mid + 4}" font-size="11" fill="var(--ink-3)">${pace < .5 ? 'headroom' : 'on pace'}</text>`;
  });

  // ---- throughput: what landed, what it cost, and spend accrual vs yesterday ----
  const ty = THR_T, th = THR_H;
  s += `<line x1="0" x2="${XS - 6}" y1="${ty - 6}" y2="${ty - 6}" stroke="var(--rule)"/>`;
  s += `<text x="12" y="${ty + 10}" font-size="12" font-weight="600" fill="var(--ink)">Spend</text>`;
  s += `<text class="m" x="12" y="${ty + 25}" font-size="10.5" fill="var(--ink-2)">${fmt$(S.spend, true)}</text>`;
  s += `<text class="m" x="12" y="${ty + 39}" font-size="10.5" fill="var(--ink-3)">y ${fmt$(SPEND.yesterday)}</text>`;
  // cumulative spend since midnight (today solid, yesterday dotted), scaled to yesterday's total
  const spendAt = t => { let v = 0; for (const c of S.chunks.values()) { if (!c.path || c.kind === 'upstream' || !c.cost) continue; const a = c.path[0][1], b = c.kind === 'done' ? c.doneAt : now; v += c.cost * Math.max(0, Math.min(1, (t - a) / Math.max(1, b - a))); } return v; };
  const base0 = spendAt(0), kCal = S.spend / Math.max(1, spendAt(now) - base0);
  let dT = ''; for (let k = 0; k <= 80; k++) { const t = Math.max(t0, 0) + (now - Math.max(t0, 0)) * k / 80; dT += (k ? 'L' : 'M') + xOf(t).toFixed(1) + ',' + (ty + th - 4 - (spendAt(t) - base0) * kCal / SPEND.yesterday * (th - 18)).toFixed(1); }
  const dayCurve = (total, shift, warp) => { let d = ''; const n = 60; for (let k = 0; k <= n; k++) { const t = Math.max(t0, 0) + (Math.min(now, 1440) - Math.max(t0, 0)) * k / n; const f = Math.pow(Math.max(0, t) / 1440, warp); d += (k ? 'L' : 'M') + xOf(t).toFixed(1) + ',' + (ty + th - 4 - (total * f) / SPEND.yesterday * (th - 18)).toFixed(1); } return d; };
  const warpToday = Math.log(S.spend / SPEND.yesterday) / Math.log(Math.max(1, now) / 1440);
  s += `<g clip-path="url(#past)"><line x1="${X0}" x2="${XN}" y1="${ty + 14}" y2="${ty + 14}" stroke="var(--ink-3)" stroke-dasharray="2 3"/><text x="${X0 + 4}" y="${ty + 10}" font-size="10" fill="var(--ink-3)">yesterday's total, ${fmt$(SPEND.yesterday)}</text><path d="${dT}" fill="none" stroke="var(--ink)" stroke-width="1.5"/></g>`;
  const ydNow = SPEND.yesterday * Math.pow(now / 1440, 1.15);
  s += `<text class="m" x="${XN + 8}" y="${ty + 26}" font-size="11" fill="var(--ink)">${fmt$(S.spend, true)} today</text>`;
  s += `<text class="m" x="${XN + 8}" y="${ty + 41}" font-size="10.5" fill="var(--ink-3)">${Math.round(S.spend / SPEND.yesterday * 100)}% of yesterday's total</text>`;
  s += `<text class="m" x="${XN + 8}" y="${ty + 56}" font-size="10.5" fill="var(--ink-3)">${SPEND.tokToday} tok · ${landed().filter(c => c.doneAt >= 0).length} landed</text>`;
  // midnight marker
  if (t0 < 0) s += `<text x="${xOf(0) + 4}" y="${ty + th - 6}" font-size="10" fill="var(--ink-3)">midnight</text>`;
  $('#flow').innerHTML = s;
  S.flash.forEach((k, id) => { if (k === 'land' || k === 'bounce' || k === 'step' || k === 'alarm') {} });

  // ---- present-column chips ----
  let ch = '';
  for (const [id, p] of P) {
    if (id.startsWith('more:')) { const anom = p.rest.filter(c => anomalyOf(c)).length; ch += `<div class="chip more" style="top:${p.y}px">+${p.n} more${anom ? ` · <span class="alarm">${anom} slow</span>` : ''} · oldest ${dur(now - Math.min(...p.rest.map(enteredAt)))}</div>`; continue; }
    const c = S.chunks.get(id); const a = anomalyOf(c);
    const cls = ['chip', c.status === 'needs_human' ? 'halted' : 'running', a || '', S.flash.has(id) ? 'flash' : ''].join(' ');
    const dw = c.status === 'needs_human' ? 'halted ' + dur(now - (c.haltAt || enteredAt(c))) : dur(now - enteredAt(c));
    ch += `<div class="${cls}" data-id="${id}" style="top:${p.y}px"><span class="cid">${id}</span><span class="ct">${esc(c.title.replace(/^\[[A-Z-]+\] /, ''))}</span><span class="cd">${dw}</span><span class="cc">${fmt$(c.cost, c.est)}</span></div>`;
  }
  // intake: what would enter next, and why it is not
  if (!fl.some(c => laneOf(c) === 0)) {
    const nxt = upstream().filter(c => c.status === 'ready' && !unmet(S.chunks, c).length);
    const why = nowOcc >= cap ? 'waiting for a slot' : declining('r-chatgpt') ? 'r-chatgpt declining' : 'claiming';
    ch += `<div class="chip more" style="top:${laneY(0) + 5}px">${nxt.length} ready, ${why}</div>`;
    ch += `<div class="chip more" style="top:${laneY(0) + 24}px;font-family:var(--mono);font-size:10.5px">${nxt.slice(0, 5).map(c => c.id).join(' ')}${nxt.length > 5 ? ' …' : ''}</div>`;
  }
  const lastLand = landed().sort((a, b) => b.doneAt - a.doneAt)[0];
  if (lastLand) ch += `<div class="chip ${S.flash.has(lastLand.id) ? 'flash' : ''}" data-id="${lastLand.id}" style="top:${laneY(6) + 5}px;border-left-color:var(--ink)"><span class="cid">${lastLand.id}</span><span class="ct">landed ${dur(now - lastLand.doneAt)} ago</span><span class="cc">${fmt$(lastLand.cost, lastLand.est)}</span></div>`;
  $('#chips').innerHTML = ch;

  renderVerdict(halted, nowOcc, cap); renderAsks(halted); renderInspector(); renderFeed();
  S.flash.clear(); applyFocus();
}

function renderVerdict(halted, occ, cap) {
  const pools = [];
  for (let l = 1; l < 6; l++) { const cs = flights().filter(c => laneOf(c) === l); const a = cs.filter(c => anomalyOf(c) === 'halted' || anomalyOf(c) === 'slow').length; if (a) pools.push([l, cs.length, a]); }
  pools.sort((a, b) => b[2] - a[2]);
  let say = '';
  if (pools.length) { const [l, n, a] = pools[0]; say = `Pooling at <span class="alarm">${LANES[l].label.toLowerCase()}</span>: ${n} chunks, ${halted.length ? `<span class="alarm">${halted.length} waiting on you</span>` : a + ' slow'}.`; }
  else say = `Flowing. ${flights().length} in flight, nothing pooling.`;
  const dam = halted.map(h => [h.id, dependents(S.chunks, h.id).size]).sort((a, b) => b[1] - a[1])[0];
  if (dam && dam[1]) say += ` ${dam[1]} dammed behind <span class="alarm">C-${dam[0]}</span>.`;
  if (occ >= cap) say += ` Capacity-bound.`;
  else if (declining('r-chatgpt')) say += ` r-chatgpt held to 14:41.`;
  const today = landed().filter(c => c.doneAt >= 0).length;
  $('#verdict').innerHTML = `<div class="say">${say}</div><div class="facts"><b>${today}</b> landed today · median cycle <b>${dur(medianCycle())}</b> · <span class="livemark"><i></i>${S.paused ? 'paused' : 'live'} ${hhmm(S.now)}</span></div>`;
  document.body.classList.toggle('paused', S.paused);
}
function renderAsks(halted) {
  let h = `<h3>Needs you <span class="n">${halted.length}</span><span class="r">asks 0 · gates 0</span></h3>`;
  if (!halted.length) h += `<div class="dim" style="font-size:12px">Nothing is waiting on you.</div>`;
  for (const c of halted) {
    const n = dependents(S.chunks, c.id).size;
    h += `<div class="ask${view.focus === c.id ? ' focus' : ''}" data-id="${c.id}"><div class="top"><span class="cid">${c.id}</span><span class="ref">${c.refs.join(' ')} · ${c.runner}</span><span class="age">halted ${dur(S.now - c.haltAt)}</span></div>
      <div class="tt">${esc(c.title)}</div><div class="why">${esc(c.reason)}</div>
      <div class="meta">${n ? `<b>holds back ${n} upstream</b> · ` : ''}${bounces(c)} bounce${bounces(c) === 1 ? '' : 's'} · ${fmt$(c.cost, c.est)} · ${c.attempts} attempts</div>
      <div class="acts"><span><span class="k">t</span>take over</span><span><span class="k">r</span>requeue</span><span><span class="k">o</span>${c.pr}</span></div></div>`;
  }
  $('#asks').innerHTML = h;
}

function renderFeed() {

function applyFocus() {
  const id = view.hover || view.focus;
  const set = new Set(id ? [id] : []);
  if (id) { const c = S.chunks.get(id); if (c && c.kind === 'upstream') { const q = [id]; while (q.length) { const x = q.shift(); const k = S.chunks.get(x); if (!k) continue; for (const b of unmet(S.chunks, k)) if (!set.has(b)) { set.add(b); q.push(b); } } }

}

// ---------------- interaction ----------------
const tip = $('#tip');
function showTip(e, id) {
  const c = S.chunks.get(id); if (!c) return;
  const st = c.kind === 'upstream' ? (unmet(S.chunks, c).length ? `waits on ${unmet(S.chunks, c).join(', ')}` : 'ready, unblocked') : c.kind === 'done' ? `landed ${hhmm(c.doneAt)} · ${fmt$(c.cost, c.est)}` : `${c.status.replace('_', ' ')} · ${LANES[laneOf(c)].label.toLowerCase()} · ${fmt$(c.cost, c.est)}`;
  tip.innerHTML = `<span class="cid">C-${id}</span> ${c.refs[0]}<br>${esc(c.title)}<br><span class="s">${st}</span>`;
  tip.style.display = 'block'; tip.style.left = Math.min(1290, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
}
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-id]');
  const id = el ? el.dataset.id : null;
  if (id !== view.hover) { view.hover = id && S.chunks.has(id) ? id : null; renderInspector(); applyFocus(); }
  if (view.hover && !el.closest('#rail')) showTip(e, view.hover); else tip.style.display = 'none';
});
document.addEventListener('click', e => { const el = e.target.closest('[data-id]'); if (el && S.chunks.has(el.dataset.id)) { view.focus = el.dataset.id; render(); } });
function navOrder() { const P = presentLayout(); return [...P.keys()].filter(k => !k.startsWith('more:')).sort((a, b) => P.get(a).y - P.get(b).y); }
function moveFocus(d) { const o = navOrder(); let i = o.indexOf(view.focus); i = i < 0 ? 0 : (i + d + o.length) % o.length; view.focus = o[i]; view.hover = null; render(); }
function nextAnomaly() { const a = flights().filter(c => anomalyOf(c)).sort((x, y) => (x.status === 'needs_human' ? 0 : 1) - (y.status === 'needs_human' ? 0 : 1)).map(c => c.id); if (!a.length) return; const i = a.indexOf(view.focus); view.focus = a[(i + 1) % a.length]; render(); }
function walkUpstream() { const c = S.chunks.get(view.focus); if (!c) return; const deps = [...upstream()].filter(u => (u.blockedBy || []).includes(c.id)); if (deps.length) { view.focus = deps[0].id; render(); } }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); }
// command palette
const pal = $('#pal'), palq = $('#palq'); let palSel = 0, palItems = [];
function palCommands() {
  const cmds = [];
  for (const c of flights().filter(c => c.status === 'needs_human')) cmds.push({ cid: '→', tt: `Take over C-${c.id}`, s: c.takeover, run: () => toast('copied: ' + c.takeover) }, { cid: '↺', tt: `Requeue C-${c.id} to pre-push`, s: 'needs you', run: () => requeue(c.id) });
  cmds.push({ cid: '‖', tt: 'Pause r-chatgpt', s: 'runner', run: () => toast('r-chatgpt paused (mock)') }, { cid: '→', tt: 'Go to fleet', s: 'g f', run: () => location.href = 'fleet-desktop.html' }, { cid: '↔', tt: 'Window: 24 hours', s: ']', run: () => { zoom = 3; render(); } }, { cid: '+', tt: 'Promote C-WN6J from backlog', s: 'backlog', run: () => toast('promoted C-WN6J (mock)') });
  return cmds;
}
function palRender() {
  const q = palq.value.trim().toLowerCase();
  const chunks = [...S.chunks.values()].map(c => ({ cid: c.id, tt: c.title, s: c.kind === 'flight' ? c.status.replace('_', ' ') + ' · ' + LANES[laneOf(c)].label.toLowerCase() : c.kind === 'done' ? 'landed' : unmet(S.chunks, c).length ? 'blocked' : c.status, run: () => { view.focus = c.id; render(); }, key: (c.id + ' ' + c.refs.join(' ') + ' ' + c.title).toLowerCase() }));
  const cmds = palCommands().map(c => ({ ...c, key: c.tt.toLowerCase() }));

  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));

}
function openPal() { pal.style.display = 'block'; palq.value = ''; palSel = 0; palRender(); palq.focus(); }
function closePal() { pal.style.display = 'none'; palq.blur(); }
palq.addEventListener('input', () => { palSel = 0; palRender(); });
palq.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palSel = Math.min(palItems.length - 1, palSel + 1); palRender(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); palRender(); e.preventDefault(); }
  else if (e.key === 'Enter') { const x = palItems[palSel]; closePal(); x && x.run(); }
  else if (e.key === 'Escape') closePal();
  e.stopPropagation();
});
const HELP = [['j k', 'next / previous in flight'], ['n', 'next anomaly'], ['u', 'walk upstream from focus'], ['t', 'take over focused'], ['r', 'requeue focused'], ['o', 'open PR'], ['[ ]', 'time window 1h … 48h'], ['space', 'pause the live stream'], ['x', 'preview at 80 in flight'], ['⌘K  /', 'palette'], ['g f', 'go to fleet'], ['esc', 'clear']];
$('#help').innerHTML = '<h4>Keys</h4>' + HELP.map(([k, v]) => `<div><span>${v}</span><span>${k.split(' ').map(x => `<span class="k">${x}</span>`).join(' ')}</span></div>`).join('');
$('#keys').innerHTML = [['j k', 'move'], ['n', 'next anomaly'], ['u', 'upstream'], ['t', 'take over'], ['r', 'requeue'], ['[ ]', 'window'], ['space', 'pause'], ['x', 'at 80'], ['\u2318K', 'palette']].map(([k, v]) => `<span>${k.split(' ').map(x => `<span class="k">${x}</span>`).join('')} ${v}</span>`).join('') + '<span style="margin-left:auto"><span class="k">?</span> all keys</span>';
let gPending = false;
document.addEventListener('keydown', e => {

    case 'r': if (c && requeue(c.id)) toast('C-' + c.id + ' requeued to pre-push'); break;
    case 'o': if (c && c.pr) toast('opening ' + c.pr); break;

// 80-in-flight preview: synthetic chunks, so the shape at scale can be judged
function toggleScale() {

hooks(render);
