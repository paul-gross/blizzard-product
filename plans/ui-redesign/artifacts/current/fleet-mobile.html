function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function synthPath(end, cost, rnd) {

}
function epicOf(c) { const m = /^\[([A-Z-]+)\]/.exec(c.title || ''); return m ? m[1] : (c.refs[0] || '').startsWith('hub:') ? 'hub' : c.status === 'backlog' ? 'BREAK' : 'misc'; }
function fmt$(v, est) { return (est ? '~' : '') + '$' + v.toFixed(2); }

// ---- Current: simulated live events over the real chunk data ----
const SLOTS = { 'blizzard-claude': { runner: 'r-claude', n: 6 }, 'blizzard-chatgpt': { runner: 'r-chatgpt', n: 4 }, 'winter': { runner: null, n: 4 } };

function flights() { return [...S.chunks.values()].filter(c => c.kind === 'flight'); }

function admit() {

function simTick() {

function medianDwell(lane) {

// Depth of an upstream chunk: how many sequential landings stand between it and a slot.
function depthMap() {
