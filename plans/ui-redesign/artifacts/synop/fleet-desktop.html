<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>blizzard · upper air</title>
<style>
:root{
  --plot:"Nimbus Sans Narrow","Arial Narrow","Liberation Sans Narrow","Helvetica Neue",sans-serif;
  --serif:"C059","Century Schoolbook","New Century Schoolbook",Georgia,serif;
  --hand:"C059","Century Schoolbook",Georgia,serif;
  --ink:#1c1b18;--paper:#f5f2e9;--rule:#b9b19d;--grey:#8c8676;--red:#c4122f;--blue:#1d4f9c;--green:#2f8a3a;--pencil:#77736a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:var(--plot);font-size:13px;width:1600px;height:1000px;position:relative}
#map{position:absolute;left:0;top:0;width:1200px;height:1000px;outline:none}
#margin{position:absolute;left:1200px;top:0;width:400px;height:1000px;border-left:1px solid var(--ink);padding:14px 18px 0 18px;display:flex;flex-direction:column}
#margin::before{content:"";position:absolute;left:3px;top:0;bottom:0;border-left:1px solid var(--rule)}
h1{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;letter-spacing:.2px}
h1 i{font-size:14px;color:var(--grey)}
.valid{font-family:var(--plot);font-size:12.5px;margin-top:3px}
.valid b{font-weight:700}
.census{margin-top:8px;font-size:12.5px;line-height:1.5;border-top:1px solid var(--rule);padding-top:6px}
.census .n{font-weight:700;font-size:14px}
.census .th{color:var(--red)}
.lens{font-size:12px;color:var(--grey);margin-top:2px}
.lens u{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink)}
h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:15px;margin:12px 0 4px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule)}
h2 small{font-family:var(--plot);font-style:normal;font-size:11px;color:var(--grey)}
.warn{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;padding:6px 0;border-bottom:1px dotted var(--rule);cursor:pointer}
.warn svg{grid-row:span 2}
.warn .say{font-size:12.5px;line-height:1.3}
.warn .say b{color:var(--red)}
.warn .keys{font-size:11.5px;color:var(--grey)}
kbd{font-family:var(--plot);font-size:11px;border:1px solid var(--ink);border-bottom-width:2px;padding:0 3px;color:var(--ink);background:#fbf9f3}
#slip{flex:0 0 auto}
#slip .title{font-family:var(--serif);font-size:14.5px;line-height:1.3;margin:2px 0 4px}
#slip .refs{font-size:12px;color:var(--grey)}
#slip .say{font-size:12.5px;line-height:1.35;margin:4px 0}
#slip .acts{font-size:12px;line-height:1.7;color:var(--grey)}
#slip .acts span{margin-right:10px;white-space:nowrap}
#slip .acts .off{opacity:.35}
#host{font-size:12.5px;line-height:1.45}
#host table{border-collapse:collapse;width:100%}
#host td{padding:0 6px 0 0;vertical-align:top}
#host td:first-child{color:var(--grey);font-family:var(--serif);font-style:italic;white-space:nowrap}
.held{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:4px}
#tty{flex:1 1 auto;overflow:hidden;font-size:11.5px;line-height:1.45}
#tty div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tty div.new{animation:ink 2.5s ease-out}
#tty .t{color:var(--grey);margin-right:6px}
#tty .k{font-weight:700}
@keyframes ink{from{background:#e4dcc2}to{background:transparent}}
.hint{position:absolute;left:14px;bottom:10px;font-size:11.5px;color:var(--grey)}
#call{position:absolute;right:14px;top:12px;font-family:var(--plot);font-size:22px;letter-spacing:2px;color:var(--ink);display:none;background:var(--paper);border:1px solid var(--ink);padding:2px 10px}
#call small{font-size:11px;letter-spacing:0;color:var(--grey);display:block}
.plot{cursor:pointer}
.station:hover .hov{opacity:1}
.hov{opacity:0}
.pencil-note{pointer-events:none}
.ring{pointer-events:none}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:1;r:6}100%{opacity:0;r:30}}
#legend{position:absolute;inset:0;background:rgba(245,242,233,.97);display:none;padding:28px 40px;overflow:auto}
#legend.on{display:block}
</style>
</head>
<body>
<svg id="map" tabindex="0" viewBox="0 0 1200 1000"></svg>
<div id="call"></div>
<aside id="margin">
  <h1>blizzard <i>upper air · the fleet</i></h1>
  <div class="valid">valid <b id="clock">13:08:30</b> Sun 25 Oct 2026 · replot 5 s · hub <b>ok</b></div>
  <div class="lens"><kbd>S</kbd> surface chart · <kbd>tab</kbd> next station · <kbd>?</kbd> legend</div>
  <div class="census" id="census"></div>
  <h2>Host <small id="hostkeys"></small></h2>
  <div id="host"></div>
  <h2>Plot <small>hover or <kbd>tab</kbd></small></h2>
  <div id="slip"></div>
  <h2>Teletype <small>live</small></h2>
  <div id="tty"></div>
</aside>
<div id="legend"></div>
<script>
/* SYNOP — the fleet plotted as a surface weather chart.
   Shared notation: station plots, barbs, oktas, present-weather glyphs,
   tendency traces, fronts, coastlines. Every page inlines this file. */
const NS = 'http://www.w3.org/2000/svg';
const INK = '#1c1b18', PAPER = '#f5f2e9', LAND = '#e9e2cc', COAST = '#6d6352',
  WATER = '#8fa7b6', RED = '#c4122f', BLUE = '#1d4f9c', GREEN = '#2f8a3a',
  PENCIL = '#77736a', GREY = '#9a9486';
const NODE_OKTA = { triage: 1, survey: 1, build: 2, review: 3, mutation: 4, 'pre-push': 5, deliver: 6 };
const NODE_ABBR = { triage: 'tri', survey: 'srv', build: 'bld', review: 'rvw', mutation: 'mut', 'pre-push': 'pp', deliver: 'dlv', done: 'done' };
const NODE_BY_OKTA = ['ready', 'triage', 'build', 'review', 'mutation', 'pre-push', 'deliver', 'delivering', 'done'];
const RUNNER_BEARING = { 'r-claude': 340, 'r-chatgpt': 20 };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, attrs) {
  const t = el('text', Object.assign({ x, y }, attrs || {}), parent);
  t.textContent = s;
  return t;
}

/* Oktas of the circle: how far through its graph the chunk has walked. */
function okta(c) {
  if (c.status === 'done') return 8;
  if (c.status === 'delivering') return 7;
  if (c.status === 'ready' || c.status === 'backlog' || c.status === 'waiting') return 0;
  return NODE_OKTA[c.node] || 1;
}
function drawOktas(g, n, r, ink) {
  el('circle', { r, fill: PAPER, stroke: ink, 'stroke-width': 1.3 }, g);
  if (n <= 0) return;
  if (n >= 8) { el('circle', { r, fill: ink }, g); return; }
  if (n === 7) {
    el('circle', { r, fill: ink }, g);
    el('line', { x1: 0, y1: -r, x2: 0, y2: r, stroke: PAPER, 'stroke-width': 1.4 }, g);
    return;
  }
  const quarters = Math.floor(n / 2), line = n % 2 === 1;
  if (quarters > 0) {
    const a = quarters * Math.PI / 2;
    const x = r * Math.sin(a), y = -r * Math.cos(a);
    const d = `M0 0 L0 ${-r} A${r} ${r} 0 ${quarters > 2 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`;
    el('path', { d, fill: ink }, g);
  }
  if (line) el('line', { x1: 0, y1: -r, x2: 0, y2: r, stroke: ink, 'stroke-width': 1.3 }, g);
}

/* Wind barb: shaft bearing names the runner, feathers count dollars.
   Pennant $10 · full feather $2 · half feather $1. */
function feathers(dollars) {
  let v = Math.round(dollars), p = Math.floor(v / 10); v -= p * 10;
  let f = Math.floor(v / 2); v -= f * 2;
  return { p, f, h: v };
}
function drawBarb(g, bearing, dollars, r, len, ink, scale) {
  const s = scale || 1, a = bearing * Math.PI / 180;
  const ux = Math.sin(a), uy = -Math.cos(a);
  const nx = uy, ny = -ux; // feathers to the clockwise side
  const x0 = ux * r, y0 = uy * r, x1 = ux * len, y1 = uy * len;
  el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: ink, 'stroke-width': 1.1 * s }, g);
  const { p, f, h } = feathers(dollars);
  if (!p && !f && !h) {
    el('circle', { cx: x1, cy: y1, r: 1.3 * s, fill: ink }, g); // under a dollar: a dot, not calm
    return;
  }
  let at = len, step = 4.2 * s, fl = 9 * s;
  const pt = (d, o) => [ux * d + nx * o, uy * d + ny * o];
  for (let i = 0; i < p; i++) {
    const [ax, ay] = pt(at, 0), [bx, by] = pt(at - step * 1.4, 0), [cx, cy] = pt(at - 0.2 * s, fl);
    el('path', { d: `M${ax} ${ay} L${cx} ${cy} L${bx} ${by} Z`, fill: ink }, g);
    at -= step * 1.7;
  }
  for (let i = 0; i < f; i++) {
    const [ax, ay] = pt(at, 0), [bx, by] = pt(at + 2.4 * s, fl);
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: ink, 'stroke-width': 1.1 * s }, g);
    at -= step;
  }
  if (h) {
    if (!p && !f) at -= step; // a lone half feather sits in from the tip, as on a real barb
    const [ax, ay] = pt(at, 0), [bx, by] = pt(at + 1.3 * s, fl * 0.55);
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: ink, 'stroke-width': 1.1 * s }, g);
  }
}

/* Present weather: the state the chunk is in right now. */
function drawWx(g, kind, x, y, s) {
  s = s || 1;
  const w = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, g);
  if (kind === 'rain') { // running
    el('circle', { cx: -3, cy: 0, r: 1.7, fill: INK }, w);
    el('circle', { cx: 3, cy: 0, r: 1.7, fill: INK }, w);
  } else if (kind === 'shower') { // delivering: dropping onto master
    el('path', { d: 'M-4 -1 L4 -1 L0 6 Z', fill: 'none', stroke: INK, 'stroke-width': 1.1 }, w);
    el('circle', { cx: 0, cy: -4.5, r: 1.6, fill: INK }, w);
  } else if (kind === 'thunder') { // needs a human
    el('path', { d: 'M-4 -6 L-4 6 M-4 -6 L4 -6 L0.5 0.5 L4 0.5 L1 6.5', fill: 'none', stroke: RED, 'stroke-width': 1.6, 'stroke-linejoin': 'miter' }, w);
    el('path', { d: 'M1 6.5 L-0.8 3.6 L2.9 4.4 Z', fill: RED }, w);
  } else if (kind === 'fog') { // waiting / saturated
    for (let i = -1; i <= 1; i++) el('line', { x1: -5, y1: i * 3, x2: 5, y2: i * 3, stroke: INK, 'stroke-width': 1.1 }, w);
  } else if (kind === 'hold') { // operator hold
    el('line', { x1: -1.6, y1: -5, x2: -1.6, y2: 5, stroke: INK, 'stroke-width': 1.5 }, w);
    el('line', { x1: 1.6, y1: -5, x2: 1.6, y2: 5, stroke: INK, 'stroke-width': 1.5 }, w);
  }
  return w;
}
function wxOf(c) {
  if (c.held) return 'hold';
  return { running: 'rain', delivering: 'shower', needs_human: 'thunder', waiting: 'fog' }[c.status] || null;
}

/* Tendency: the barograph of the chunk's walk — node level over its last visits. */
function drawTrace(g, trace, x, y, w, h, ink, sw) {
  if (!trace || trace.length < 2) return;
  const t = trace.slice(-8), n = t.length;
  const pts = t.map((v, i) => [x + (i / (n - 1)) * w, y + h - (v / 7) * h]);
  el('polyline', { points: pts.map(p => p.map(q => q.toFixed(1)).join(',')).join(' '), fill: 'none', stroke: ink, 'stroke-width': sw || 1.1, 'stroke-linejoin': 'round' }, g);
  for (let i = 1; i < n; i++) if (t[i] < t[i - 1]) {
    el('circle', { cx: pts[i][0], cy: pts[i][1], r: 1.3, fill: RED }, g);
  }
}
function bounces(trace) {
  let b = 0;
  if (trace) for (let i = 1; i < trace.length; i++) if (trace[i] < trace[i - 1]) b++;
  return b;
}
function money(v) {
  if (v >= 10) return Math.round(v).toString();
  if (v >= 1) return v.toFixed(1);
  return v.toFixed(2).replace(/^0/, '');
}
function ageStr(min) {
  if (min < 1) return Math.round(min * 60) + '"';
  if (min < 60) return Math.floor(min) + "'";
  return Math.floor(min / 60) + 'h';
}
function refShort(c) {
  const r = c.refs[0] || '';
  const s = r.startsWith('blizzard#') ? '#' + r.slice(9) : r;
  const extra = c.refs.length - 1 + (c.more || 0);
  return extra > 0 ? s + '+' + extra : s;
}

/* One station plot, drawn at the origin of g. Positions are fixed:
     cost   UL │ UR call sign
     wx  ◯ tendency
     age    LL │ LR bounces
           work ref                               */
function drawStation(g, c, opt) {
  opt = opt || {};
  const s = opt.scale || 1;
  const big = (c.status !== 'ready' && c.status !== 'backlog' && c.status !== 'done') || opt.full;
  const P = el('g', { class: 'plot', transform: s !== 1 ? `scale(${s})` : null }, g);
  const font = 'font-family:var(--plot);';
  if (c.status === 'done') {
    const old = !/^\d\d:\d\d$/.test(c.done || '');
    el('circle', { r: 3.2, fill: old ? GREY : INK }, P);
    txt(P, 5, -3, c.id, { style: font + `font-size:8.5px;fill:${old ? GREY : '#4b473e'}` });
    return P;
  }
  if (c.status === 'backlog') {
    el('rect', { x: -5, y: -5, width: 10, height: 10, fill: PAPER, stroke: INK, 'stroke-width': 1.3 }, P);
  } else {
    if (c.status === 'needs_human') el('circle', { r: 6.4, fill: 'none', stroke: RED, 'stroke-width': 2.2 }, P);
    const okg = el('g', {}, P);
    drawOktas(okg, okta(c), c.status === 'ready' ? 4.6 : 6, INK);
  }
  const R = c.status === 'ready' || c.status === 'backlog' ? 5 : 6;
  if (big && c.runner) drawBarb(P, RUNNER_BEARING[c.runner] || 0, c.cost, R, 27, INK);
  if (big && c.cost != null) txt(P, -9, -5, money(c.cost), { 'text-anchor': 'end', style: font + `font-size:11px;font-weight:600;${c.est ? 'font-style:italic;' : ''}fill:${INK}` });
  txt(P, R + 3, big ? -5 : -3, c.id, { style: font + `font-size:${big ? 11 : 10}px;font-weight:${big ? 700 : 400};fill:${INK};letter-spacing:.2px` });
  const wx = wxOf(c);
  if (wx) drawWx(P, wx, -15, 0.5);
  if (big) {
    drawTrace(P, c.trace, R + 3, -2, 18, 8, INK);
    txt(P, -9, 14, ageStr(c.age), { 'text-anchor': 'end', class: 'age', style: font + 'font-size:10px;fill:#4b473e' });
    const b = bounces(c.trace);
    if (b) txt(P, R + 3, 15, b.toString(), { style: font + `font-size:10.5px;font-weight:700;fill:${RED}` });
  }
  txt(P, 0, big ? 26 : 13, refShort(c), { 'text-anchor': 'middle', style: font + `font-size:${big ? 9.5 : 8.5}px;fill:${GREY}` });
  return P;
}

/* Fronts: the line from a blocker to the chunk it holds.
   Kind follows the blocker: running → warm (red, semicircles), ready → cold
   (blue, triangles), stuck on a human → stationary (both, alternating).
   Pips sit on the left as you walk from blocker to held. */
function frontKind(blocker) {
  if (!blocker) return null;
  if (blocker.status === 'needs_human' || blocker.status === 'waiting') return 'stationary';
  if (blocker.status === 'running' || blocker.status === 'delivering') return 'warm';
  if (blocker.status === 'done') return null;
  return 'cold';
}
function frontPath(a, b, bend) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
  const k = bend == null ? 0.18 : bend;
  return `M${a.x} ${a.y} Q${mx - dy * k} ${my + dx * k} ${b.x} ${b.y}`;
}
function drawFront(g, a, b, kind, opt) {
  opt = opt || {};
  const pencil = opt.pencil, sz = opt.size || 4.2, gap = opt.gap || 17;
  const fg = el('g', { class: 'front ' + kind + (pencil ? ' pencil' : '') }, g);
  const d = frontPath(a, b, opt.bend);
  const probe = el('path', { d, fill: 'none', stroke: 'none' }, fg);
  const L = probe.getTotalLength();
  const trim0 = opt.trim0 == null ? 9 : opt.trim0, trim1 = opt.trim1 == null ? 9 : opt.trim1;
  if (L < trim0 + trim1 + 6) return fg;
  const col = pencil ? PENCIL : (kind === 'warm' ? RED : kind === 'cold' ? BLUE : kind === 'stationary' ? RED : '#6a3d8f');
  const W = opt.width || 1.5;
  const pts = [];
  for (let s = trim0; s <= L - trim1; s += 2) pts.push(probe.getPointAtLength(s));
  if (kind === 'stationary' && !pencil) {
    const seg = gap;
    for (let s = trim0, i = 0; s < L - trim1; s += seg, i++) {
      const sub = [];
      for (let t = s; t <= Math.min(s + seg, L - trim1); t += 2) sub.push(probe.getPointAtLength(t));
      el('polyline', { points: sub.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '), fill: 'none', stroke: i % 2 ? BLUE : RED, 'stroke-width': W }, fg);
    }
  } else {
    el('polyline', { points: pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '), fill: 'none', stroke: col, 'stroke-width': W, 'stroke-dasharray': pencil ? '3 2' : null }, fg);
  }
  el('circle', { cx: pts[0].x, cy: pts[0].y, r: W * 1.3, fill: col }, fg);
  for (let s = Math.max(trim0 + gap * 0.6, (opt.pipFrom || 0) * L), i = 0; s < L - trim1 - 4; s += gap, i++) {
    const p = probe.getPointAtLength(s), q = probe.getPointAtLength(Math.min(L, s + 1));
    let tx = q.x - p.x, ty = q.y - p.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const nx = ty, ny = -tx; // left of travel
    let shape = kind === 'warm' ? 'semi' : kind === 'cold' ? 'tri' : (i % 2 ? 'tri' : 'semi');
    let side = 1, c = col;
    if (kind === 'stationary' && !pencil) { c = shape === 'tri' ? BLUE : RED; side = shape === 'tri' ? -1 : 1; }
    const bx = p.x, by = p.y;
    if (shape === 'tri') {
      const a1 = [bx - tx * sz, by - ty * sz], a2 = [bx + tx * sz, by + ty * sz], tip = [bx + nx * sz * 1.5 * side, by + ny * sz * 1.5 * side];
      el('path', { d: `M${a1} L${tip} L${a2} Z`, fill: c }, fg);
    } else {
      const a1 = [bx - tx * sz, by - ty * sz], a2 = [bx + tx * sz, by + ty * sz];
      const sweep = side > 0 ? 0 : 1;
      el('path', { d: `M${a1} A${sz} ${sz} 0 0 ${sweep} ${a2} Z`, fill: c }, fg);
    }
  }
  if (opt.label) {
    const p = probe.getPointAtLength(L * 0.5);
    txt(fg, p.x + 4, p.y - 5, opt.label, { style: `font-family:var(--plot);font-size:9px;fill:${col}` });
  }
  return fg;
}

/* Coastlines: a region's landmass is the metaball of its stations, cut
   by an SVG filter so the shore stays smooth at any count. */
function landFilter(defs, id, blur) {
  const f = el('filter', { id, x: '-30%', y: '-30%', width: '160%', height: '160%', 'color-interpolation-filters': 'sRGB' }, defs);
  el('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: blur || 13, result: 'b' }, f);
  const ct = el('feComponentTransfer', { in: 'b', result: 'm' }, f);
  el('feFuncA', { type: 'linear', slope: 28, intercept: -9 }, ct);
  el('feFlood', { 'flood-color': LAND, result: 'lc' }, f);
  el('feComposite', { in: 'lc', in2: 'm', operator: 'in', result: 'land' }, f);
  el('feMorphology', { in: 'm', operator: 'dilate', radius: 1.1, result: 'd1' }, f);
  el('feComposite', { in: 'd1', in2: 'm', operator: 'out', result: 'r1' }, f);
  el('feFlood', { 'flood-color': COAST, result: 'cc' }, f);
  el('feComposite', { in: 'cc', in2: 'r1', operator: 'in', result: 'coast' }, f);
  const rings = [];
  [5, 10, 16].forEach((rad, i) => {
    el('feMorphology', { in: 'm', operator: 'dilate', radius: rad, result: 'wa' + i }, f);
    el('feMorphology', { in: 'm', operator: 'dilate', radius: rad - 0.7, result: 'wb' + i }, f);
    el('feComposite', { in: 'wa' + i, in2: 'wb' + i, operator: 'out', result: 'wr' + i }, f);
    el('feFlood', { 'flood-color': WATER, 'flood-opacity': [0.55, 0.35, 0.18][i], result: 'wc' + i }, f);
    el('feComposite', { in: 'wc' + i, in2: 'wr' + i, operator: 'in', result: 'w' + i }, f);
    rings.push('w' + i);
  });
  const m = el('feMerge', {}, f);
  rings.concat(['land', 'coast']).forEach(r => el('feMergeNode', { in: r }, m));
}
function drawLand(g, pts, filterId, rad) {
  const lg = el('g', { filter: `url(#${filterId})` }, g);
  pts.forEach(p => el('circle', { cx: p.x, cy: p.y, r: p.r || rad || 30, fill: '#000' }, lg));
  return lg;
}

/* Isopleths of spend: a marching-squares contour of a cost field. */
function contourSegments(f, x0, y0, x1, y1, step, level) {
  const nx = Math.ceil((x1 - x0) / step), ny = Math.ceil((y1 - y0) / step);
  const v = [];
  for (let j = 0; j <= ny; j++) { v[j] = []; for (let i = 0; i <= nx; i++) v[j][i] = f(x0 + i * step, y0 + j * step); }
  const segs = [];
  const lerp = (a, b, va, vb) => a + (b - a) * ((level - va) / (vb - va));
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = v[j][i], b = v[j][i + 1], c = v[j + 1][i + 1], d = v[j + 1][i];
    const X = x0 + i * step, Y = y0 + j * step;
    const idx = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (c > level ? 2 : 0) | (d > level ? 1 : 0);
    if (idx === 0 || idx === 15) continue;
    const top = [lerp(X, X + step, a, b), Y], right = [X + step, lerp(Y, Y + step, b, c)],
      bottom = [lerp(X, X + step, d, c), Y + step], left = [X, lerp(Y, Y + step, a, d)];
    const T = {
      1: [[left, bottom]], 2: [[bottom, right]], 3: [[left, right]], 4: [[top, right]],
      5: [[left, top], [bottom, right]], 6: [[top, bottom]], 7: [[left, top]], 8: [[left, top]],
      9: [[top, bottom]], 10: [[left, bottom], [top, right]], 11: [[top, right]], 12: [[left, right]],
      13: [[bottom, right]], 14: [[left, bottom]]
    }[idx];
    T.forEach(s => segs.push(s));
  }
  return segs;
}

function pencilRing(g, r, cls) {
  let d = '';
  const n = 26, j = [];
  for (let i = 0; i <= n + 3; i++) {
    const a = (i / n) * Math.PI * 2 - 0.4, rr = r + Math.sin(i * 2.3) * 1.2 + (i > n ? 2.5 : 0);
    d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);

/* The shipping-forecast grammar: a station read aloud. */
const WORDS = ['nought', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
function sayNum(n) { return n <= 10 ? WORDS[n] : String(n); }
function decode(c, byId) {
  const parts = [];
  const st = {
    running: 'precipitating at ' + c.node, delivering: 'showers, landing at deliver',
    needs_human: 'thunder at ' + c.node + ', wants a human', ready: c.blocker ? 'fair, held' : 'fair, claimable',
    backlog: 'unplotted, backlog', done: 'settled', waiting: 'fog, waiting'
  }[c.status];
  parts.push(st);
  if (c.status !== 'ready' && c.status !== 'backlog' && c.status !== 'done') parts.push(sayNum(okta(c)) + ' eighths');
  if (c.cost) parts.push((c.est ? 'about ' : '') + '$' + c.cost.toFixed(2));
  const b = bounces(c.trace);
  if (b) parts.push('bounced ' + sayNum(b));
  if (c.attempts) parts.push(c.attempts + ' attempts');
  if (c.blocker && byId[c.blocker]) parts.push('behind ' + c.blocker + (c.blockN > 1 ? ' and ' + (c.blockN - 1) + ' more' : ''));
  if (c.runner) parts.push('on xps/' + c.runner);
  return c.id + ', ' + parts.join('; ') + '.';
}

/* Replays a key script from ?keys= so a static render can show a state the
   keyboard reached: "g6J~t" types g,6,J then waits, then t. */
function replayKeys() {
  const ks = new URLSearchParams(location.search).get('keys');
  if (!ks) return;
  let t = 300;
  for (const ch of ks) {
    if (ch === '~') { t += 1800; continue; }
    const key = { '<': 'ArrowLeft', '>': 'ArrowRight', '^': 'ArrowUp', '_': 'ArrowDown', '!': 'Enter', '|': 'Tab' }[ch] || ch;
    setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key, shiftKey: key.length === 1 && key !== key.toLowerCase() })), t);
    t += 120;
  }
}

  { k: 'SEA', name: null, x: 0, y: 0, rows: 1 },

const SEA_POS = { WSCR: [700, 640], HBRY: [930, 640] };

function layout() {
  const byId = {}; CHUNKS.forEach(c => byId[c.id] = c);
  REGIONS.forEach((R, ri) => {
    R.n = ri + 1;
    const mem = CHUNKS.filter(c => c.region === R.k);
    if (R.k === 'SEA') { mem.forEach(c => { c.x = SEA_POS[c.id][0]; c.y = SEA_POS[c.id][1]; }); return; }
    const done = mem.filter(c => c.status === 'done');
    const live = mem.filter(c => c.status !== 'done');
    const dcw = 50, dch = 24, drows = Math.max(R.rows * 2, 2);
    const dcols = R.dcols || Math.ceil(done.length / drows);
    done.forEach((c, i) => {
      c.x = R.x + Math.floor(i / Math.ceil(done.length / dcols)) * dcw;
      c.y = R.y + (i % Math.ceil(done.length / dcols)) * dch;
    });
    let x = R.x + (done.length ? dcols * dcw + 22 : 0);
    const depth = c => {
      const b = c.blocker && byId[c.blocker];
      if (!b || b.region !== R.k || b.status === 'done') return 0;
      return 1 + depth(b);
    };
    const cols = [];
    live.forEach(c => { const d = depth(c); (cols[d] = cols[d] || []).push(c); });
    const rank = c => ({ needs_human: 0, running: 1, delivering: 1, ready: 2, backlog: 3 }[c.status]);
    const cw = R.cw || 72, ch = R.ch || 46;
    cols.forEach(col => {
      col.sort((a, b) => rank(a) - rank(b));
      col.forEach((c, i) => {
        const sub = Math.floor(i / R.rows), row = i % R.rows;
        c.x = x + sub * cw + 14; c.y = R.y + row * ch + (row % 2 && R.rows > 1 ? 0 : 0);
      });
      x += Math.ceil(col.length / R.rows) * cw;
    });
    const xs = mem.map(c => c.x), ys = mem.map(c => c.y);
    R.box = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  });
}

/* A region's coast: each station's own circle plus satellites fixed by its call sign. */
function regionBlobs(mem) {
  const blobs = [];

    const d = c.status === 'done';

function lakeFilter(defs, id) {

  el('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: 9, result: 'b' }, f);
  const ct = el('feComponentTransfer', { in: 'b', result: 'm' }, f);
  el('feFuncA', { type: 'linear', slope: 28, intercept: -9 }, ct);
  el('feFlood', { 'flood-color': '#dde6e6', result: 'wc' }, f);
  el('feComposite', { in: 'wc', in2: 'm', operator: 'in', result: 'water' }, f);
  el('feMorphology', { in: 'm', operator: 'dilate', radius: 1.1, result: 'd1' }, f);
  el('feComposite', { in: 'd1', in2: 'm', operator: 'out', result: 'r1' }, f);
  el('feFlood', { 'flood-color': COAST, result: 'cc' }, f);
  el('feComposite', { in: 'cc', in2: 'r1', operator: 'in', result: 'coast' }, f);
  const ins = [];
  [5, 10].forEach((rad, i) => {
    el('feMorphology', { in: 'm', operator: 'erode', radius: rad, result: 'ea' + i }, f);
    el('feMorphology', { in: 'm', operator: 'erode', radius: rad + 0.7, result: 'eb' + i }, f);
    el('feComposite', { in: 'ea' + i, in2: 'eb' + i, operator: 'out', result: 'er' + i }, f);
    el('feFlood', { 'flood-color': WATER, 'flood-opacity': [0.6, 0.35][i], result: 'ec' + i }, f);
    el('feComposite', { in: 'ec' + i, in2: 'er' + i, operator: 'in', result: 'e' + i }, f);
    ins.push('e' + i);
  });
  const m = el('feMerge', {}, f);
  ['water'].concat(ins, ['coast']).forEach(r => el('feMergeNode', { in: r }, m));

  const lv = (i) => n === 1 ? (py0 + py1) / 2 : py1 - (i / (n - 1)) * (py1 - py0) * 0.9 - 8;
  const X = (p, Y) => px0 + (p / 100) * (px1 - px0) + 18 * (py1 - Y) / (py1 - py0);
  const Tp = [], Dp = [];
  sub.windows.forEach((win, i) => {
    const Y = lv(i);
    el('line', { x1: px0 - 4, y1: Y, x2: px1 + 18, y2: Y, stroke: '#b9b19d', 'stroke-width': 0.7 }, g);
    txt(g, px0 - 10, Y + 5, win.w, { 'text-anchor': 'end', style: 'font-family:var(--plot);font-size:15px;font-weight:700;fill:#3a352b' });
    txt(g, px0 - 10, Y + 18, 'until ' + win.until, { 'text-anchor': 'end', style: 'font-family:var(--plot);font-size:9px;fill:#8c8676' });
    const xt = X(win.T, Y), xd = X(win.Td, Y);
    const isSat = win.Td >= win.T;
    el('rect', { x: Math.min(xt, xd), y: Y - 7, width: Math.max(2, Math.abs(xt - xd)), height: 14, fill: isSat ? 'url(#fogh)' : '#e7efe0', stroke: 'none' }, g);
    el('circle', { cx: xt, cy: Y, r: 5, fill: RED }, g);
    el('circle', { cx: xd, cy: Y, r: 5, fill: GREEN }, g);
    txt(g, xt + (xt >= xd ? 9 : -9), Y - 9, 'T ' + win.T, { 'text-anchor': xt >= xd ? 'start' : 'end', style: 'font-family:var(--plot);font-size:11px;font-weight:700;fill:' + RED });
    txt(g, xd + (xd > xt ? 9 : -9), Y + 19, 'Td ' + win.Td, { 'text-anchor': xd > xt ? 'start' : 'end', style: 'font-family:var(--plot);font-size:11px;font-weight:700;fill:' + GREEN });
    const sp = win.T - win.Td;
    const sx = Math.max(xt, xd) + 46;
    if (isSat) {
      drawWx(g, 'fog', sx, Y - 1, 1.4);
      txt(g, sx + 14, Y + 4, 'saturated · declining until ' + win.until, { style: 'font-family:var(--plot);font-size:12px;font-weight:700;fill:#3a352b' });
    } else {
      txt(g, sx, Y + 5, 'spread ' + sp, { style: `font-family:var(--plot);font-size:13px;font-weight:700;fill:${sp <= 3 ? RED : '#3a352b'}` });
      if (sp <= 3) txt(g, sx, Y + 18, 'near saturation', { style: 'font-family:var(--serif);font-style:italic;font-size:10.5px;fill:' + RED });
    }
    Tp.push([xt, Y]); Dp.push([xd, Y]);
  });
  if (n > 1) {
    el('polyline', { points: Tp.map(p => p.join(',')).join(' '), fill: 'none', stroke: RED, 'stroke-width': 1.6 }, g);
    el('polyline', { points: Dp.map(p => p.join(',')).join(' '), fill: 'none', stroke: GREEN, 'stroke-width': 1.6, 'stroke-dasharray': '5 3' }, g);
  }
  return { x: x + w / 2, y: y + h };
}

    items.push({ kind: 'runner', key: r.id, x: a.x, y: a.y, r: 50 });

}

function tty(code, text, cls) {

function write(at, text, after) {

  pencil.push(p); drawUI();

document.addEventListener('keydown', e => {
  const lg = document.getElementById('legend');
  if (lg.classList.contains('on')) { if (e.key === 'Escape' || e.key === '?') lg.classList.remove('on'); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    const order = items.filter(i => i.kind !== 'free');
    let i = sel ? order.findIndex(x => x.key === sel.key) : -1;
    i = e.shiftKey ? (i <= 0 ? order.length - 1 : i - 1) : (i + 1) % order.length;
    sel = order[i]; drawUI(); slip(); return;
  }
  if (e.key === '?') { if (!lg.innerHTML) buildLegend(lg); lg.classList.add('on'); return; }
  if (e.key === 'S') { location.href = 'board-desktop.html'; return; }
  if (e.key === 'Escape') { sel = null; drawUI(); slip(); return; }
  if (e.key === 'E') return write({ x: 600, y: 420, key: 'xps' }, 'enroll');
  if (e.key === 'R') return write({ x: 600, y: 420, key: 'xps' }, 'revoke token');
  if (e.key === 'X') return write({ x: 600, y: 420, key: 'xps' }, 'retire?  X again to confirm');

  if (e.key === 'p' && sel.kind === 'runner') {

  }
  if (e.key === 'Enter' && sel.kind === 'slot') location.href = 'board-desktop.html?sel=' + sel.key;
