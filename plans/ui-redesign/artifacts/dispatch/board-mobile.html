  --fg: #111722; --fg-2: #434c5a; --fg-3: #626b79; --fg-4: #8a929e;
  --ink: #111722; --ink-fg: #ffffff;
  --nav-bg: #161b22; --nav-fg: #c9d1db; --nav-fg-2: #8b95a3; --nav-hover: #212833; --nav-active: #2a323e; --nav-line: #262d38;
  --shadow-1: 0 1px 2px rgba(17, 23, 34, .06);
  --shadow-2: 0 4px 16px rgba(17, 23, 34, .10), 0 1px 3px rgba(17, 23, 34, .08);
  --shadow-3: 0 18px 48px rgba(17, 23, 34, .18), 0 2px 8px rgba(17, 23, 34, .10);
  --scrim: rgba(17, 23, 34, .28);

  /* status roles: the only hues on the page */
  --nh: #c4232c;   --nh-bg: #fdeced;   --nh-line: #f3b9bc;
  --wait: #925400; --wait-bg: #fdf2dc; --wait-line: #efcf8f;
  --run: #1659c7;  --run-bg: #eaf2fe;  --run-line: #b5cdf6;
  --dlv: #0b7066;  --dlv-bg: #e2f4f1;  --dlv-line: #a9dbd3;
  --done: #1a7040; --done-bg: #e6f4eb; --done-line: #b4dcc2;
  --ready: #4a5260; --ready-bg: #eef1f4;
  --backlog: #a3abb7;
  --focus: #2563eb;

  /* timeline */
  --seg: #e3e8ee; --seg-2: #d5dce5; --seg-fg: #505968; --seg-done: #edf0f4; --hatch: rgba(17, 23, 34, .07);
}
html[data-theme="dark"] {
  --bg-canvas: #0d1015; --bg-surface: #151a21; --bg-subtle: #11151b; --bg-hover: #1c222b; --bg-press: #232a35;
  --line: #242b35; --line-2: #313a47; --line-3: #4a5462;
  --fg: #e8ecf1; --fg-2: #b4bcc8; --fg-3: #8f99a7; --fg-4: #6d7785;
  --ink: #e8ecf1; --ink-fg: #0d1015;
  --nav-bg: #0a0d11; --nav-fg: #c3cad4; --nav-fg-2: #7c8694; --nav-hover: #161b22; --nav-active: #1e252f; --nav-line: #1a2028;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 4px 16px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-3: 0 18px 48px rgba(0, 0, 0, .6), 0 2px 8px rgba(0, 0, 0, .4);
  --scrim: rgba(0, 0, 0, .5);
  --nh: #ff6b6b;   --nh-bg: #3a1618;   --nh-line: #6b2a2e;
  --wait: #f0b54d; --wait-bg: #33260f; --wait-line: #5c4518;
  --run: #6fa6ff;  --run-bg: #14243f;  --run-line: #26426e;
  --dlv: #4fd1bf;  --dlv-bg: #0f2c29;  --dlv-line: #1d4f49;
  --done: #5fcf8a; --done-bg: #12291c; --done-line: #22492f;
  --ready: #aab3bf; --ready-bg: #1d232c;
  --backlog: #5f6875;
  --focus: #6ea0ff;
  --seg: #222933; --seg-2: #2b3340; --seg-fg: #a8b1bd; --seg-done: #1a1f27; --hatch: rgba(255, 255, 255, .06);
}
html[data-density="compact"] {
  --fs-body: var(--fs-sm); --fs-meta: var(--fs-xs);
  --row: 28px; --ctl: 26px; --gut: 16px; --pad: 10px; --top: 40px; --nav-item: 26px; --lane: 24px;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: 1.4; color: var(--fg);
  background: var(--bg-canvas); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "tnum";
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r-sm); }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.faint { color: var(--fg-4); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; }
.ic.xs { width: 12px; height: 12px; }

/* ---------- Buttons, pills, kbd ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl); padding: 0 10px; border-radius: var(--r-md);
  border: 1px solid var(--line-2); background: var(--bg-surface); color: var(--fg); font-weight: 500; font-size: var(--fs-md);
  white-space: nowrap; box-shadow: var(--shadow-1); }
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-press); }
.btn.ink { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.ink:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.danger { color: var(--nh); }
.btn.sm { height: 26px; padding: 0 8px; font-size: var(--fs-sm); }
.btn.icon { width: var(--ctl); padding: 0; justify-content: center; }
.btn.sm.icon { width: 26px; }
.btn .kbd { margin-left: 2px; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 4px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--bg-surface);
  font: 500 10.5px/1 var(--font-sans); color: var(--fg-3); }
.btn.ink .kbd { background: transparent; border-color: rgba(255,255,255,.3); color: inherit; opacity: .75; }
html[data-theme="dark"] .btn.ink .kbd { border-color: rgba(0,0,0,.3); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--ready-bg); color: var(--fg-2); }
.pill.nh { background: var(--nh-bg); color: var(--nh); }
.pill.wait { background: var(--wait-bg); color: var(--wait); }
.pill.run { background: var(--run-bg); color: var(--run); }
.pill.dlv { background: var(--dlv-bg); color: var(--dlv); }
.pill.done { background: var(--done-bg); color: var(--done); }
.pill.outline { background: transparent; border: 1px solid var(--line-2); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; font-size: var(--fs-2xs); font-weight: 600; background: var(--bg-press); color: var(--fg-2); }
.count.nh { background: var(--nh); color: #fff; }
.epic { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--r-sm); border: 1px solid var(--line);
  font-size: var(--fs-2xs); font-weight: 600; color: var(--fg-3); letter-spacing: .01em; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* status glyphs: shape carries status in greyscale */
.g { width: 14px; height: 14px; flex: none; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 216px 1fr; height: 100vh; }
.nav { background: var(--nav-bg); color: var(--nav-fg); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--nav-line); }
.nav .brand { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 14px; border-bottom: 1px solid var(--nav-line); }
.nav .mark { width: 26px; height: 26px; border-radius: 6px; background: #e8ecf1; color: #111722; display: grid; place-items: center; }
.nav .brand b { font-weight: 600; color: #f1f4f8; font-size: var(--fs-md); display: block; line-height: 1.1; }
.nav .brand span { font-size: var(--fs-xs); color: var(--nav-fg-2); }
.nav .search { margin: 10px 10px 6px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r-md);
  background: var(--nav-hover); color: var(--nav-fg-2); font-size: var(--fs-sm); border: 1px solid var(--nav-line); }
.nav .search .kbd { margin-left: auto; background: transparent; border-color: #39424f; color: var(--nav-fg-2); }
.nav .sect { padding: 14px 16px 4px; font-size: var(--fs-xs); color: var(--nav-fg-2); font-weight: 500; }
.nav a.item { display: flex; align-items: center; gap: 10px; height: var(--nav-item); margin: 1px 8px; padding: 0 8px; border-radius: var(--r-md);
  font-weight: 500; font-size: var(--fs-md); color: var(--nav-fg); }
.nav a.item .ic { color: var(--nav-fg-2); }
.nav a.item:hover { background: var(--nav-hover); }
.nav a.item.on { background: var(--nav-active); color: #fff; }
.nav a.item.on .ic { color: #fff; }
.nav a.item .r { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--nav-fg-2); }
.nav .count { background: #2b333f; color: var(--nav-fg); }
.nav .count.nh { background: var(--nh); color: #fff; }
html[data-theme="dark"] .nav .count.nh { background: #e5484d; }
.nav .grow { flex: 1; }
.nav .me { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--nav-line); font-size: var(--fs-sm); }
.nav .av { width: 26px; height: 26px; border-radius: 50%; background: #2e3642; color: #e8ecf1; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; }
.nav .me b { display: block; font-weight: 500; color: #eef1f5; }
.nav .me span { color: var(--nav-fg-2); font-size: var(--fs-xs); }
.nav .proj-sw { width: 8px; height: 8px; border-radius: 2px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: var(--top); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 var(--gut); background: var(--bg-surface); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: var(--fs-md); }
.crumbs b { color: var(--fg); font-weight: 600; }
.crumbs .sep { color: var(--line-3); }
.top .sp { flex: 1; }
.livepill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg-subtle); font-size: var(--fs-sm); color: var(--fg-2); white-space: nowrap; }
.livepill .dot { background: var(--done); width: 7px; height: 7px; }
.livepill b { color: var(--fg); font-weight: 600; }
.livepill .vr { width: 1px; height: 14px; background: var(--line-2); }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.page { padding: 18px var(--gut) 28px; }

/* page head with computed summary */
.phead { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 14px; }
.phead h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.01em; line-height: 28px; white-space: nowrap; }
.summary { margin: 4px 0 0; font-size: var(--fs-lg); color: var(--fg-2); line-height: 1.5; max-width: 980px; }
.summary b { color: var(--fg); font-weight: 600; }
.summary .nh { color: var(--nh); font-weight: 600; }
.summary .wait { color: var(--wait); font-weight: 600; }
.summary a { border-bottom: 1px dotted var(--line-3); }
.summary a:hover { border-bottom-color: var(--fg-2); }
.phead .acts { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* cards */
.card { background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); }
html[data-density="compact"] .card-h { min-height: 34px; }
.card-h h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
.card-h .sub { color: var(--fg-3); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-h .sp { flex: 1; }
.card-b { padding: var(--pad); }

/* meters */
.meter { position: relative; height: 8px; border-radius: 999px; background: var(--bg-press); overflow: visible; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--fg-3); }
.meter > i.ok { background: var(--done); } .meter > i.wait { background: var(--wait); } .meter > i.nh { background: var(--nh); } .meter > i.run { background: var(--run); }
.meter > u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
.segbar { display: flex; gap: 2px; height: 8px; }
.segbar i { flex: 1; border-radius: 2px; background: var(--bg-press); }
.segbar i.run { background: var(--run); } .segbar i.dlv { background: var(--dlv); } .segbar i.nh { background: var(--nh); }
.segbar i.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }

/* status bar */
.statusbar { height: 28px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 var(--gut); border-top: 1px solid var(--line);
  background: var(--bg-surface); font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; overflow: hidden; }
.statusbar b { color: var(--fg); font-weight: 600; }
.statusbar .sp { flex: 1; }
.statusbar .ev { overflow: hidden; text-overflow: ellipsis; }
.statusbar .ev.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { background: var(--run-bg); } to { background: transparent; } }

/* ---------- Query line (composable filter) ---------- */
.qline { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px; border-radius: var(--r-md);
  border: 1px solid var(--line-2); background: var(--bg-surface); box-shadow: var(--shadow-1); min-width: 0; }
.qline:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.qline .ic { color: var(--fg-3); }
.qline .field { position: relative; flex: 1; min-width: 0; height: 100%; }
.qline input, .qline .hl { position: absolute; inset: 0; border: 0; outline: 0; padding: 0; margin: 0; background: transparent;
  font: 500 var(--fs-md)/34px var(--font-mono); letter-spacing: -.01em; white-space: pre; overflow: hidden; }
.qline input { color: transparent; caret-color: var(--fg); }
.qline input::placeholder { color: var(--fg-4); font-family: var(--font-sans); font-weight: 400; }
.qline .hl { pointer-events: none; color: var(--fg); }
.qline .hl .k { color: var(--fg-3); }
.qline .hl .v { color: var(--fg); font-weight: 600; }
.qline .hl .op { color: var(--fg-4); }
.qline .hl .p { color: var(--fg-3); }
.qline .hl .bad { text-decoration: wavy underline var(--wait); }
.qline .res { font-size: var(--fs-sm); color: var(--fg-3); white-space: nowrap; }
.qsug { position: absolute; left: -1px; right: -1px; top: 38px; z-index: 30; background: var(--bg-surface); border: 1px solid var(--line-2);
  border-radius: var(--r-lg); box-shadow: var(--shadow-2); padding: 6px; display: none; }
.qsug.open { display: block; }
.qsug .h { padding: 6px 8px 4px; font-size: var(--fs-xs); color: var(--fg-3); }
.qsug button { display: flex; width: 100%; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: var(--r-md); text-align: left; }
.qsug button.on, .qsug button:hover { background: var(--bg-hover); }
.qsug button .mono { font-weight: 600; }
.qsug button .d { color: var(--fg-3); font-size: var(--fs-sm); }
.qsug button .r { margin-left: auto; color: var(--fg-4); font-size: var(--fs-xs); }

/* ---------- Overlays: palette, drawer, modal, toast, tooltip ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: none; }
.scrim.open { display: block; }
.palette { position: fixed; left: 50%; top: 96px; width: 640px; transform: translateX(-50%); z-index: 70; background: var(--bg-surface);
  border: 1px solid var(--line-2); border-radius: var(--r-xl); box-shadow: var(--shadow-3); display: none; overflow: hidden; }
.palette.open { display: block; }
.palette .pin { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.palette .pin input { flex: 1; border: 0; outline: 0; background: transparent; font-size: var(--fs-lg); }
.palette .list { max-height: 420px; overflow: auto; padding: 6px; }
.palette .grp { padding: 8px 10px 4px; font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; }
.palette .opt { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-md); cursor: pointer; }
.palette .opt.on { background: var(--bg-hover); }
.palette .opt .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette .opt .m { color: var(--fg-3); font-size: var(--fs-sm); white-space: nowrap; }
.palette .foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--fg-3); background: var(--bg-subtle); }
.palette .foot span { display: inline-flex; align-items: center; gap: 4px; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; z-index: 50; background: var(--bg-surface); border-left: 1px solid var(--line-2);
  box-shadow: var(--shadow-3); transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.dr-top { display: flex; align-items: center; gap: 8px; height: var(--top); padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); flex: none; }
.dr-top .id { font-family: var(--font-mono); color: var(--fg-2); font-size: var(--fs-md); }
.dr-top .sp { flex: 1; }
.dr-body { flex: 1; overflow: auto; }
.dr-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.dr-head h3 { margin: 6px 0 6px; font-size: var(--fs-xl); font-weight: 600; line-height: 1.35; }
.dr-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-3); font-size: var(--fs-sm); }
.dr-acts { display: flex; gap: 8px; margin-top: 14px; }
.dr-tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-surface); z-index: 2; }
.tab { position: relative; height: 40px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-weight: 500; font-size: var(--fs-md); }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); }
.tab.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--fg); border-radius: 2px; }
.dr-sec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dr-sec h4 { margin: 0 0 10px; font-size: var(--fs-sm); font-weight: 600; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
.dr-sec h4 .r { margin-left: auto; font-weight: 400; color: var(--fg-3); }
.callout { border: 1px solid var(--nh-line); background: var(--nh-bg); border-radius: var(--r-lg); padding: 12px 14px; color: var(--fg); }
.callout b { color: var(--nh); }
.callout p { margin: 6px 0 0; color: var(--fg-2); font-size: var(--fs-sm); line-height: 1.5; }
.props { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: var(--fs-sm); }
.props dt { color: var(--fg-3); }
.props dd { margin: 0; color: var(--fg); min-width: 0; }

/* tracking-style stop timeline */
.track { list-style: none; margin: 0; padding: 0; position: relative; }
.track li { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 0 0 12px; min-height: 30px; }
.track li::before { content: ""; position: absolute; left: 10px; top: 18px; bottom: -2px; width: 2px; background: var(--line); }
.track li:last-child::before { display: none; }
.track li.past::before { background: var(--line-3); }
.track .pt { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-surface); border: 2px solid var(--line-2); z-index: 1; color: var(--fg-3); }
.track li.past .pt { background: var(--fg-3); border-color: var(--fg-3); color: var(--bg-surface); }
.track li.ret .pt { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.track li.cur .pt { background: var(--run-bg); border-color: var(--run); color: var(--run); }
.track li.cur.dlv .pt { background: var(--dlv-bg); border-color: var(--dlv); color: var(--dlv); }
.track li.halt .pt { background: var(--nh); border-color: var(--nh); color: #fff; }
.track li.next .pt { border-style: dashed; }
.track .w b { font-weight: 600; font-size: var(--fs-md); }
.track .w .s { color: var(--fg-3); font-size: var(--fs-sm); margin-top: 1px; }
.track li.ret .w .s { color: var(--wait); }
.track li.halt .w .s { color: var(--nh); }
.track li.next .w b { color: var(--fg-3); font-weight: 500; }
.track .c { text-align: right; font-size: var(--fs-sm); color: var(--fg-2); white-space: nowrap; }
.track .c .faint { display: block; font-size: var(--fs-xs); }
.track .group { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

.modal { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); width: 460px; z-index: 80; background: var(--bg-surface); border: 1px solid var(--line-2);
  border-radius: var(--r-xl); box-shadow: var(--shadow-3); display: none; }
.modal.open { display: block; }
.modal h3 { margin: 0; padding: 18px 20px 0; font-size: var(--fs-xl); font-weight: 600; }
.modal .mb { padding: 10px 20px 16px; color: var(--fg-2); font-size: var(--fs-md); line-height: 1.5; }
.modal .mb input { width: 100%; height: 34px; margin-top: 10px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--bg-surface); font-family: var(--font-mono); }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--bg-subtle); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.btn.destroy { background: var(--nh); color: #fff; border-color: var(--nh); }
.btn.destroy[disabled] { opacity: .45; cursor: not-allowed; }

.toasts { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--ink); color: var(--ink-fg); padding: 9px 14px; border-radius: var(--r-lg); box-shadow: var(--shadow-2); font-size: var(--fs-sm); display: flex; gap: 10px; align-items: center; max-width: 620px; }
.toast .mono { opacity: .85; }
.tip { position: fixed; z-index: 95; pointer-events: none; background: var(--bg-surface); color: var(--fg); border: 1px solid var(--line-2); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); padding: 10px 12px; font-size: var(--fs-sm); max-width: 320px; display: none; }
.tip.open { display: block; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--fg-3); margin-top: 3px; }
.tip .r span:last-child { color: var(--fg); }

.sheet-keys { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); width: 720px; z-index: 70; background: var(--bg-surface); border: 1px solid var(--line-2);
  border-radius: var(--r-xl); box-shadow: var(--shadow-3); display: none; padding: 8px 0 12px; }
.sheet-keys.open { display: block; }
.sheet-keys h3 { margin: 10px 20px 8px; font-size: var(--fs-lg); }
.sheet-keys .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; padding: 0 20px; }
.sheet-keys .k { display: flex; align-items: center; justify-content: space-between; height: 30px; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.sheet-keys .k span:last-child { display: flex; gap: 4px; }
.sheet-keys .gh { margin-top: 12px; font-size: var(--fs-xs); color: var(--fg-3); font-weight: 600; height: 22px; }
/* ---------- Toolbar: views + query ---------- */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.toolbar .qline { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-md); background: var(--bg-press); gap: 2px; flex: none; }
.seg button { height: calc(var(--ctl) - 4px); padding: 0 10px; border-radius: 5px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap; }
.seg button.on { background: var(--bg-surface); color: var(--fg); box-shadow: var(--shadow-1); }
.seg button .count { height: 16px; min-width: 16px; font-size: 10px; }
.seg button.on .count { background: var(--bg-press); }
.seg button .count.nh { background: var(--nh); color: #fff; }

/* ---------- Exceptions ---------- */
.exc-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.exc-h h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; color: var(--nh); display: flex; align-items: center; gap: 6px; }
.exc-h span { color: var(--fg-3); font-size: var(--fs-sm); }
.exc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.xcard { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 12px 14px 12px 18px; border-radius: var(--r-lg);
  background: var(--bg-surface); border: 1px solid var(--nh-line); box-shadow: var(--shadow-1); cursor: pointer; }
.xcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--nh); border-radius: var(--r-lg) 0 0 var(--r-lg); }
.xcard:hover { background: color-mix(in srgb, var(--nh-bg) 40%, var(--bg-surface)); }
.xcard.cursor { outline: 2px solid var(--focus); outline-offset: 1px; }
.xcard .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.xcard .l1 .mono { color: var(--fg-2); font-weight: 500; }
.xcard .l1 .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xcard .why { grid-column: 1; color: var(--nh); font-size: var(--fs-sm); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.xcard .meta { grid-column: 1; display: flex; gap: 14px; color: var(--fg-3); font-size: var(--fs-sm); white-space: nowrap; }
.xcard .meta b { color: var(--fg); font-weight: 600; }
.xcard .acts { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; align-items: stretch; justify-content: center; }
.xcard .acts .row { display: flex; gap: 6px; }
.xcard .stopped { color: var(--nh); font-weight: 600; }
html[data-density="compact"] .xcard { padding: 8px 12px 8px 16px; gap: 3px 12px; }
html[data-density="compact"] .xcard .why { display: none; }

/* ---------- Layout ---------- */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- Dispatch timeline ---------- */
.legend { display: flex; gap: 12px; align-items: center; font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.gantt { position: relative; user-select: none; }
.g-axis { display: grid; grid-template-columns: 172px 1fr; height: 28px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-surface); z-index: 3; }
.g-axis .lab { padding-left: var(--pad); display: flex; align-items: center; font-size: var(--fs-xs); color: var(--fg-3); }
.g-axis .ticks { position: relative; }
.g-axis .tk { position: absolute; top: 8px; font-size: var(--fs-xs); color: var(--fg-3); transform: translateX(-50%); white-space: nowrap; }
.g-axis .nowtag { position: absolute; top: 4px; transform: translateX(-50%); background: var(--ink); color: var(--ink-fg); border-radius: 4px; padding: 1px 6px; font-size: var(--fs-xs); font-weight: 600; z-index: 2; }
.g-grp { display: grid; grid-template-columns: 172px 1fr; height: 28px; align-items: center; background: var(--bg-subtle); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.g-grp .gl { padding-left: var(--pad); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.g-grp .gl b { font-weight: 600; }
.g-grp .gr { display: flex; align-items: center; gap: 10px; padding-left: 10px; color: var(--fg-3); font-size: var(--fs-xs); white-space: nowrap; position: relative; height: 100%; }
.g-lane { display: grid; grid-template-columns: 172px 1fr; height: var(--lane); border-bottom: 1px solid var(--line); position: relative; }
.g-lane:last-child { border-bottom: 0; }
.g-lane .ll { display: flex; align-items: center; gap: 7px; padding: 0 8px 0 var(--pad); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; border-right: 1px solid var(--line); }
.g-lane .ll .n { width: 12px; color: var(--fg-4); font-size: var(--fs-xs); text-align: right; flex: none; }
.g-lane .ll .mono { font-weight: 500; }
.g-lane .ll .nd { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; }
.g-lane.cursor .ll { box-shadow: inset 3px 0 0 var(--focus); background: var(--bg-hover); }
.g-lane.flash .ll { animation: flash 1.2s ease-out 1; }
.g-lane.dim .bars { opacity: .28; }
.g-lane .bars { position: relative; overflow: hidden; }
.g-future { position: absolute; top: 0; bottom: 0; background: var(--bg-subtle); pointer-events: none; }
.g-hos { position: absolute; top: 0; bottom: 0; pointer-events: none; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--wait) 14%, transparent) 0 4px, transparent 4px 9px);
  border-left: 1px dashed var(--wait); border-right: 1px dashed var(--wait); }
.g-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .7; pointer-events: none; }
.g-now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); z-index: 2; pointer-events: none; }
.bar { position: absolute; top: calc(50% - 8px); height: 16px; display: flex; white-space: nowrap; border-radius: 4px; overflow: hidden; cursor: pointer; }
html[data-density="compact"] .bar { top: calc(50% - 6px); height: 12px; }
.bar .s { position: absolute; top: 0; height: 100%; background: var(--seg); color: var(--seg-fg); font-size: 10.5px; line-height: 16px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: clip; border-right: 1px solid var(--bg-surface); flex: none; }
html[data-density="compact"] .bar .s { line-height: 12px; font-size: 9.5px; }
.bar .s:last-child { border-right: 0; }
.bar .s.b { box-shadow: inset 0 -2px 0 var(--wait); }
.bar .s.run { background: var(--run-bg); color: var(--run); box-shadow: inset 2px 0 0 var(--run); font-weight: 600; }
.bar .s.dlv { background: var(--dlv-bg); color: var(--dlv); box-shadow: inset 2px 0 0 var(--dlv); font-weight: 600; }
.bar .s.late { background: var(--wait-bg); color: var(--wait); box-shadow: inset 2px 0 0 var(--wait); font-weight: 600; }
.bar .s.halt { background: repeating-linear-gradient(135deg, var(--nh) 0 5px, color-mix(in srgb, var(--nh) 82%, #000) 5px 9px); color: #fff; font-weight: 600; }
.bar.done { background: var(--seg-done); border: 1px solid var(--line); color: var(--fg-3); font-size: 10.5px; line-height: 14px; padding: 0 6px; gap: 4px; align-items: center; }
html[data-density="compact"] .bar.done { line-height: 10px; font-size: 9.5px; }
.bar.done .ic { width: 10px; height: 10px; color: var(--done); }
.bar.rel { background: transparent; border: 1px dashed var(--line-2); color: var(--fg-4); font-size: 10px; line-height: 14px; padding: 0 4px; }
.bar.fc { background: transparent; border: 1.5px dashed var(--line-3); color: var(--fg-3); font-size: 10.5px; line-height: 13px; padding: 0 6px; align-items: center; border-radius: 4px; }
.bar.fc.nh { border-color: var(--nh); color: var(--nh); font-weight: 600; }
.bar.next { background: transparent; border: 1.5px dashed var(--line-2); color: var(--fg-4); font-size: 10.5px; line-height: 13px; padding: 0 6px; align-items: center; }
.bar.hl, .lane-hl .bar.mine { box-shadow: 0 0 0 2px var(--focus); }
.g-lane .arcs { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.g-lane .arcs path { fill: none; stroke: var(--wait); stroke-width: 1.4; }
.g-idle { position: absolute; top: calc(50% - 7px); height: 14px; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--hatch) 0 4px, transparent 4px 8px); border: 1px dashed var(--line-2); color: var(--fg-3); font-size: 10.5px; line-height: 12px; padding: 0 8px; white-space: nowrap; }
.zoom { display: inline-flex; gap: 2px; }

/* ---------- Rail ---------- */
.big { font-size: var(--fs-3xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.big small { font-size: var(--fs-md); font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
.kv { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 6px 10px; font-size: var(--fs-sm); }
.kv .k { color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.kv .v { text-align: right; color: var(--fg-3); white-space: nowrap; }
.kv .v b { color: var(--fg); font-weight: 600; }
.hos { display: flex; flex-direction: column; gap: 14px; }
.hos .w1 { display: flex; justify-content: space-between; font-size: var(--fs-sm); margin-bottom: 6px; }
.hos .w1 b { font-weight: 600; }
.hos .w2 { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--fg-3); margin-top: 6px; }
.hos .w2 .warn { color: var(--wait); font-weight: 500; }
.note { font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.5; margin: 12px 0 0; }
.spark { display: block; width: 100%; }
.sp-delta { font-size: var(--fs-sm); color: var(--fg-3); margin-top: 4px; }
.sp-delta b { color: var(--done); font-weight: 600; }
.toplist { margin-top: 10px; border-top: 1px solid var(--line); }
.toplist .r { display: flex; align-items: center; gap: 8px; height: 30px; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); cursor: pointer; }
.toplist .r:last-child { border-bottom: 0; }
.toplist .r .tt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-2); }
.linkbtn { color: var(--fg-2); font-weight: 500; font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 4px; }
.linkbtn:hover { color: var(--fg); }

/* ---------- Loading dock & chains ---------- */
.dock { display: grid; grid-template-columns: 330px 1fr; }
.dock .nextout { border-right: 1px solid var(--line); }
.dock .sh { display: flex; align-items: baseline; gap: 8px; padding: 12px var(--pad) 8px; font-size: var(--fs-sm); }
.dock .sh b { font-weight: 600; }
.dock .sh span { color: var(--fg-3); }
.nq { list-style: none; margin: 0; padding: 0 0 8px; }
.nq li { display: grid; grid-template-columns: 18px 52px 1fr auto; align-items: center; gap: 8px; height: 28px; padding: 0 var(--pad); font-size: var(--fs-sm); cursor: pointer; }
.nq li:hover { background: var(--bg-hover); }
.nq li .i { color: var(--fg-4); font-size: var(--fs-xs); text-align: right; }
.nq li .tt { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-2); }
.nq li .eta { color: var(--fg-3); font-size: var(--fs-xs); white-space: nowrap; }
.chains { position: relative; padding: 0 var(--pad) 12px; overflow-x: auto; }
.chains svg.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.chains svg.links path { fill: none; stroke: var(--line-3); stroke-width: 1.3; }
.chains svg.links path.nh { stroke: var(--nh); stroke-dasharray: 3 3; }
.chains .pillnode { position: absolute; height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--bg-surface); font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--fg); white-space: nowrap; cursor: pointer; }
.chains .pillnode:hover { border-color: var(--fg-3); }
.chains .pillnode.root-nh { border-color: var(--nh); background: var(--nh-bg); color: var(--nh); }
.chains .pillnode.root-run { border-color: var(--run-line); background: var(--run-bg); }
.chains .pillnode.root-dlv { border-color: var(--dlv-line); background: var(--dlv-bg); }
.chains .pillnode.root-unk { border-style: dashed; color: var(--fg-3); font-family: var(--font-sans); }
.chains .pillnode.hl { box-shadow: 0 0 0 2px var(--focus); }
.chains .epiclab { position: absolute; font-size: var(--fs-2xs); color: var(--fg-4); font-weight: 600; letter-spacing: .02em; }
.chains .more { margin-top: 6px; font-size: var(--fs-xs); color: var(--fg-3); }

/* ---------- Shipments table ---------- */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-body); }
.tbl th { position: sticky; top: 0; z-index: 1; height: 34px; padding: 0 10px; text-align: left; font-size: var(--fs-xs); font-weight: 500; color: var(--fg-3); background: var(--bg-subtle); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td { height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--bg-hover); }
.tbl tr.row.cursor td { background: var(--bg-hover); }
.tbl tr.row.cursor td:first-child { box-shadow: inset 3px 0 0 var(--focus); }
.tbl tr.row.flash td { animation: flash 1.2s ease-out 1; }
.tbl tr.grp td { height: 34px; background: var(--bg-subtle); font-size: var(--fs-sm); font-weight: 600; }
.tbl tr.grp td .muted { font-weight: 400; margin-left: 8px; }
.tbl tr.grp.nh td { background: var(--nh-bg); color: var(--nh); }
.tbl tr.nhrow td { background: color-mix(in srgb, var(--nh-bg) 45%, var(--bg-surface)); }
.tbl tr.nhrow td:first-child { box-shadow: inset 3px 0 0 var(--nh); }
.tbl .tcell { max-width: 520px; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.tbl .tcell .tt { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tbl .reason { color: var(--nh); font-size: var(--fs-sm); margin-top: 2px; }
.tbl td.two { padding-top: 6px; padding-bottom: 6px; }
.stops { display: inline-flex; align-items: center; gap: 3px; }
.stops i { width: 14px; height: 4px; border-radius: 2px; background: var(--bg-press); }
.stops i.past { background: var(--fg-4); }
.stops i.run { background: var(--run); } .stops i.dlv { background: var(--dlv); } .stops i.nh { background: var(--nh); }
.stops .bn { margin-left: 6px; font-size: var(--fs-xs); color: var(--wait); display: inline-flex; gap: 2px; align-items: center; }
.showmore { color: var(--fg-2); font-weight: 500; font-size: var(--fs-sm); }

/* ---------- Drawer extras ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg-surface); font-size: var(--fs-sm); margin: 0 4px 4px 0; }
button.chip:hover { border-color: var(--fg-3); }
.chain .ch-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: var(--fs-sm); margin-bottom: 6px; }
.chain .lbl { width: 72px; color: var(--fg-3); flex: none; }
.chain .ch-tree { margin: 6px 0 0 76px; border-left: 1px solid var(--line-2); }
.chain .tr { display: flex; align-items: center; gap: 8px; padding-left: calc(12px + var(--d) * 18px); position: relative; height: 28px; font-size: var(--fs-sm); }
.chain .tr::before { content: ""; position: absolute; left: calc(var(--d) * 18px); top: 50%; width: 10px; border-top: 1px solid var(--line-2); }
.chain .tr .chip { margin: 0; }
.chain .tr .tt { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ledger { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.ledger th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: var(--fs-xs); padding: 0 6px 6px; border-bottom: 1px solid var(--line); }
.ledger td { padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ledger .r { text-align: right; }
.ledger tr.ret td:first-child { color: var(--wait); }
.ledger tr.halt td:first-child { color: var(--nh); font-weight: 600; }
.ledger td.bar { width: 90px; position: static; display: table-cell; height: auto; }
.ledger td.bar i { display: block; height: 6px; border-radius: 3px; background: var(--fg-3); min-width: 1px; }
.ledger tr.ret td.bar i { background: var(--wait); }
.ledger tfoot td { border-bottom: 0; padding-top: 8px; }
.wi { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-sm); padding: 4px 0; }
.wi .mono { flex: none; }
.dr-eta { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.dr-eta > div { padding: 10px 20px; border-right: 1px solid var(--line); }
.dr-eta > div:last-child { border-right: 0; }
.dr-eta .l { font-size: var(--fs-xs); color: var(--fg-3); }
.dr-eta .v { font-size: var(--fs-lg); font-weight: 600; margin-top: 2px; }
.dr-eta .v.nh { color: var(--nh); }
.hos .w2 span { white-space: nowrap; }
.fc-lab { position: absolute; top: calc(50% - 8px); line-height: 16px; font-size: 10.5px; color: var(--fg-3); white-space: nowrap; pointer-events: none; }
/* ---------- Fleet ---------- */
.ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; }
.ptabs .tab { height: 38px; }
.ptabs .tab .count { margin-left: 2px; }
.vehicles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.veh { display: flex; flex-direction: column; cursor: default; }
.veh.cursor { outline: 2px solid var(--focus); outline-offset: 1px; }
.veh .card-h { gap: 10px; }
.veh .card-h .mono { color: var(--fg-3); font-size: var(--fs-sm); }
.veh .vb { display: grid; grid-template-columns: 1fr 1fr; }
.veh .vb > div { padding: 14px var(--pad); }
.veh .vb > div:first-child { border-right: 1px solid var(--line); }
.veh .lbl { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; }

const NODE_AFTER = { triage: 'build', build: 'review', verify: 'mutation', review: 'pre-push', mutation: 'review', 'pre-push': 'deliver', deliver: 'delivered' };

// Collapses a chunk's visits into tracking stops; a run of same-node returns becomes one row.
function stopsOf(c) {
  const vs = (VISITS[c.id] || []).filter(v => !v.released);
  const out = [];
  vs.forEach((v, i) => {
    const next = vs[i + 1];
    const prev = out.at(-1);
    if (v.bounce && prev && prev.kind === 'ret' && prev.node === v.node && prev.back === (next?.node === v.node ? v.node : next?.node)) {
      prev.n++; prev.to = v.to; prev.cost += v.cost || 0; return;
    }
    const kind = v.halt ? 'halt' : v.live ? 'cur' : v.bounce ? 'ret' : 'past';
    out.push({ kind, node: v.node, from: v.from, to: v.to, cost: v.cost || 0, est: v.est, tok: v.tok, note: v.note, n: 1, back: next?.node, done: v.done });
  });
  return out;
}
function upcomingOf(c) {
  if (c.status === 'done' || c.status === 'needs_human') return [];
  const out = [];
  let node = c.status === 'ready' || c.status === 'backlog' ? null : c.node;
  let at = node ? Math.max(now(), t(c.since || '13:00') + (MEDIAN_DWELL[node] || 8)) : null;
  const seq = node ? [] : PIPELINE.slice();
  if (node) { let n = NODE_AFTER[node]; let guard = 0; while (n && n !== 'delivered' && guard++ < 6) { seq.push(n); n = NODE_AFTER[n]; if (n === 'review' && seq.includes('review')) n = 'pre-push'; } }
  const eta = etaOf(c);
  seq.forEach((n, i) => {
    if (at !== null) { out.push({ node: n, at: eta ? Math.min(at, eta - (seq.length - i) * 3) : at }); at += MEDIAN_DWELL[n] || 8; }
    else out.push({ node: n, at: null });
  });
  out.push({ node: 'delivered', at: eta, final: true });
  return out;
}
function trackHTML(c) {

}

    <div class="sh-h"><div class="l1"><span class="pill ${STATUS[c.status].role}">${glyph(c.status, 12)} ${STATUS[c.status].label}</span><span class="mono">${c.id}</span><span class="mono faint">${c.refs[0].ref}</span><span class="sp"></span><button class="btn ghost sm icon" data-x aria-label="Close">${icon('x', 'sm')}</button></div>
      <h3>${esc(title(c))}</h3></div>
    <div class="sh-b"><div class="dr-eta"><div><div class="l">Stop</div><div class="v">${c.status === 'done' ? 'delivered' : c.node}</div></div><div><div class="l">${nh ? 'Stopped' : 'At stop'}</div><div class="v ${nh ? 'nh' : ''}">${c.since ? `<span data-since="${c.since}">${dur(now() - t(c.since))}</span>` : '—'}</div></div><div><div class="l">ETA</div><div class="v">${nh ? '—' : c.eta ? '~' + c.eta : '—'}</div></div><div><div class="l">Cost</div><div class="v num">${c.cost || '—'}</div></div></div>
      <div class="dr-tabs">${[['track', 'Tracking'], ['cost', 'Cost'], ['details', 'Details']].map(([k, l]) => `<button class="tab ${SHEET_TAB === k ? 'on' : ''}" data-stab="${k}">${l}</button>`).join('')}</div>
      <div data-sbody></div></div>
    ${c.status === 'done' || c.status === 'ready' ? '' : `<div class="sh-f">${nh ? `<button class="btn ink" data-act="take">${icon('terminal', 'sm')} Take over</button>` : `<button class="btn" data-act="pr">${icon('pr', 'sm')} PR ${c.pr || ''}</button>`}<button class="btn" data-act="requeue">${icon('requeue', 'sm')} Requeue</button><button class="btn icon" aria-label="More" data-act="more">${icon('more', 'sm')}</button></div>`}</div>`);
  document.body.append(scrim, el);
  const body = () => { $('[data-sbody]', el).innerHTML = SHEET_TAB === 'track'
    ? `${nh ? `<div class="dr-sec"><div class="callout"><b>${icon('alert', 'xs')} ${c.reasonKind}: ${esc(c.reasonShort)}</b><p>${esc(c.reason)}</p></div></div>` : ''}<div class="dr-sec"><h4>Stops <span class="r">${bouncesOf(c)} bounces</span></h4>${trackHTML(c)}</div><div class="dr-sec"><h4>Blocking chain</h4>${chainHTML(c)}</div>`
    : SHEET_TAB === 'cost' ? `<div class="dr-sec">${ledgerHTML(c)}</div>` : `<div class="dr-sec">${propsHTML(c)}</div><div class="dr-sec">${itemsHTML(c)}</div>`;
    $$('[data-stab]', el).forEach(b => b.classList.toggle('on', b.dataset.stab === SHEET_TAB)); };
  body();
  const close = () => { el.remove(); scrim.remove(); };
  scrim.onclick = () => popLayer(); $('[data-x]', el).onclick = () => popLayer();
  el.addEventListener('click', e => {
    const st = e.target.closest('[data-stab]'); if (st) { SHEET_TAB = st.dataset.stab; body(); return; }
    const op = e.target.closest('[data-open]'); if (op) { e.preventDefault(); chunkSheet(op.dataset.open); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'take') takeOver(c.id); else if (a.dataset.act === 'pr') openPR(c.id);
    else if (a.dataset.act === 'requeue') actionSheet({ msg: `<b>Requeue ${c.id}?</b>It goes back to ${c.node} and the hub may claim it on the next tick.`, buttons: [{ label: 'Requeue', run: () => toast(`Requeued ${c.id}`) }] });
    else actionSheet({ msg: `<b>${c.id}</b>${esc(title(c))}`, buttons: [{ label: 'Copy id', run: () => toast(`Copied ${c.id}`) }, { label: 'Open on desktop', run: () => go(`board-desktop.html?drawer=${c.id}`) }, { label: 'Cancel chunk…', danger: true, run: () => toast('Cancel asks you to type the id') }] });
  });
  LAYERS.push({ el, close });
}
window.openChunk = chunkSheet;
function mTick(extra) {
  const tick = () => {
    const n = now();
    $$('[data-clock]').forEach(e => e.textContent = hhmm(n));
    $$('[data-since]').forEach(e => e.textContent = dur(n - t(e.dataset.since)));
    $$('[data-ago]').forEach(e => { const s = +e.dataset.ago + Math.floor((n - NOW0) * 60); e.textContent = s < 60 ? s + 's ago' : Math.floor(s / 60) + 'm ago'; });
    $$('[data-spend]').forEach(e => e.textContent = '~$' + (KPI.spendToday + (n - NOW0) * 0.21).toFixed(2));
    extra?.(n);
  };
  tick(); if (!FROZEN) setInterval(tick, 1000);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') popLayer(); });
}

// ---------- Board (mobile): "does the fleet need me?" ----------
const MODE = P.get('tabbar') === 'exceptions' ? 'exceptions' : 'dispatch';

function xCardHTML(c) {
  return `<div class="m-card m-x" data-open="${c.id}">
    <div class="l1"><span class="mono">${c.id}</span>${c.refs[0].epic ? `<span class="epic">${c.refs[0].epic}</span>` : ''}<span style="margin-left:auto;color:var(--nh);font-weight:600">Stopped <span data-since="${c.since}">${dur(now() - t(c.since))}</span></span></div>
    <div class="tt">${esc(title(c))}</div>
    <div class="why">${esc(c.reasonShort)}</div>
    <div class="meta"><span>at <b>${c.node}</b> · ${c.runner}</span><span>holds <b>${c.holds}</b></span><span class="num">${c.cost}</span></div>
    <div class="acts"><button class="btn ink" data-act="take" data-id="${c.id}">${icon('terminal', 'sm')} Take over</button><button class="btn" data-act="requeue" data-id="${c.id}">${icon('requeue', 'sm')} Requeue</button><button class="btn icon" data-act="pr" data-id="${c.id}" aria-label="Open PR ${c.pr}">${icon('pr', 'sm')}</button></div></div>`;
}
function rowHTML(c) {
  const idx = PIPELINE.indexOf(c.node === 'verify' ? 'build' : c.node), role = STATUS[c.status].role;
  return `<div class="m-row" data-open="${c.id}">${glyph(c.status)}<div class="t1"><span class="mono">${c.id}</span><span class="tt">${esc(title(c))}</span></div>
    <div class="rt"><span class="num">${c.cost}</span><span class="eta">${c.eta ? '~' + c.eta : ''}</span></div>
    <div class="t2"><span class="stops">${PIPELINE.map((p, i) => `<i class="${i < idx ? 'past' : i === idx ? role : ''}"></i>`).join('')}</span><span>${c.node}${c.late ? ' · <span style="color:var(--wait)">late</span>' : ''} · ${c.runner}</span>${bouncesOf(c) ? `<span style="color:var(--wait)">${icon('return', 'xs')} ${bouncesOf(c)}</span>` : ''}</div></div>`;
}
function dispatchBody() {
  const ex = exceptions(), mv = moving().sort((a, b) => etaOf(a) - etaOf(b));
  const segs = SLOTS.map(s => INFLIGHT.find(c => c.slot === s.id)).map(c => `<i class="${c ? STATUS[c.status].role : 'free'}"></i>`).join('');
  const un = CHUNKS.filter(c => c.status === 'ready' && !isBlocked(c));
  return `<div class="m-head"><h1>Dispatch</h1><p class="summary"><span class="nh">${ex.length} stopped shipments need you.</span> ${mv.length} moving on 10 of 14 slots; <span class="wait">r-chatgpt off new loads until 14:41</span>. Next delivery ~13:16. <b data-spend>~$114.44</b> today.</p></div>
    <section class="m-sec"><div class="h nh">${glyph('needs_human')} Exceptions · ${ex.length}<span class="r">by what they hold</span></div>${ex.map(xCardHTML).join('')}</section>
    <section class="m-sec"><div class="h">Moving · ${mv.length}<span class="r">soonest ETA first</span></div><div class="m-card m-list">${mv.map(rowHTML).join('')}</div></section>
    <section class="m-sec"><div class="h">Capacity</div><div class="m-card m-cap"><span><b>10 / 14</b> slots loaded</span><span class="muted">winter 0/4 idle</span><div class="segbar">${segs}</div><span class="w">${icon('clock', 'xs')} r-chatgpt declining until 14:41</span><a class="linkbtn" href="fleet-mobile.html">Fleet ${icon('right', 'xs')}</a></div></section>
    <section class="m-sec"><div class="h">At the dock · 53<span class="r">${un.length} can load now</span></div><div class="m-card m-list">
      ${un.slice(0, 3).map(c => `<div class="m-row" data-open="${c.id}">${glyph(c.status)}<div class="t1"><span class="mono">${c.id}</span><span class="tt">${esc(title(c))}</span></div><div class="rt muted">${c.node}</div></div>`).join('')}
      <a class="m-more" href="#dock">Show all 53 · 41 held behind blockers ${icon('right', 'xs')}</a></div></section>`;
}
function exceptionsBody() {
  const ex = exceptions();
  return `<div class="m-head"><h1>Exceptions</h1><p class="summary"><span class="nh">${ex.length} stopped shipments need you.</span> Nothing else is waiting: no open asks, no open gates.</p></div>
    <section class="m-sec"><div class="h nh">Stopped · ${ex.length}</div>${ex.map(xCardHTML).join('')}</section>
    <section class="m-sec"><div class="h">Agent asks · 0</div><div class="m-card m-empty">No agent is waiting on an answer.</div></section>
    <section class="m-sec"><div class="h">Gates · 0</div><div class="m-card m-empty">No gate is waiting on a decision.</div></section>
    <section class="m-sec"><div class="h">Watching</div><div class="m-card m-list">${CHUNKS.filter(c => c.late).map(rowHTML).join('')}</div><p class="note" style="margin:6px 2px 0">Late loads are not exceptions yet: C-2475 has sat at build for 3× the median.</p></section>`;
}
function render() {
  mShell(MODE, MODE === 'exceptions' ? exceptionsBody() : dispatchBody());
  $('#mscroll').addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) { e.stopPropagation(); const id = a.dataset.id;
      if (a.dataset.act === 'take') takeOver(id); else if (a.dataset.act === 'pr') openPR(id);
      else actionSheet({ msg: `<b>Requeue ${id}?</b>It goes back to ${BY_ID[id].node} and the hub may claim it on the next tick.`, buttons: [{ label: 'Requeue', run: () => toast(`Requeued ${id}`) }] });
      return; }
    const o = e.target.closest('[data-open]'); if (o) { chunkSheet(o.dataset.open); return; }
    if (e.target.closest('a[href="#dock"]')) { e.preventDefault(); toast('The dock list: unblocked first, held behind a toggle'); }
  });
}
window.onPrefs = render;
render();
mTick();
if (P.get('sheet')) chunkSheet(P.get('sheet'));
if (P.get('more')) moreSheet();


</script></body></html>
