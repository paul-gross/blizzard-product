/* Blizzard — editorial instrument. Shared tokens and type system. */
:root{
  --paper:#f3f2ec; --paper-2:#e9e7df; --paper-3:#dedbd1;
  --ink:#141412; --ink-2:#3c3b37; --ink-3:#6f6d66; --ink-4:#a3a097; --ink-5:#c9c6bc;
  --hair:rgba(20,20,18,.14); --hair-2:rgba(20,20,18,.28);
  --human:#c62a1a; --human-wash:rgba(198,42,26,.07);
  --pace:#9b5f00;
  --serif:"Bz Serif","Noto Serif","STIX Two Text",Georgia,serif;
  --sans:"Bz Sans","Noto Sans","Liberation Sans Narrow","Arial Narrow",sans-serif;
  --mono:"Bz Mono","Noto Sans Mono","Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme=night]{
  --paper:#0f0f0e; --paper-2:#1b1a18; --paper-3:#262521;
  --ink:#ece9e0; --ink-2:#c4c1b7; --ink-3:#8e8b81; --ink-4:#5f5d56; --ink-5:#3d3c37;
  --hair:rgba(236,233,224,.13); --hair-2:rgba(236,233,224,.26);
  --human:#ff5d47; --human-wash:rgba(255,93,71,.09);
  --pace:#e2a540;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);font-size:14px;line-height:18px;font-variant-numeric:lining-nums tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- type roles ---------- */
.sans{font-family:var(--sans)}
.mono,.id{font-family:var(--mono);font-stretch:75%;font-weight:500;letter-spacing:0}
.id{font-size:.86em}
.it{font-style:italic}
.human{color:var(--human)}
.pace{color:var(--pace)}
.dim{color:var(--ink-3)}
.faint{color:var(--ink-4)}
u.acc{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}

/* section flag: a heavy rule, a serif head, a light count */
.flag{display:flex;align-items:baseline;gap:8px;border-top:2px solid var(--ink);padding-top:5px;height:30px;margin-bottom:6px}
.flag h2{font:600 15px/18px var(--serif);font-stretch:87.5%;letter-spacing:-.005em}
.flag .count{font:300 15px/18px var(--serif);color:var(--ink-3)}
.flag .aside{margin-left:auto;font:400 12px/18px var(--sans);font-stretch:87.5%;color:var(--ink-3)}
.flag.human{border-top-color:var(--human)}
.flag.human h2{color:var(--human)}

kbd{font:500 10.5px/14px var(--mono);font-stretch:75%;display:inline-block;min-width:15px;padding:0 3px;
  border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:2px;text-align:center;color:var(--ink-2);vertical-align:1px}

/* focus: a margin bar in the gutter and a faint paper tint — never a glow */
[data-nav]{position:relative;outline:none;cursor:pointer}
[data-nav]:hover{background:var(--paper-2)}
[data-nav]:focus-visible,[data-nav].focus{background:var(--paper-2)}
[data-nav]:focus-visible::before,[data-nav].focus::before{content:"";position:absolute;left:-12px;top:0;bottom:0;width:3px;background:var(--ink)}
[data-nav].human-item:focus-visible::before,[data-nav].human-item.focus::before{background:var(--human)}

/* ticking digits briefly thicken when they move */
.tick{transition:font-weight .5s ease}
.tick.bump{font-weight:800;transition:none}

/* ---------- instrument meter: hairline scale, spent bar, elapsed caret ---------- */
.meter{position:relative;height:14px}
.meter .scale{position:absolute;left:0;right:0;top:4px;height:7px;border-left:1px solid var(--ink-4);
  background:linear-gradient(var(--ink-4),var(--ink-4)) 0 6px/100% 1px no-repeat,
             repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--ink-4) calc(10% - 1px) 10%) 0 3px/100% 4px no-repeat}
.meter .spent{position:absolute;left:0;top:5px;height:5px;background:var(--ink)}
.meter .elapsed{position:absolute;top:1px;width:1px;height:13px;background:var(--ink)}
.meter .elapsed::after{content:"";position:absolute;left:-3px;top:-2px;border:3.5px solid transparent;border-top:4px solid var(--ink)}
.meter.pace .spent{background:var(--pace)}

/* ---------- overlays: reader, palette, help, toast ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 60%,transparent);display:none;z-index:40}
.scrim.on{display:block}
.reader{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:var(--paper);border-left:1px solid var(--ink);
  transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:50;overflow:auto;padding:28px 36px 40px}
.reader.on{transform:none}
.reader .close{position:absolute;right:20px;top:18px;font:400 12px/18px var(--sans);color:var(--ink-3)}
.reader .kicker{font:600 12px/18px var(--sans);font-stretch:87.5%}
.reader h1{font:800 34px/36px var(--serif);font-stretch:75%;letter-spacing:-.012em;margin:6px 0 12px}
.reader .deck{font:400 16px/24px var(--serif);color:var(--ink-2);margin-bottom:18px}
.reader .facts{font:400 13px/18px var(--serif);color:var(--ink-2);column-count:2;column-gap:28px;margin-bottom:18px}
.reader .facts p{break-inside:avoid;margin-bottom:6px}
.reader .facts b{font-weight:600;color:var(--ink)}
.reader table{width:100%;border-collapse:collapse;font:400 12.5px/18px var(--sans);font-stretch:87.5%}
.reader th{text-align:left;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--ink);padding:0 8px 4px 0}
.reader td{border-bottom:1px solid var(--hair);padding:5px 8px 5px 0;vertical-align:top}
.reader td.r,.reader th.r{text-align:right}
.reader tr.bounce td{font-style:italic;color:var(--ink-3)}
.reader tr.now td{font-weight:700}
.reader .cmd{font:500 13px/18px var(--mono);font-stretch:87.5%;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:9px 0;margin:6px 0 18px;display:flex;gap:12px}
.reader .cmd span{flex:1}
.reader .cmd button{font:500 13px/18px var(--serif);color:var(--human)}
.reader h3{font:600 13px/18px var(--serif);font-stretch:87.5%;border-top:2px solid var(--ink);padding-top:5px;margin:18px 0 6px}

.palette{position:fixed;left:50%;top:96px;width:720px;max-width:calc(100vw - 24px);transform:translateX(-50%);background:var(--paper);
  border:1px solid var(--ink);z-index:60;display:none}
.palette.on{display:block}
.palette input{width:100%;font:400 24px/36px var(--serif);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:12px 18px;color:var(--ink);outline:none}
.palette input::placeholder{color:var(--ink-4);font-style:italic}
.palette ol{list-style:none;max-height:420px;overflow:auto;padding:6px 0}
.palette li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:5px 18px;font:400 14px/18px var(--serif);cursor:pointer}
.palette li .k{font:500 11px/18px var(--mono);font-stretch:75%;color:var(--ink-3)}
.palette li .x{font:400 11px/18px var(--sans);font-stretch:87.5%;color:var(--ink-3)}
.palette li.sel{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--ink)}
.palette li mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}

.help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:660px;max-width:calc(100vw - 24px);background:var(--paper);border:1px solid var(--ink);padding:22px 28px 26px;z-index:60;display:none}
.help.on{display:block}
.help h2{font:800 26px/30px var(--serif);font-stretch:75%;margin-bottom:12px}
.help dl{display:grid;grid-template-columns:96px 1fr 96px 1fr;gap:6px 14px;font:400 13px/18px var(--serif)}
.help dt{text-align:right}
.help p{font:italic 400 13px/18px var(--serif);color:var(--ink-3);margin-top:14px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  font:500 13px/18px var(--mono);font-stretch:87.5%;padding:9px 16px;z-index:70;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* desktop masthead and page frame */
.page{padding:0 36px 24px;max-width:1600px;margin:0 auto}
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;column-gap:36px;padding-top:10px;height:46px}
.nameplate{font:900 32px/36px var(--serif);font-stretch:62.5%;letter-spacing:-.02em}
.sections{display:flex;gap:22px;font:400 15px/18px var(--serif)}
.sections a{color:var(--ink-3)}
.sections a:hover{color:var(--ink)}
.sections a.on{color:var(--ink);font-weight:700;font-stretch:87.5%;box-shadow:0 6px 0 -4px var(--ink)}
.dateline{font:400 12px/18px var(--sans);font-stretch:87.5%;color:var(--ink-3)}
.dateline b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dateline .sep{color:var(--ink-5);margin:0 3px}
.mast-rule{height:5px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.sub{display:flex;justify-content:space-between;align-items:baseline;height:26px;padding-top:4px;border-bottom:1px solid var(--hair);font:400 12px/18px var(--sans);font-stretch:87.5%;color:var(--ink-3)}
.sub .lens a{margin-left:10px;color:var(--ink-3);cursor:pointer}
.sub .lens a.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sub .tools{display:flex;gap:18px}
.sub .tools button{color:var(--ink-3)}
.sub .tools button:hover{color:var(--ink)}
.sections .lens{margin-left:18px;padding-left:18px;border-left:1px solid var(--hair-2);display:flex;gap:14px;font:400 12px/18px var(--sans);font-stretch:87.5%;align-self:center}
.sections .lens a{color:var(--ink-3);cursor:pointer}
.sections .lens a.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.dateline .tools{display:inline-flex;gap:12px;margin-left:16px}
.dateline .tools button{color:var(--ink-3);font:inherit}
.dateline .tools button:hover{color:var(--ink)}


/* ---------- the status report ---------- */
.verdict{display:grid;grid-template-columns:1fr 300px;column-gap:40px;padding:14px 0 14px;border-bottom:1px solid var(--ink)}
.verdict h1{font:800 50px/54px var(--serif);font-stretch:75%;letter-spacing:-.02em}
.verdict h1 .human{color:var(--human)}
.verdict h1 .pace{color:var(--pace)}
.verdict p{font:400 18px/24px var(--serif);color:var(--ink-2);margin-top:6px;max-width:1080px;text-wrap:pretty}
.verdict .ledger{align-self:end;text-align:right;font:400 12px/18px var(--sans);font-stretch:87.5%;color:var(--ink-3)}
.verdict .ledger strong{display:block;font:300 34px/36px var(--serif);font-stretch:87.5%;letter-spacing:-.02em;color:var(--ink)}
.verdict .ledger .lbl{font:italic 400 14px/18px var(--serif);color:var(--ink-3);letter-spacing:0}

/* the instrument: three windows on one shared scale */
.gauges{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:0;padding:12px 0 14px;border-bottom:1px solid var(--hair)}
.gauge{padding:0 28px}
.gauge:first-child{padding-left:0}
.gauge:last-child{padding-right:0}
.gauge + .gauge{border-left:1px solid var(--hair)}
.gauge .hd{display:flex;align-items:baseline;gap:8px}
.gauge .hd b{font:600 15px/18px var(--serif);font-stretch:87.5%}
.gauge .hd i{font:italic 400 15px/18px var(--serif);color:var(--ink-3)}
.gauge .hd .smp{margin-left:auto;font:400 11.5px/18px var(--sans);font-stretch:87.5%;color:var(--ink-4)}
.gauge .read{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px}
.gauge .read .pc{font:200 54px/60px var(--serif);font-stretch:87.5%;letter-spacing:-.03em}
.gauge .read .pc small{font-size:24px;font-weight:300;letter-spacing:0}
.gauge .read .vd{font:400 13px/18px var(--serif);color:var(--ink-2)}
.gauge .read .vd b{font-weight:700}
.gauge.pace .read .pc,.gauge.pace .read .vd b{color:var(--pace)}
.gauge .meter{height:18px}
.gauge .meter .scale{display:none}
.gauge .meter .base{position:absolute;left:0;right:0;top:11px;height:1px;background:var(--ink-3)}
.gauge .meter .tk{position:absolute;top:7px;width:1px;height:4px;background:var(--ink-4)}
.gauge .meter .tk.big{top:4px;height:7px;background:var(--ink-3)}
.gauge .meter .spent{top:6px;height:5px}
.gauge .meter .elapsed{top:0;height:18px}
.gauge .ticks{display:flex;justify-content:space-between;font:400 10.5px/12px var(--sans);font-stretch:75%;color:var(--ink-4);margin-top:2px}

/* body: runners as two columns of story, the host and its record in the rail */
.body{display:grid;grid-template-columns:1fr 1fr 400px;column-gap:40px;padding-top:12px}
.runner .name{display:flex;align-items:baseline;gap:10px}
.runner h2{font:800 34px/36px var(--serif);font-stretch:75%;letter-spacing:-.015em}
.runner .state{font:600 12px/18px var(--sans);font-stretch:87.5%}
.runner .state.pace{color:var(--pace)}

/* ---------- reader: the chunk, opened in place ---------- */
function openReader(id) {
  const c = chunkById(id); if (!c) return;

  const hist = HISTORY[c.id];
  const facts = [];

    const ds = downstream(c.id);

    facts.push(`<p><b>Usage</b> ${usd(c.cost)} · input ${c.usage.input} · output ${c.usage.output} · cache read ${c.usage.cread} · cache creation ${c.usage.ccreate}</p>`);

    facts.push(`<p><b>Cost so far</b> <span data-cost="${c.id}">${usd(c.cost, c.est)}</span>${c.bounces ? ` · ${c.bounces} bounce${c.bounces > 1 ? 's' : ''}` : ''}</p>`);

    ${human ? `<div class="cmd"><span>$ blizzard runner takeover ${c.id}</span><button data-takeover="${c.id}"><u class="acc">T</u>ake over — copy</button></div>` : ''}
    <div class="facts">${facts.join('')}</div>
    ${hist ? `<h3>Node history</h3><table><tr><th>#</th><th>Node</th><th>Outcome</th><th>Next</th><th class="r">Tokens</th><th class="r">Cost</th><th class="r">At</th></tr>
      ${hist.map(h => `<tr class="${h[7] || ''}"><td>${h[0]}</td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]}</td><td class="r">${h[5]}</td><td class="r">${h[6]}</td><td class="r">${h[4]}</td></tr>`).join('')}</table>` : ''}

/* ---------- command palette ---------- */
const Palette = {
  items() {
    const cmds = [
      ...NEEDS.map(c => ({ k: 'take over', label: `Take over ${c.id} — ${c.title}`, x: 't', run: () => takeover(c.id) })),
      { k: 'go', label: 'Board', x: 'g b', run: () => go('board') },
      { k: 'go', label: 'Fleet', x: 'g f', run: () => go('fleet') },
      { k: 'view', label: 'Read the ready list', x: 'r', run: () => window.readReady?.() },
      { k: 'view', label: 'Daylight or night edition', x: '\\', run: () => Theme.toggle() },
      ...FLEET.runners.map(r => ({ k: 'runner', label: `Pause ${r.name}`, x: '', run: () => toast(`${r.name} paused — finishing held chunks`) })),
    ];
    const chunks = [...NEEDS, ...RUNNING, ...READY, ...DONE_TODAY].map(c => ({ k: c.id, label: c.title, x: NEEDS.includes(c) ? 'needs you' : RUNNING.includes(c) ? c.node : READY.includes(c) ? 'ready' : 'landed', run: () => openReader(c.id), human: NEEDS.includes(c) }));
    return [...cmds, ...chunks];
  },
  open(seed = '') {
    const p = $('.palette'); p.classList.add('on'); $('.scrim').classList.add('on');
    const i = p.querySelector('input'); i.value = seed; i.focus(); this.sel = 0; this.render();
  },
  render() {
    const q = $('.palette input').value.trim().toLowerCase();
    const all = this.items();
    const score = it => { const boost = it.human ? 60 : it.k === 'take over' ? 40 : 0; if (!q) return 1 + boost; const s = (it.k + ' ' + it.label).toLowerCase(); const i = s.indexOf(q); if (i >= 0) return 100 - Math.min(i, 60) + boost + (i === 0 || s[i - 1] === ' ' ? 20 : 0); let j = 0; for (const ch of s) if (ch === q[j]) j++; return j === q.length ? 10 + boost : 0; };
    this.list = all.map(it => [score(it), it]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => x[1]).slice(0, 14);
    const hi = s => { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
    $('.palette ol').innerHTML = this.list.map((it, n) => `<li class="${n === this.sel ? 'sel' : ''}" data-n="${n}"><span class="k ${it.human ? 'human' : ''}">${esc(it.k)}</span><span>${hi(it.label)}</span><span class="x">${esc(it.x)}</span></li>`).join('') || '<li><span></span><span class="dim it">Nothing matches.</span></li>';
    $$('.palette li[data-n]').forEach(li => li.onclick = () => { this.sel = +li.dataset.n; this.choose(); });
  },
  choose() { const it = this.list?.[this.sel]; closeAll(); it?.run(); },
  key(e) {
    if (e.key === 'ArrowDown') { this.sel = Math.min(this.sel + 1, this.list.length - 1); this.render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { this.sel = Math.max(this.sel - 1, 0); this.render(); e.preventDefault(); }
    else if (e.key === 'Enter') { this.choose(); e.preventDefault(); }
  },
};

function closeAll() { $$('.reader,.palette,.help,.scrim').forEach(e => e.classList.remove('on')); window.onCloseAll?.(); }
function go(where) { const mobile = /mobile/.test(location.pathname); location.href = `${where}-${mobile ? 'mobile' : 'desktop'}.html${location.search}`; }

/* ---------- keyboard: j/k walk the page in reading order ---------- */
const Keys = {
  pending: null,
  init(extra = {}) {
    document.addEventListener('keydown', e => {
      if ($('.palette.on')) { if (e.key === 'Escape') closeAll(); else Palette.key(e); return; }
      if (e.target.matches('input,textarea')) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); return; }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (this.pending === 'g') { this.pending = null; if (k === 'b') go('board'); if (k === 'f') go('fleet'); return; }
      if (k === 'Escape') { closeAll(); return; }
      if (k === '/' ) { e.preventDefault(); Palette.open(); return; }
      if (k === '?') { $('.help').classList.toggle('on'); $('.scrim').classList.toggle('on', $('.help').classList.contains('on')); return; }
      if (k === '\\') { Theme.toggle(); return; }
      if (k === 'g') { this.pending = 'g'; setTimeout(() => this.pending = null, 900); return; }
      if (k === 'j' || k === 'ArrowDown') { this.move(1); e.preventDefault(); return; }
      if (k === 'k' || k === 'ArrowUp') { this.move(-1); e.preventDefault(); return; }
      const cur = this.current();
      if (k === 'Enter' && cur) { cur.dataset.chunk ? openReader(cur.dataset.chunk) : cur.click(); return; }
      if (k === 't') { const id = cur?.dataset.chunk && NEEDS.find(n => n.id === cur.dataset.chunk) ? cur.dataset.chunk : NEEDS[0].id; takeover(id); return; }
      if (k === 'o' && cur?.dataset.chunk) { const c = chunkById(cur.dataset.chunk); toast(c?.pr ? `Opening PR ${c.pr}` : `${cur.dataset.chunk} has no open pull request`); return; }
      if (k === 'q' && cur?.dataset.chunk && NEEDS.find(n => n.id === cur.dataset.chunk)) { const id = cur.dataset.chunk; if (this.armed === id) { this.armed = null; toast(`Requeued ${id} at deliver — its environment is released`); } else { this.armed = id; setTimeout(() => this.armed === id && (this.armed = null), 2000); toast(`Requeue ${id}? Press q again`); } return; }
      extra[k]?.(e, cur);
    });
    document.addEventListener('focusin', e => { if (e.target.matches('[data-nav]')) { $$('[data-nav].focus').forEach(x => x.classList.remove('focus')); } });
  },
  current() { return document.activeElement?.matches?.('[data-nav]') ? document.activeElement : $('[data-nav].focus'); },
  move(d) {
    const all = $$('[data-nav]').filter(e => e.offsetParent !== null);
    const cur = this.current(); let i = all.indexOf(cur);
    i = i < 0 ? (d > 0 ? 0 : all.length - 1) : Math.max(0, Math.min(all.length - 1, i + d));
    all[i]?.focus({ preventScroll: false }); all[i]?.scrollIntoView({ block: 'nearest' });
  },
};

/* Since midnight, in ten-minute buckets: how many environments each workspace kept busy. Generated, deterministic, shaped by the day's real landings. */

/* Eighty runners on ten hosts: the same report, set as agate. Generated, deterministic. */
function scale() {

      const pace = rnd() < .12; humans += slots.filter(s => s === 'h').length; busy += slots.filter(s => s !== 'f').length; total += n; if (pace) pacing++;

}

  p: (e, cur) => toast('Pause r-claude or r-chatgpt? Choose from / — pausing finishes held chunks first'),
});
document.addEventListener('click', e => { const p = e.target.closest('[data-pause]'); if (p) toast(`${p.dataset.pause} paused — finishing its held chunks, claiming nothing new`); });
$$('[data-act]').forEach(b => b.onclick = () => ({ theme: () => Theme.toggle(), find: () => Palette.open(), help: () => { $('.help').classList.add('on'); $('.scrim').classList.add('on'); } })[b.dataset.act]());
if (location.hash === '#scaled') document.body.classList.add('scaled');
</script>
</body>
</html>
